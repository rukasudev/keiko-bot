[tool.ruff]
target-version = "py310"
line-length = 88
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "D1", "C901", "ARG", "RET"]
ignore = ["D105", "D107"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1", "ARG"]

[tool.mypy]
python_version = "3.10"
files = ["app/forms"]
explicit_package_bases = true
strict = true
follow_imports = "silent"
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["app.forms.adapters.*", "app.forms.features.*", "app.forms.observability"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["discord.*", "i18n.*", "yaml.*", "motor.*", "bson.*", "redis.*", "prometheus_client.*"]
ignore_missing_imports = true

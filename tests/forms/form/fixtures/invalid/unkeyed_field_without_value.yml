steps:
  - action: form
    key: form
    title: {en-us: "🧪 Fixture", pt-br: "🧪 Fixture"}
    description: {en-us: intro, pt-br: intro}
  - action: configuration_card
    key: card
    title: {en-us: Card, pt-br: Card}
    description: {en-us: card, pt-br: card}
    fields:
      - {key: title, label: {en-us: Title, pt-br: Título}}
    sections:
      - key: title
        icon: "💬"
        type: title-content
        label: {en-us: Text, pt-br: Texto}
        state: {mode: mode, title: title, content: body}
        default: {title: {en-us: a, pt-br: a}, content: {en-us: b, pt-br: b}}
        modal:
          title: {en-us: Text, pt-br: Texto}
      - key: extra
        icon: "💬"
        type: modal-input
        label: {en-us: Extra, pt-br: Extra}
        state: {}
        modal:
          title: {en-us: Extra, pt-br: Extra}
          fields:
            - {key: title, label: {en-us: Title, pt-br: Título}}
            - {label: {en-us: Message, pt-br: Mensagem}}
  - action: resume
    key: confirm
    title: {en-us: "ok?", pt-br: "ok?"}
    description: {en-us: review, pt-br: review}

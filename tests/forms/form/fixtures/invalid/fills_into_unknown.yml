steps:
  - action: form
    key: form
    title: {en-us: "🧪 Fixture", pt-br: "🧪 Fixture"}
    description: {en-us: intro, pt-br: intro}
  - action: configuration_card
    key: card
    title: {en-us: Card, pt-br: Card}
    description: {en-us: card, pt-br: card}
    sections:
      - key: streamer
        icon: "🎮"
        type: modal-input
        label: {en-us: Streamer, pt-br: Streamer}
        state:
          value: streamer
        fills:
          into: messages
          tokens:
            streamer: "{value}"
        modal:
          title: {en-us: Streamer, pt-br: Streamer}
          fields:
            - key: streamer
              label: {en-us: Nick, pt-br: Nick}
  - action: resume
    key: confirm
    title: {en-us: "ok?", pt-br: "ok?"}
    description: {en-us: review, pt-br: review}

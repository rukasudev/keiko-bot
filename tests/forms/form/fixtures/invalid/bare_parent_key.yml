steps:
  - type: intro
    key: form
    title: {en-us: "🧪 Fixture", pt-br: "🧪 Fixture"}
    description: {en-us: intro, pt-br: intro}
  - type: single_choice
    key: mode
    title: {en-us: Mode, pt-br: Modo}
    description: {en-us: pick, pt-br: escolha}
    options:
      - {label: {en-us: A, pt-br: A}, value: a}
      - {label: {en-us: B, pt-br: B}, value: b}
  - type: list
    key: links
    title: {en-us: Links, pt-br: Links}
    description: {en-us: list, pt-br: lista}
    items: {max: 3}
    steps:
      - type: text
        key: link
        title: {en-us: Link, pt-br: Link}
        description: {en-us: type, pt-br: digite}
        overrides:
          - when: {key: mode, not_in: [a]}
            description: {en-us: Other, pt-br: Outro}
  - type: review
    key: confirm
    title: {en-us: "ok?", pt-br: "ok?"}
    description: {en-us: review, pt-br: review}

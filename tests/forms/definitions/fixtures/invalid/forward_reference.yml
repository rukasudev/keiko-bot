steps:
  - action: form
    key: form
    title: {en-us: "🧪 Fixture", pt-br: "🧪 Fixture"}
    description: {en-us: intro, pt-br: intro}
  - action: modal
    key: name
    when: {key: mode, is: a}
    title: {en-us: Name, pt-br: Nome}
    description: {en-us: type, pt-br: digite}
    label: {en-us: Name, pt-br: Nome}
  - action: options
    key: mode
    title: {en-us: Mode, pt-br: Modo}
    description: {en-us: pick, pt-br: escolha}
    options:
      - label: {en-us: A, pt-br: A}
        value: a
      - label: {en-us: B, pt-br: B}
        value: b
  - action: resume
    key: confirm
    title: {en-us: "ok?", pt-br: "ok?"}
    description: {en-us: review, pt-br: review}

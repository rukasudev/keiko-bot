flows:
  manager_add_item.pt-br:
  - start_command notifications_youtube_video "pt-br":
    - send M1 form.panel
  - click add:
    - send M2 notification+add
    - delete M1
  - select channel ["general"]:
    - edit M2 notification+channel=general
  - click customize:youtuber:
    - modal youtuber
  - 'modal_submit {"O nome do canal no YouTube (com ou sem @)": "mrbeast"}':
    - edit M2 notification+modal_submit@manager_add_item
    - edit M2 notification+modal_submit@manager_add_item#2
  - click customize:messages:
    - modal notification_messages.random_message_1+customize:messages
  - 'modal_submit {"Mensagem Aleatória #1": "{youtuber} postou: {video_link}"}':
    - edit M2 notification+modal_submit@manager_add_item#3
  - click done:
    - edit M2 form.panel+done
  manager_disable.pt-br:
  - start_command notifications_youtube_video "pt-br":
    - send M1 form.panel
  - click disable:
    - send M2 delete
    - delete M1
  - click delete_all:
    - send M3 disabled
    - delete M2
  manager_edit_one_step.pt-br:
  - start_command notifications_youtube_video "pt-br":
    - send M1 form.panel
  - click section:notifications$0:
    - send M2 notification+section:notifications$0
    - delete M1
  - select channel ["announcements"]:
    - edit M2 notification+channel=announcements
  - click customize:youtuber:
    - modal youtuber+customize:youtuber
  - 'modal_submit {"O nome do canal no YouTube (com ou sem @)": "pewdiepie"}':
    - edit M2 notification+modal_submit@manager_edit_one_step
    - edit M2 notification+modal_submit@manager_edit_one_step#2
  - click customize:messages:
    - modal notification_messages.random_message_1+customize:messages@manager_edit_one_step
  - 'modal_submit {"Mensagem Aleatória #1": "{youtuber} postou: {video_link}"}':
    - edit M2 notification+modal_submit@manager_edit_one_step#3
  - click done:
    - edit M2 form.panel+done@manager_edit_one_step
  manager_history.pt-br:
  - start_command notifications_youtube_video "pt-br":
    - send M1 form.panel
  - click history:
    - send M2 screen
    - edit M2 changes.history
  manager_pause.pt-br:
  - start_command notifications_youtube_video "pt-br":
    - send M1 form.panel
  - click pause:
    - edit M1 form.panel+pause
    - send M2 paused (delete_after 5)
  manager_remove_item.pt-br:
  - start_command notifications_youtube_video "pt-br":
    - send M1 form.panel+start_command
  - click remove_this:notifications$0:
    - send M2 remove
    - delete M1
  - click remove_items:
    - send M3 form.panel+remove_items
    - delete M2
  manager_unpause.pt-br:
  - start_command notifications_youtube_video "pt-br":
    - send M1 form.panel+pause
  - click unpause:
    - edit M1 form.panel
    - send M2 unpaused (delete_after 5)
  setup_back.pt-br:
  - start_command notifications_youtube_video "pt-br":
    - send M1 form
  - click continue:
    - send M2 notification+continue
    - delete M1
  - select channel ["general"]:
    - edit M2 notification
  - click customize:youtuber:
    - modal youtuber
  - 'modal_submit {"O nome do canal no YouTube (com ou sem @)": "pewdiepie"}':
    - edit M2 notification+modal_submit
    - edit M2 notification+modal_submit@setup_back
  - select channel ["announcements"]:
    - edit M2 notification+channel=announcements@setup_back
  - click customize:youtuber:
    - modal youtuber+customize:youtuber
  - 'modal_submit {"O nome do canal no YouTube (com ou sem @)": "mrbeast"}':
    - edit M2 notification+modal_submit@setup_back#2
    - edit M2 notification+modal_submit@setup_back#3
  setup_cancel_discard.pt-br:
  - start_command notifications_youtube_video "pt-br":
    - send M1 form
  - click continue:
    - send M2 notification+continue
    - delete M1
  - select channel ["general"]:
    - edit M2 notification
  - click cancel:
    - send M3 discard
  - click Descartar tudo:
    - edit M2 notification+Descartar_tudo
    - delete M3
  setup_cancel_keep.pt-br:
  - start_command notifications_youtube_video "pt-br":
    - send M1 form
  - click continue:
    - send M2 notification+continue
    - delete M1
  - select channel ["general"]:
    - edit M2 notification
  - click cancel:
    - send M3 discard
  - click Continuar configurando:
    - delete M3
  setup_happy.en-us:
  - start_command notifications_youtube_video "en-us":
    - send M1 form
  - click continue:
    - send M2 notification+continue
    - delete M1
  - select channel ["general"]:
    - edit M2 notification
  - click customize:youtuber:
    - modal youtuber
  - 'modal_submit {"The YouTube channel name (with or without @)": "pewdiepie"}':
    - edit M2 notification+modal_submit
    - edit M2 notification+modal_submit@setup_back
  - click customize:messages:
    - modal notification_messages.random_message_1
  - 'modal_submit {"Random Message #1": "{youtuber} postou: {video_link}"}':
    - edit M2 notification+modal_submit@setup_happy
  - click done:
    - edit M2 form.review
  - click continue:
    - send M3 enabled
    - delete M2
    - send M4 form.panel+continue
  setup_happy.pt-br:
  - start_command notifications_youtube_video "pt-br":
    - send M1 form
  - click continue:
    - send M2 notification+continue
    - delete M1
  - select channel ["general"]:
    - edit M2 notification
  - click customize:youtuber:
    - modal youtuber
  - 'modal_submit {"O nome do canal no YouTube (com ou sem @)": "pewdiepie"}':
    - edit M2 notification+modal_submit
    - edit M2 notification+modal_submit@setup_back
  - click customize:messages:
    - modal notification_messages.random_message_1
  - 'modal_submit {"Mensagem Aleatória #1": "{youtuber} postou: {video_link}"}':
    - edit M2 notification+modal_submit@setup_happy
  - click done:
    - edit M2 form.review
  - click continue:
    - send M3 enabled
    - delete M2
    - send M4 form.panel+continue
  setup_validation_error_and_recover.pt-br:
  - start_command notifications_youtube_video "pt-br":
    - send M1 form
  - click continue:
    - send M2 notification+continue
    - delete M1
  - select channel ["general"]:
    - edit M2 notification
  - click customize:youtuber:
    - modal youtuber
  - 'modal_submit {"O nome do canal no YouTube (com ou sem @)": "naoexiste"}':
    - edit M2 notification+modal_submit
    - edit M2 notification
    - send M3 youtuber_not_found (delete_after 10)
  - click customize:youtuber:
    - modal youtuber+customize:youtuber@setup_validation_error_and_recover
  - 'modal_submit {"O nome do canal no YouTube (com ou sem @)": "pewdiepie"}':
    - edit M2 notification+modal_submit
    - edit M2 notification+modal_submit@setup_back

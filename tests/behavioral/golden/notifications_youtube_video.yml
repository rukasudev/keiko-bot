        - {type: thumbnail, media: KEIKO_DEFAULT.png}
      - type: section
        children:
        - {type: text, content: ':busts_in_silhouette: **⟨setup.ui.texts.categories.notifications⟩:** ⟨notifications_twitch.form.steps.notifications.counter: count=«1»; max=«2»⟩'}
        - {type: button, label: ⟨buttons.add.label⟩, style: secondary, disabled: false}
      - type: text
        content: |-
          ### ⟨setup.ui.texts.categories.notifications⟩ #1
          📺 **⟨vocabulary.texts.text_channel⟩:** <#100>
          🎬 **⟨vocabulary.texts.youtuber⟩:** pewdiepie
          💬 **⟨vocabulary.texts.notification_messages⟩:** ```• {youtuber} acabou de postar um novo vídeo!```
          📣 **⟨vocabulary.texts.mention⟩:** @everyone
      - type: actionrow
        children:
        - {type: button, label: ⟨buttons.edit.label⟩, style: secondary, disabled: false}
        - {type: button, label: ⟨buttons.preview.label⟩, style: secondary, disabled: false}
        - {type: button, label: ⟨buttons.remove.label⟩, style: danger, disabled: false}
      - {type: text, content: -# ⟨vocabulary.fallbacks.footer⟩}
    - type: actionrow
      children:
      - {type: button, label: ⟨buttons.pause.label⟩, style: secondary, disabled: false}
      - {type: button, label: ⟨buttons.disable.label⟩, style: secondary, disabled: false}
      - {type: button, label: ⟨buttons.history.label⟩, style: secondary, disabled: false}
      - {type: button, label: ⟨buttons.stats.label⟩, style: secondary, disabled: false}
      - {type: button, label: ⟨buttons.help.label⟩, style: secondary, disabled: false}
    components_v2: true
    rendered:
      pt-br:
      - '## ▶️ YouTube Vídeos'
      - Aviso no servidor quando estes canais postam um vídeo novo.
      - ':busts_in_silhouette: **Notificações:** 1 de 2 configurados'
      - Adicionar
      - |-
        ### Notificações #1
        📺 **Canal de Texto:** <#100>
        🎬 **Youtuber:** pewdiepie
        💬 **Mensagens de Notificação:** ```• {youtuber} acabou de postar um novo vídeo!```
        📣 **Mencionar:** @everyone
      - Editar
      - Pré-visualizar
      - Remover
      - -# • Use o comando `/reportar` para me contar um bug
      - Pausar
      - Desativar
      - Histórico
      - Estatísticas
      - Ajuda
  form.panel+pause:
    from: form.panel
    changes:
    - set components.0.children.0.children.0.content: '## ⟨notifications_youtube_video.form.steps.form.title⟩ (⟨texts.paused_suffix⟩)'

flows:
  manager_add_item.pt-br:
  - start_command block_links "pt-br":
    - send M1 form.panel
  - click add:
    - modal link
  - 'modal_submit {"Digite o link ou site": "spam.example.com"}':
    - send M2 form.panel+modal_submit
    - delete M1
  manager_disable.pt-br:
  - start_command block_links "pt-br":
    - send M1 form.panel
  - click disable:
    - send M2 delete
    - delete M1
  - click delete_all:
    - send M3 disabled
    - delete M2
  manager_edit_one_step.pt-br:
  - start_command block_links "pt-br":
    - send M1 form.panel
  - click section:link_settings:
    - send M2 link_settings+section:link_settings
    - delete M1
  - click customize:answer:
    - modal answer
  - 'modal_submit {"Digite minha resposta": "Sem links por aqui!"}':
    - edit M2 link_settings+modal_submit
  - click done:
    - edit M2 form.panel+done
  manager_history.pt-br:
  - start_command block_links "pt-br":
    - send M1 form.panel
  - click history:
    - send M2 screen
    - edit M2 changes.history
  manager_pause.pt-br:
  - start_command block_links "pt-br":
    - send M1 form.panel
  - click pause:
    - edit M1 form.panel+pause
    - send M2 paused (delete_after 5)
  manager_remove_item.pt-br:
  - start_command block_links "pt-br":
    - send M1 form.panel
  - click remove:
    - send M2 form+remove
    - delete M1
  - select Selecione os itens que deseja remover ["custom_links$0"]:
    - edit M2 remove
  - click remove_items:
    - send M3 form.panel+remove_items
    - delete M2
  manager_remove_several.pt-br:
  - start_command block_links "pt-br":
    - send M1 form.panel
  - click remove:custom_links:
    - send M2 form+remove
    - delete M1
  - select Selecione os itens que deseja remover ["custom_links$0", "custom_links$1"]:
    - edit M2 remove+custom_links$0,custom_links$1
  - click remove_items:
    - send M3 form.panel+remove_items@manager_remove_several
    - delete M2
  manager_unpause.pt-br:
  - start_command block_links "pt-br":
    - send M1 form.panel+pause
  - click unpause:
    - edit M1 form.panel
    - send M2 unpaused (delete_after 5)
  setup_back.pt-br:
  - start_command block_links "pt-br":
    - send M1 form
  - click continue:
    - send M2 link_settings
    - delete M1
  - click customize:exceptions:
    - edit M2 exceptions
  - select allowed_links ["youtube.com"]:
    - edit M2 exceptions+allowed_links=youtube.com@setup_back
  - click customize:own_links:
    - modal link
  - 'modal_submit {"Digite o link ou site": "youtube.com/watch?v=abc123"}':
    - send M3 match_type
    - delete M2
  - click back:
    - modal link+back
  - 'modal_submit {"Digite o link ou site": "spam.com"}':
    - send M4 exceptions+modal_submit
    - delete M3
  - click back:
    - edit M4 link_settings+back@setup_back
  - click done:
    - edit M4 form.review+done@setup_back
  setup_cancel_discard.pt-br:
  - start_command block_links "pt-br":
    - send M1 form
  - click continue:
    - send M2 link_settings
    - delete M1
  - select mode ["allow_all"]:
    - edit M2 link_settings+mode=allow_all
  - click cancel:
    - send M3 discard
  - click Descartar tudo:
    - edit M2 link_settings+Descartar_tudo
    - delete M3
  setup_cancel_keep.pt-br:
  - start_command block_links "pt-br":
    - send M1 form
  - click continue:
    - send M2 link_settings
    - delete M1
  - select mode ["allow_all"]:
    - edit M2 link_settings+mode=allow_all
  - click cancel:
    - send M3 discard
  - click Continuar configurando:
    - delete M3
  setup_choose_mode.pt-br:
  - start_command block_links "pt-br":
    - send M1 form
  - click continue:
    - send M2 link_settings
    - delete M1
  - select mode ["allow_all"]:
    - edit M2 link_settings+mode=allow_all
  setup_custom_links.pt-br:
  - start_command block_links "pt-br":
    - send M1 form
  - click continue:
    - send M2 link_settings
    - delete M1
  - select mode ["allow_all"]:
    - edit M2 link_settings+mode=allow_all
  - click customize:own_links:
    - modal link
  - 'modal_submit {"Digite o link ou site": "bit.ly/golpe"}':
    - send M3 match_type+modal_submit
    - delete M2
  - click option:🌐 Todos os links desse site:
    - send M4 link_settings+option:_Todos_os_links_desse_site
    - delete M3
  - click customize:own_links:
    - modal link
  - 'modal_submit {"Digite o link ou site": "spam.com"}':
    - edit M4 link_settings+modal_submit@setup_custom_links
  - click done:
    - edit M4 form.review+done@setup_custom_links
  - click continue:
    - send M5 enabled
    - delete M4
    - send M6 form.panel+continue@setup_custom_links
  setup_exceptions_screen.en-us:
  - start_command block_links "en-us":
    - send M1 form
  - click continue:
    - send M2 link_settings
    - delete M1
  - click customize:exceptions:
    - edit M2 exceptions
  - select allowed_chats ["general"]:
    - edit M2 exceptions+allowed_chats=general
  - select allowed_links ["youtube.com"]:
    - edit M2 exceptions+allowed_links=youtube.com
  - click back:
    - edit M2 link_settings+back
  - select mode ["allow_all"]:
    - edit M2 link_settings+mode=allow_all@setup_exceptions_screen
  - click customize:channel_exceptions:
    - edit M2 exceptions.channel_exceptions
  - click back:
    - edit M2 link_settings+mode=allow_all@setup_exceptions_screen
  - click done:
    - edit M2 form.review
  setup_exceptions_screen.pt-br:
  - start_command block_links "pt-br":
    - send M1 form
  - click continue:
    - send M2 link_settings
    - delete M1
  - click customize:exceptions:
    - edit M2 exceptions
  - select allowed_chats ["general"]:
    - edit M2 exceptions+allowed_chats=general
  - select allowed_links ["youtube.com"]:
    - edit M2 exceptions+allowed_links=youtube.com
  - click back:
    - edit M2 link_settings+back
  - select mode ["allow_all"]:
    - edit M2 link_settings+mode=allow_all@setup_exceptions_screen
  - click customize:channel_exceptions:
    - edit M2 exceptions.channel_exceptions
  - click back:
    - edit M2 link_settings+mode=allow_all@setup_exceptions_screen
  - click done:
    - edit M2 form.review
  setup_happy.en-us:
  - start_command block_links "en-us":
    - send M1 form
  - click continue:
    - send M2 link_settings
    - delete M1
  - click customize:exceptions:
    - edit M2 exceptions
  - select allowed_chats ["general"]:
    - edit M2 exceptions+allowed_chats=general
  - click back:
    - edit M2 link_settings+back@setup_happy
  - click done:
    - edit M2 form.review+done
  - click continue:
    - send M3 enabled
    - delete M2
    - send M4 form.panel+continue
  setup_happy.pt-br:
  - start_command block_links "pt-br":
    - send M1 form
  - click continue:
    - send M2 link_settings
    - delete M1
  - click customize:exceptions:
    - edit M2 exceptions
  - select allowed_chats ["general"]:
    - edit M2 exceptions+allowed_chats=general
  - click back:
    - edit M2 link_settings+back@setup_happy
  - click done:
    - edit M2 form.review+done
  - click continue:
    - send M3 enabled
    - delete M2
    - send M4 form.panel+continue
  setup_validation_error_and_recover.pt-br:
  - start_command block_links "pt-br":
    - send M1 form
  - click continue:
    - send M2 link_settings
    - delete M1
  - click customize:exceptions:
    - edit M2 exceptions
  - click customize:own_links:
    - modal link
  - 'modal_submit {"Digite o link ou site": "isso nao e um link"}':
    - edit M2 link.card
    - send M3 link_not_recognized (delete_after 10)
  - click customize:link:
    - modal link+customize:link
  - 'modal_submit {"Digite o link ou site": "https://meusite.com.br/promo/"}':
    - send M4 match_type+modal_submit@setup_validation_error_and_recover
    - delete M2
  - click option:🌐 Todos os links desse site:
    - send M5 exceptions+option:_Todos_os_links_desse_site
    - delete M4

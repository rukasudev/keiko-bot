screens:
  commands.panel:
    ephemeral: true
    components:
    - type: container
      children:
      - type: section
        children:
        - {type: text, content: '## ⟨stream_elements_commands.ui.records.commands.title⟩'}
        - {type: text, content: ⟨stream_elements_commands.form.steps.form.panel.description⟩}
        - {type: thumbnail, media: KEIKO_DEFAULT.png}
      - type: section
        children:
        - {type: text, content: '🎮 **⟨notifications_twitch.ui.announcement.fields.streamer⟩:** shroud'}
        - {type: button, label: ⟨buttons.edit.label⟩, style: secondary, disabled: false}
      - type: section
        children:
        - type: text
          content: |-
            ### ⟨stream_elements_commands.command.panel.info.title⟩
            ⟨stream_elements_commands.command.panel.info.overrides.0.description⟩
        - {type: button, label: ⟨stream_elements_commands.ui.buttons.commands.label⟩, style: secondary, disabled: false}
      - {type: text, content: -# ⟨vocabulary.fallbacks.footer⟩}
    - type: actionrow
      children:
      - {type: button, label: ⟨buttons.pause.label⟩, style: secondary, disabled: false}
      - {type: button, label: ⟨buttons.disable.label⟩, style: secondary, disabled: false}
      - {type: button, label: ⟨buttons.history.label⟩, style: secondary, disabled: false}
      - {type: button, label: ⟨buttons.stats.label⟩, style: secondary, disabled: false}
      - {type: button, label: ⟨buttons.help.label⟩, style: secondary, disabled: false}
    components_v2: true
    rendered:
      en-us:
      - '## 🎮 StreamElements Commands'
      - I answer this streamer's StreamElements commands here on Discord.
      - 🎮 **Streamer:** shroud
      - Edit
      - |-
        ### 💡 Commands loaded
        I couldn't reach StreamElements right now, but I'll fetch each response as soon as someone uses a command.
      - Commands
      - -# • Use the `/report` command to tell me a bug
      - Pause
      - Disable
      - History
      - Statistics
      - Help
      pt-br:
      - '## 🎮 Comandos do StreamElements'
      - Respondo aos comandos do StreamElements deste streamer aqui no Discord.
      - 🎮 **Streamer:** shroud
      - Editar
      - |-
        ### 💡 Comandos carregados
        Não consegui falar com o StreamElements agora, mas busco a resposta assim que alguém usar um comando.
      - Comandos
      - -# • Use o comando `/reportar` para me contar um bug
      - Pausar
      - Desativar
      - Histórico
      - Estatísticas
      - Ajuda
  commands.panel+pause:
    from: commands.panel
    changes:
    - set components.0.children.0.children.0.content: '## ⟨stream_elements_commands.ui.records.commands.title⟩ (⟨texts.paused_suffix⟩)'
    - set components.1.children.0.label: ⟨buttons.unpause.label⟩
  commands.panel+modal_submit:
    from: commands.panel
    changes:
    - set components.0.children.1.children.1.disabled: true
    - set components.0.children.2.children.1.disabled: true
    - set components.1.children.0.disabled: true
    - set components.1.children.1.disabled: true
    - set components.1.children.2.disabled: true
    - set components.1.children.3.disabled: true
    - set components.1.children.4.disabled: true
  commands.panel+modal_submit@manager_edit_one_step:
    from: commands.panel
    changes:
    - set components.0.children.1.children.0.content: 🎮 **⟨notifications_twitch.ui.announcement.fields.streamer⟩:** gaules
  delete:
    ephemeral: true
    embed:
      title: ⟨commands.responses.delete.title⟩
      description: '⟨commands.responses.delete.description: command_name=«⟨texts.groups.integrations⟩ ⟨stream_elements_commands.command.slash.subgroup⟩ ⟨stream_elements_commands.command.slash.name⟩»⟩'
      fields: []
      footer: null
      color: 16711680
      thumbnail: null
      image: null
    components:
    - {type: button, label: ⟨buttons.delete_all.label⟩, style: danger, disabled: false}
    - {type: button, label: ⟨buttons.back.label⟩, style: secondary, disabled: false}
    components_v2: false
  disabled:
    ephemeral: true
    embed:
      title: ⟨commands.responses.disabled.title⟩
      description: |-
        ⟨commands.responses.disabled.description: command_name=«⟨texts.groups.integrations⟩ ⟨stream_elements_commands.command.slash.subgroup⟩ ⟨stream_elements_commands.command.slash.name⟩»; date=«<t:1767268800:f>»; user=«<@555>»⟩

        -# ⟨vocabulary.fallbacks.footer⟩
      fields: []
      footer: null
      color: 5216249
      thumbnail: null
      image: null
    components: []
    components_v2: false
  streamer:
    modal:
      title: ⟨notifications_twitch.ui.announcement.fields.streamer⟩
      fields:
      - {label: ⟨stream_elements_commands.form.steps.streamer.label⟩, required: true, style: short, max_length: 30, default: ''}
  streamer+section:streamer:
    from: streamer
    changes:
    - set modal.fields.0.default: shroud
  streamer+customize:streamer:
    from: streamer
    changes:
    - set modal.fields.0.default: naoexiste
  screen:
    ephemeral: true
    components:
    - {type: button, label: '|<', style: success, disabled: false}
    - {type: button, label: <, style: primary, disabled: false}
    - {type: button, label: '>', style: primary, disabled: false}
    - {type: button, label: '>|', style: success, disabled: false}
    components_v2: false
  changes.history:
    ephemeral: true
    embed:
      title: ⟨commands.records.changes.title⟩
      description: '⟨commands.records.history.description: command_name=«⟨texts.groups.integrations⟩ ⟨stream_elements_commands.command.slash.subgroup⟩ ⟨stream_elements_commands.command.slash.name⟩»⟩'
      fields:
      - {name: 1. ⟨commands.records.history.lines.edited⟩, value: '<@555> · <t:1767263400:f>', inline: false}
      - {name: 2. ⟨commands.records.history.lines.enabled⟩, value: '<@555> · <t:1767259800:f>', inline: false}
      footer: • ⟨texts.page⟩ 1 / 1
      color: 5216249
      thumbnail: KEIKO_NERD.png
      image: null
    components:
    - {type: button, label: '|<', style: success, disabled: true}
    - {type: button, label: <, style: primary, disabled: true}
    - {type: button, label: '>', style: primary, disabled: true}
    - {type: button, label: '>|', style: success, disabled: true}
    components_v2: false
  paused:
    ephemeral: true
    embed:
      title: ⟨commands.responses.paused.title⟩
      description: |-
        ⟨commands.responses.paused.description: command_name=«⟨texts.groups.integrations⟩ ⟨stream_elements_commands.command.slash.subgroup⟩ ⟨stream_elements_commands.command.slash.name⟩»; date=«<t:1767268800:f>»; user=«<@555>»⟩

        -# ⟨vocabulary.fallbacks.footer⟩
      fields: []
      footer: null
      color: 5216249
      thumbnail: null
      image: null
    components: []
    components_v2: false
  unpaused:
    ephemeral: true
    embed:
      title: ⟨commands.responses.unpaused.title⟩
      description: |-
        ⟨commands.responses.unpaused.description: command_name=«⟨texts.groups.integrations⟩ ⟨stream_elements_commands.command.slash.subgroup⟩ ⟨stream_elements_commands.command.slash.name⟩»; date=«<t:1767268800:f>»; user=«<@555>»⟩

        -# ⟨vocabulary.fallbacks.footer⟩
      fields: []
      footer: null
      color: 5216249
      thumbnail: null
      image: null
    components: []
    components_v2: false
  commands.form:
    ephemeral: true
    embed:
      title: ⟨stream_elements_commands.ui.records.commands.title⟩
      description: |-
        ⟨stream_elements_commands.form.steps.form.description: prefix=«ks!»⟩

        :pencil: **⟨texts.settings_heading⟩**

        :flying_disc: **⟨notifications_twitch.ui.announcement.fields.streamer⟩:** ⟨stream_elements_commands.form.steps.streamer.description⟩

        -# ⟨vocabulary.fallbacks.footer⟩
      fields: []
      footer: null
      color: 5216249
      thumbnail: KEIKO_DEFAULT.png
      image: null
    components:
    - {type: button, label: ⟨buttons.confirm.label⟩, style: success, disabled: false}
    - {type: button, label: ⟨buttons.cancel.label⟩, style: danger, disabled: false}
    components_v2: false
  commands.form+modal_submit:
    from: commands.form
    changes:
    - set components.0.disabled: true
    - set components.1.disabled: true
  commands.confirm:
    ephemeral: true
    components:
    - type: container
      children:
      - type: section
        children:
        - {type: text, content: '## ⟨stream_elements_commands.ui.records.commands.title⟩'}
        - {type: text, content: '⟨stream_elements_commands.form.steps.confirm.description: prefix=«ks!»; streamer=«shroud»⟩'}
        - {type: thumbnail, media: KEIKO_BOLO.png}
      - type: section
        children:
        - {type: text, content: '🎮 **⟨notifications_twitch.ui.announcement.fields.streamer⟩:** shroud'}
        - {type: button, label: ⟨buttons.edit.label⟩, style: secondary, disabled: false}
      - {type: media, count: 1}
      - {type: text, content: '💡 **⟨stream_elements_commands.form.steps.confirm.lines.0.label⟩:** 2'}
      - {type: text, content: -# ⟨vocabulary.fallbacks.footer⟩}
    - type: actionrow
      children:
      - {type: button, label: ⟨buttons.confirm.label⟩, style: success, disabled: false}
      - {type: button, label: ⟨buttons.cancel.label⟩, style: danger, disabled: false}
    components_v2: true
    rendered:
      en-us:
      - '## 🎮 StreamElements Commands'
      - Whenever someone uses a command with the **ks!** prefix, I fetch the response in `shroud`'s StreamElements and send it in chat!
      - 🎮 **Streamer:** shroud
      - Edit
      - 💡 **Active commands:** 2
      - -# • Use the `/report` command to tell me a bug
      - Confirm
      - Cancel
      pt-br:
      - '## 🎮 Comandos do StreamElements'
      - Sempre que alguém usar um comando com o prefixo **ks!**, eu busco a resposta no StreamElements de `shroud` e envio no chat!
      - 🎮 **Streamer:** shroud
      - Editar
      - 💡 **Comandos ativos:** 2
      - -# • Use o comando `/reportar` para me contar um bug
      - Confirmar
      - Cancelar
  commands.confirm+Descartar_tudo:
    from: commands.confirm
    changes:
    - drop components.0.children.1.children: null
    - set components.0.children.1.type: text
    - set components.0.children.1.content: 🎮 **⟨notifications_twitch.ui.announcement.fields.streamer⟩:** shroud
    - drop components.1: null
  discard:
    ephemeral: true
    embed:
      title: ⟨commands.responses.discard.title⟩
      description: ⟨commands.responses.discard.description⟩
      fields: []
      footer: null
      color: 16711680
      thumbnail: null
      image: null
    components:
    - {type: button, label: ⟨buttons.keep.label⟩, style: secondary, disabled: false}
    - {type: button, label: ⟨buttons.discard.label⟩, style: danger, disabled: false}
    components_v2: false
  enabled:
    ephemeral: true
    embed:
      title: ⟨commands.responses.enabled.title⟩
      description: |-
        ⟨commands.responses.enabled.description: command_name=«⟨texts.groups.integrations⟩ ⟨stream_elements_commands.command.slash.subgroup⟩ ⟨stream_elements_commands.command.slash.name⟩»; date=«<t:1767268800:f>»; user=«<@555>»⟩

        -# ⟨vocabulary.fallbacks.footer⟩
      fields: []
      footer: null
      color: 5216249
      thumbnail: null
      image: null
    components: []
    components_v2: false
  streamer.card:
    ephemeral: true
    components:
    - type: container
      children:
      - type: section
        children:
        - {type: text, content: '## ⟨notifications_twitch.ui.announcement.fields.streamer⟩'}
        - {type: text, content: ⟨stream_elements_commands.form.steps.streamer.description⟩}
        - {type: thumbnail, media: KEIKO_DEFAULT.png}
      - type: text
        content: |-
          🎮 **⟨stream_elements_commands.form.steps.streamer.label⟩**
          > naoexiste
      - type: actionrow
        children:
        - {type: button, label: ⟨buttons.edit.label⟩, style: secondary, disabled: false}
    - type: actionrow
      children:
      - {type: button, label: ⟨buttons.cancel.label⟩, style: danger, disabled: false}
    components_v2: true
  streamer.card+modal_submit:
    from: streamer.card
    changes:
    - set components.0.children.2.children.0.disabled: true
    - set components.1.children.0.disabled: true
  streamer_not_found:
    ephemeral: true
    embed:
      title: 🚨 ⟨errors.streamer_not_found.title⟩
      description: |-
        ⟨errors.streamer_not_found.message⟩

        -# ⟨vocabulary.fallbacks.footer⟩
      fields: []
      footer: null
      color: 16711680
      thumbnail: null
      image: null
    components: []
    components_v2: false
flows:
  manager_disable.pt-br:
  - start_command stream_elements_commands "pt-br":
    - send M1 commands.panel
  - click disable:
    - send M2 delete
    - delete M1
  - click delete_all:
    - send M3 disabled
    - delete M2
  manager_edit_one_step.pt-br:
  - start_command stream_elements_commands "pt-br":
    - send M1 commands.panel
  - click section:streamer:
    - modal streamer+section:streamer
  - 'modal_submit {"Username do streamer": "gaules"}':
    - edit M1 commands.panel+modal_submit
    - send M2 commands.panel+modal_submit@manager_edit_one_step
    - delete M1
  manager_history.pt-br:
  - start_command stream_elements_commands "pt-br":
    - send M1 commands.panel
  - click history:
    - send M2 screen
    - edit M2 changes.history
  manager_pause.pt-br:
  - start_command stream_elements_commands "pt-br":
    - send M1 commands.panel
  - click pause:
    - edit M1 commands.panel+pause
    - send M2 paused (delete_after 5)
  manager_unpause.pt-br:
  - start_command stream_elements_commands "pt-br":
    - send M1 commands.panel+pause
  - click unpause:
    - edit M1 commands.panel
    - send M2 unpaused (delete_after 5)
  setup_cancel_discard.pt-br:
  - start_command stream_elements_commands "pt-br":
    - send M1 commands.form
  - click continue:
    - modal streamer
  - 'modal_submit {"Username do streamer": "shroud"}':
    - edit M1 commands.form+modal_submit
    - send M2 commands.confirm
    - delete M1
  - click cancel:
    - send M3 discard
  - click Descartar tudo:
    - edit M2 commands.confirm+Descartar_tudo
    - delete M3
  setup_cancel_keep.pt-br:
  - start_command stream_elements_commands "pt-br":
    - send M1 commands.form
  - click continue:
    - modal streamer
  - 'modal_submit {"Username do streamer": "shroud"}':
    - edit M1 commands.form+modal_submit
    - send M2 commands.confirm
    - delete M1
  - click cancel:
    - send M3 discard
  - click Continuar configurando:
    - delete M3
  setup_happy.en-us:
  - start_command stream_elements_commands "en-us":
    - send M1 commands.form
  - click continue:
    - modal streamer
  - 'modal_submit {"Streamer username": "shroud"}':
    - edit M1 commands.form+modal_submit
    - send M2 commands.confirm
    - delete M1
  - click continue:
    - send M3 enabled
    - delete M2
    - send M4 commands.panel
  setup_happy.pt-br:
  - start_command stream_elements_commands "pt-br":
    - send M1 commands.form
  - click continue:
    - modal streamer
  - 'modal_submit {"Username do streamer": "shroud"}':
    - edit M1 commands.form+modal_submit
    - send M2 commands.confirm
    - delete M1
  - click continue:
    - send M3 enabled
    - delete M2
    - send M4 commands.panel
  setup_validation_error_and_recover.pt-br:
  - start_command stream_elements_commands "pt-br":
    - send M1 commands.form
  - click continue:
    - modal streamer
  - 'modal_submit {"Username do streamer": "naoexiste"}':
    - edit M1 commands.form+modal_submit
    - send M2 streamer.card
    - delete M1
    - send M3 streamer_not_found (delete_after 10)
  - click customize:streamer:
    - modal streamer+customize:streamer
  - 'modal_submit {"Username do streamer": "shroud"}':
    - edit M2 streamer.card+modal_submit
    - edit M2 commands.confirm

flows:
  manager_disable.pt-br:
  - start_command welcome_messages "pt-br":
    - send M1 form.panel
  - click disable:
    - send M2 delete
    - delete M1
  - click delete_all:
    - send M3 disabled
    - delete M2
  manager_edit_design.pt-br:
  - start_command welcome_messages "pt-br":
    - send M1 form.panel
  - click section:welcome_config/design:
    - edit M1 form.panel+section:welcome_config_design
    - send M2 header.server_blur
    - delete M1
  - click design:custom_blur:
    - edit M2 form.welcome_config+design:custom_blur
    - send M3 required_fields (delete_after 10)
  manager_edit_one_step.pt-br:
  - start_command welcome_messages "pt-br":
    - send M1 form.panel
  - click section:welcome_config/channel:
    - send M2 screen.channel
    - delete M1
  - select Selecione um canal... ["announcements"]:
    - edit M2 form.panel+announcements
  manager_history.pt-br:
  - start_command welcome_messages "pt-br":
    - send M1 form.panel
  - click history:
    - send M2 screen
    - edit M2 changes.history
  manager_pause.pt-br:
  - start_command welcome_messages "pt-br":
    - send M1 form.panel
  - click pause:
    - edit M1 form.panel+pause
    - send M2 paused (delete_after 5)
  manager_unpause.pt-br:
  - start_command welcome_messages "pt-br":
    - send M1 form.panel+pause
  - click unpause:
    - edit M1 form.panel
    - send M2 unpaused (delete_after 5)
  setup_back.pt-br:
  - start_command welcome_messages "pt-br":
    - send M1 form
  - click continue:
    - edit M1 form+continue
    - send M2 form.welcome_config+continue
    - delete M1
  - select welcome_messages_channel ["welcome"]:
    - edit M2 form.welcome_config
  - select welcome_design ["custom_blur"]:
    - edit M2 form.welcome_config+welcome_design=custom_blur
  - select welcome_design ["server_blur"]:
    - edit M2 form.welcome_config
  - select welcome_messages_channel ["announcements"]:
    - edit M2 form.welcome_config+welcome_messages_channel=announcements
  - click done:
    - edit M2 form.review
  setup_cancel_discard.pt-br:
  - start_command welcome_messages "pt-br":
    - send M1 form
  - click continue:
    - edit M1 form+continue
    - send M2 form.welcome_config+continue
    - delete M1
  - select welcome_messages_channel ["welcome"]:
    - edit M2 form.welcome_config
  - click cancel:
    - send M3 discard
  - click Descartar tudo:
    - edit M2 form.welcome_config+Descartar_tudo
    - delete M3
  setup_cancel_keep.pt-br:
  - start_command welcome_messages "pt-br":
    - send M1 form
  - click continue:
    - edit M1 form+continue
    - send M2 form.welcome_config+continue
    - delete M1
  - select welcome_messages_channel ["welcome"]:
    - edit M2 form.welcome_config
  - click cancel:
    - send M3 discard
  - click Continuar configurando:
    - delete M3
  setup_custom_image.pt-br:
  - start_command welcome_messages "pt-br":
    - send M1 form
  - click continue:
    - edit M1 form+continue
    - send M2 form.welcome_config+continue
    - delete M1
  - select welcome_messages_channel ["welcome"]:
    - edit M2 form.welcome_config
  - select welcome_design ["custom_only"]:
    - edit M2 form.welcome_config+welcome_design=custom_only
  - click customize:image:
    - modal image
  - 'modal_submit {"file": "custom-banner.png"}':
    - edit M2 form.welcome_config+modal_submit
    - edit M2 form.welcome_config+modal_submit@setup_custom_image
  - click customize:messages:
    - modal form.texts
  - 'modal_submit {"Título": "Bem-vindo, {user}!", "Rodapé": "Leia as regras :)"}':
    - edit M2 form.welcome_config+modal_submit@setup_custom_image#2
  - click done:
    - edit M2 form.review+done
  - click continue:
    - send M3 enabled
    - delete M2
    - send M4 form.panel+continue
  setup_happy.en-us:
  - start_command welcome_messages "en-us":
    - send M1 form
  - click continue:
    - edit M1 form+continue
    - send M2 form.welcome_config+continue@setup_happy
    - delete M1
  - select welcome_messages_channel ["welcome"]:
    - edit M2 form.welcome_config+welcome_messages_channel=welcome
  - click customize:messages:
    - modal form.texts+customize:messages
  - 'modal_submit {"Title": "Bem-vindo, {user}!", "Footer": "Leia as regras :)"}':
    - edit M2 form.welcome_config+modal_submit@setup_happy
  - click done:
    - edit M2 form.review+done@setup_happy
  - click continue:
    - send M3 enabled
    - delete M2
    - send M4 form.panel+continue@setup_happy
  setup_happy.pt-br:
  - start_command welcome_messages "pt-br":
    - send M1 form
  - click continue:
    - edit M1 form+continue
    - send M2 form.welcome_config+continue
    - delete M1
  - select welcome_messages_channel ["welcome"]:
    - edit M2 form.welcome_config
  - click customize:messages:
    - modal form.texts
  - 'modal_submit {"Título": "Bem-vindo, {user}!", "Rodapé": "Leia as regras :)"}':
    - edit M2 form.welcome_config+modal_submit@setup_happy#2
  - click done:
    - edit M2 form.review+done@setup_happy#2
  - click continue:
    - send M3 enabled
    - delete M2
    - send M4 form.panel+continue@setup_happy#2

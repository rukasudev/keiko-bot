flows:
  manager_add_item.pt-br:
  - start_command reminders_birthday "pt-br":
    - send M1 form.panel
  - click add:
    - send M2 header.birthday_member_config+add
    - delete M1
  - select user ["Amiga"]:
    - edit M2 header.birthday_member_config+user=Amiga
  - select month ["02"]:
    - edit M2 header.birthday_member_config
  - click customize:day:
    - modal day
  - 'modal_submit {"Dia": "31"}':
    - edit M2 header.birthday_member_config
    - send M3 invalid_date (delete_after 10)
  - click customize:day:
    - modal day+customize:day
  - 'modal_submit {"Dia": "28"}':
    - edit M2 header.birthday_member_config+modal_submit
  - click done:
    - edit M2 form.panel+done
  manager_disable.pt-br:
  - start_command reminders_birthday "pt-br":
    - send M1 form.panel
  - click disable:
    - send M2 delete
    - delete M1
  - click delete_all:
    - send M3 disabled
    - delete M2
  manager_edit_one_step.pt-br:
  - start_command reminders_birthday "pt-br":
    - send M1 form.panel
  - click edit:group:settings:
    - edit M1 header.channel
  - click section:birthday_config:
    - send M2 header.birthday_config+section:birthday_config
    - delete M1
  - select notification_time ["10:00"]:
    - edit M2 header.birthday_config+notification_time=10:00
  - select mention ["everyone"]:
    - edit M2 header.birthday_config+mention=everyone
  - click done:
    - edit M2 header.channel+done
  manager_empty_list.en-us:
  - start_command reminders_birthday "en-us":
    - send M1 form.panel+start_command@manager_empty_list
  manager_empty_list.pt-br:
  - start_command reminders_birthday "pt-br":
    - send M1 form.panel+start_command@manager_empty_list
  manager_history.pt-br:
  - start_command reminders_birthday "pt-br":
    - send M1 form.panel
  - click history:
    - send M2 screen
    - edit M2 changes.history
  manager_month_pages.pt-br:
  - start_command reminders_birthday "pt-br":
    - send M1 form.panel+start_command
  - click page:1:
    - edit M1 form.panel+page:1
  - click page:0:
    - edit M1 form.panel+start_command
  manager_pause.pt-br:
  - start_command reminders_birthday "pt-br":
    - send M1 form.panel
  - click pause:
    - edit M1 form.panel+pause
    - send M2 paused (delete_after 5)
  manager_remove_item.pt-br:
  - start_command reminders_birthday "pt-br":
    - send M1 form.panel+start_command
  - click search:
    - send M2 search_member
    - delete M1
  - select Selecione um membro... ["Tester"]:
    - send M3 screen.date

screens:
  form.panel:
    ephemeral: true
    components:
    - type: container
      children:
      - type: section
        children:
        - {type: text, content: '## ⟨default_roles.form.steps.form.title⟩'}
        - {type: text, content: ⟨default_roles.form.steps.form.panel.description⟩}
        - {type: thumbnail, media: KEIKO_DEFAULT.png}
      - type: section
        children:
        - {type: text, content: '👥 **⟨vocabulary.texts.roles_for_members⟩:** <@&202>'}
        - {type: button, label: ⟨buttons.edit.label⟩, style: secondary, disabled: false}
      - type: section
        children:
        - {type: text, content: '🤖 **⟨vocabulary.texts.roles_for_bots⟩:** <@&201>'}
        - {type: button, label: ⟨buttons.edit.label⟩, style: secondary, disabled: false}
      - type: section
        children:
        - {type: text, content: '⏳ **⟨vocabulary.texts.roles_by_time⟩:** ⟨texts.empty_value⟩'}
        - {type: button, label: ⟨buttons.edit.label⟩, style: secondary, disabled: false}
      - {type: text, content: -# ⟨vocabulary.fallbacks.footer⟩}
    - type: actionrow
      children:
      - {type: button, label: ⟨buttons.pause.label⟩, style: secondary, disabled: false}
      - {type: button, label: ⟨buttons.disable.label⟩, style: secondary, disabled: false}
      - {type: button, label: ⟨buttons.history.label⟩, style: secondary, disabled: false}
      - {type: button, label: ⟨default_roles.ui.buttons.sync.label⟩, style: secondary, disabled: false}
      - {type: button, label: ⟨buttons.stats.label⟩, style: secondary, disabled: false}
    - type: actionrow
      children:
      - {type: button, label: ⟨buttons.help.label⟩, style: secondary, disabled: false}
    components_v2: true
    rendered:
      pt-br:
      - '## 👩‍🎓 Cargos Automáticos'
      - Dou estes cargos automaticamente para quem entra no servidor, e cada cargo por tempo quando o membro completa o tempo dele no servidor.
      - 👥 **Cargos para Membros:** <@&202>
      - Editar
      - 🤖 **Cargos para Bots:** <@&201>
      - Editar
      - ⏳ **Cargos por tempo no servidor:** Em branco
      - Editar
      - -# • Use o comando `/reportar` para me contar um bug
      - Pausar
      - Desativar
      - Histórico
      - Sincronizar
      - Estatísticas
      - Ajuda
  form.panel+start_command:
    from: form.panel
    changes:
    - set components.0.children.2.children.0.content: 🤖 **⟨vocabulary.texts.roles_for_bots⟩:** ⟨texts.empty_value⟩
  form.panel+pause:
    from: form.panel
    changes:
    - set components.0.children.0.children.0.content: '## ⟨default_roles.form.steps.form.title⟩ (⟨texts.paused_suffix⟩)'
    - add components.0.children.1: {type: text, content: '### ⟨default_roles.form.steps.form.title (no emoji)⟩'}
    - set components.1.children.0.label: ⟨buttons.unpause.label⟩
  form.panel+continue:
    from: form.panel
    changes:
    - add components.0.children.1:
        type: section
        children:
        - {type: text, content: '🤖 **⟨vocabulary.texts.roles_for_bots⟩:** <@&201>'}
        - {type: button, label: ⟨buttons.edit.label⟩, style: secondary, disabled: false}
    - drop components.0.children.3: null
    rendered:
      en-us:
      - '## 👩‍🎓 Auto Roles'
      - I give these roles automatically to everyone who joins the server, and each time role once a member reaches its time in the server.
      - 🤖 **Roles for Bots:** <@&201>
      - Edit
      - 👥 **Roles for Members:** <@&202>
      - Edit
      - ⏳ **Roles by time in the server:** Empty
      - Edit
      - -# • Use the `/report` command to tell me a bug
      - Pause
      - Disable
      - History
      - Sync
      - Statistics
      - Help

flows:
  manager_add_rung.pt-br:
  - start_command default_roles "pt-br":
    - send M1 form.panel
  - click edit:group:ladder:
    - edit M1 roles_by_time.screen+edit:group:ladder
  - click add:role_ladder:
    - send M2 rung+add:role_ladder
    - delete M1
  - click customize:time:
    - modal time.amount
  - 'modal_submit {"Quanto tempo (só o número)": "30", "Em dias, semanas, meses ou anos?": "days"}':
    - edit M2 rung+modal_submit@manager_add_rung
  - select role ["Moderator"]:
    - edit M2 rung+role=Moderator
  - click done:
    - edit M2 roles_by_time.screen+done@manager_add_rung
  manager_disable.pt-br:
  - start_command default_roles "pt-br":
    - send M1 form.panel
  - click disable:
    - send M2 delete
    - delete M1
  - click delete_all:
    - send M3 disabled
    - delete M2
  manager_edit_one_step.pt-br:
  - start_command default_roles "pt-br":
    - send M1 form.panel
  - click section:default_roles_config/default_roles:
    - send M2 roles_for_members.screen
    - delete M1
  - select default_roles ["Moderator"]:
    - edit M2 form.panel+default_roles=Moderator
  manager_history.pt-br:
  - start_command default_roles "pt-br":
    - send M1 form.panel
  - click history:
    - send M2 screen
    - edit M2 changes.history
  manager_keeps_one_setting.pt-br:
  - start_command default_roles "pt-br":
    - send M1 form.panel+start_command
  - click section:default_roles_config/default_roles:
    - send M2 roles_for_members.screen
    - delete M1
  - select default_roles []:
    - send M3 keep_one_field
    - edit M2 form.panel+start_command
  manager_pause.pt-br:
  - start_command default_roles "pt-br":
    - send M1 form.panel
  - click pause:
    - edit M1 form.panel+pause
    - send M2 paused (delete_after 5)
  manager_unpause.pt-br:
  - start_command default_roles "pt-br":
    - send M1 form.panel+pause
  - click unpause:
    - edit M1 form.panel
    - send M2 unpaused (delete_after 5)
  setup_cancel_discard.pt-br:
  - start_command default_roles "pt-br":
    - send M1 form
  - click continue:
    - send M2 form.default_roles_config
    - delete M1
  - select default_roles ["Member"]:
    - edit M2 form.default_roles_config+default_roles=Member
  - click cancel:
    - send M3 discard
  - click Descartar tudo:
    - edit M2 form.default_roles_config+Descartar_tudo
    - delete M3
  setup_cancel_keep.pt-br:
  - start_command default_roles "pt-br":
    - send M1 form
  - click continue:
    - send M2 form.default_roles_config
    - delete M1
  - select default_roles ["Member"]:
    - edit M2 form.default_roles_config+default_roles=Member
  - click cancel:
    - send M3 discard
  - click Continuar configurando:
    - delete M3
  setup_gives_the_roles_now.pt-br:
  - start_command default_roles "pt-br":
    - send M1 form
  - click continue:
    - send M2 form.default_roles_config
    - delete M1
  - select default_roles ["Member"]:
    - edit M2 form.default_roles_config+default_roles=Member
  - click done:
    - send M3 sync_existing+done
    - delete M2
  - click pick:True:
    - send M4 form.review+pick:True
    - delete M3
  - click continue:
    - send M5 enabled
    - delete M4
    - send M6 form.panel+continue@setup_gives_the_roles_now
  setup_happy.en-us:
  - start_command default_roles "en-us":
    - send M1 form
  - click continue:
    - send M2 form.default_roles_config
    - delete M1
  - select default_roles ["Member"]:
    - edit M2 form.default_roles_config+default_roles=Member
  - select default_roles_bot ["Moderator"]:
    - edit M2 form.default_roles_config+default_roles_bot=Moderator
  - click done:
    - send M3 sync_existing
    - delete M2
  - click pick:False:
    - send M4 form.review
    - delete M3
  - click continue:
    - send M5 enabled
    - delete M4
    - send M6 form.panel+continue
  setup_happy.pt-br:
  - start_command default_roles "pt-br":
    - send M1 form
  - click continue:
    - send M2 form.default_roles_config
    - delete M1
  - select default_roles ["Member"]:
    - edit M2 form.default_roles_config+default_roles=Member
  - select default_roles_bot ["Moderator"]:
    - edit M2 form.default_roles_config+default_roles_bot=Moderator
  - click done:
    - send M3 sync_existing
    - delete M2
  - click pick:False:
    - send M4 form.review
    - delete M3
  - click continue:
    - send M5 enabled
    - delete M4
    - send M6 form.panel+continue
  setup_with_a_rung.en-us:
  - start_command default_roles "en-us":
    - send M1 form
  - click continue:
    - send M2 form.default_roles_config
    - delete M1
  - click customize:ladder_screen:
    - edit M2 roles_by_time.screen
  - click add:role_ladder:
    - edit M2 rung
  - click customize:time:
    - modal time.amount
  - 'modal_submit {"How long (just the number)": "7", "In days, weeks, months or years?": "days"}':
    - edit M2 rung+modal_submit
  - select role ["Member"]:
    - edit M2 rung+role=Member
  - click done:
    - edit M2 roles_by_time.screen+done
  - click back:
    - edit M2 form.default_roles_config+back
  - click done:
    - edit M2 form.review+done
  - click continue:
    - send M3 enabled
    - delete M2
    - send M4 form.panel+continue@setup_with_a_rung
    - send M5 ladder_confirm
  - click continue:
    - edit M5 ladder_confirm+continue
    - send M6 ladder_giving
    - edit M6 ladder_given
  setup_with_a_rung.pt-br:
  - start_command default_roles "pt-br":
    - send M1 form
  - click continue:
    - send M2 form.default_roles_config
    - delete M1
  - click customize:ladder_screen:
    - edit M2 roles_by_time.screen
  - click add:role_ladder:
    - edit M2 rung
  - click customize:time:
    - modal time.amount
  - 'modal_submit {"Quanto tempo (só o número)": "7", "Em dias, semanas, meses ou anos?": "days"}':
    - edit M2 rung+modal_submit
  - select role ["Member"]:
    - edit M2 rung+role=Member
  - click done:
    - edit M2 roles_by_time.screen+done
  - click back:
    - edit M2 form.default_roles_config+back@setup_with_a_rung
  - click done:
    - edit M2 form.review+done@setup_with_a_rung
  - click continue:
    - send M3 enabled
    - delete M2
    - send M4 form.panel+continue@setup_with_a_rung
    - send M5 ladder_confirm+continue@setup_with_a_rung
  - click continue:
    - edit M5 ladder_confirm+continue@setup_with_a_rung#2
    - send M6 ladder_giving
    - edit M6 ladder_given

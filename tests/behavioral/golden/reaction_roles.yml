flows:
  manager_add_item.pt-br:
  - start_command reaction_roles "pt-br":
    - send M1 form.panel+start_command
  - click add:
    - send M2 menu+add
    - delete M1
  - select channel ["cargos"]:
    - edit M2 menu+channel=cargos@manager_add_item
  - select roles ["Leitor"]:
    - edit M2 menu+roles=Leitor
  - click done:
    - channel_send M3 defaults+done
    - edit M2 form.panel+done
  manager_disable.pt-br:
  - start_command reaction_roles "pt-br":
    - send M1 form.panel
  - click disable:
    - send M2 delete
    - delete M1
  - click delete_all:
    - send M3 disabled
    - delete M2
  manager_edit_one_step.pt-br:
  - start_command reaction_roles "pt-br":
    - send M1 form.panel+start_command@manager_edit_one_step
  - click section:menus$0:
    - send M2 menu+section:menus$0
    - delete M1
  - click customize:message:
    - modal message_content.texts
  - 'modal_submit {"Título": "🎮 Jogos", "Texto": "Escolha seus jogos!", "Rodapé": ""}':
    - edit M2 menu+modal_submit
  - click done:
    - channel_send M3 screen
    - edit M2 form.panel+done@manager_edit_one_step
  manager_history.pt-br:
  - start_command reaction_roles "pt-br":
    - send M1 form.panel
  - click history:
    - send M2 screen.message+history
    - edit M2 changes.history
  manager_pause.pt-br:
  - start_command reaction_roles "pt-br":
    - send M1 form.panel
  - click pause:
    - edit M1 form.panel+pause
    - send M2 paused+pause (delete_after 5)
  manager_remove_item.pt-br:
  - start_command reaction_roles "pt-br":
    - send M1 form.panel
  - click remove_this:menus$1:
    - send M2 remove
    - delete M1
  - click remove_items:
    - send M3 form.panel+remove_items
    - delete M2
  manager_unpause.pt-br:
  - start_command reaction_roles "pt-br":
    - send M1 form.panel+pause
  - click unpause:
    - edit M1 form.panel
    - send M2 unpaused (delete_after 5)
  member_refused_while_paused.en-us:
  - click_custom_id:
    - defer screen.message (thinking true)
    - send M1 paused
  member_refused_while_paused.pt-br:
  - click_custom_id:
    - defer screen.message (thinking true)
    - send M1 paused
  member_takes_and_drops_roles.en-us:
  - start_command reaction_roles "en-us":
    - send M1 form
  - click continue:
    - send M2 menu
    - delete M1
  - select channel ["cargos"]:
    - edit M2 menu+channel=cargos
  - select roles ["Gamer", "Artista"]:
    - edit M2 menu+roles=Gamer,Artista
  - click done:
    - edit M2 form.review
  - click continue:
    - channel_send M3 defaults
    - send M4 enabled
    - delete M2
    - send M5 form.panel+continue
  - click_after_restart Gamer:
    - defer screen.message (thinking true)
    - send M6 defaults+click_after_restart
  - click_after_restart Artista:
    - edit M6 defaults+click_after_restart@member_takes_and_drops_roles
  - click_after_restart Gamer:
    - edit M6 defaults+click_after_restart@member_takes_and_drops_roles#2
  member_takes_and_drops_roles.pt-br:

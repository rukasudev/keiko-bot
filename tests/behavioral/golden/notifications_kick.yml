screens:
  form.streamers_panel:
    ephemeral: true
    components:
    - type: container
      children:
      - type: section
        children:
        - {type: text, content: '## ⟨notifications_kick.form.steps.form.title⟩'}
        - {type: text, content: ⟨vocabulary.texts.streamers_panel_description⟩}
        - {type: thumbnail, media: KEIKO_DEFAULT.png}
      - type: section
        children:
        - {type: text, content: ':busts_in_silhouette: **⟨setup.ui.texts.categories.notifications⟩:** ⟨vocabulary.texts.set_up_counter: count=«1»; max=«3»⟩'}
        - {type: button, label: ⟨buttons.add.label⟩, style: secondary, disabled: false}
      - type: text
        content: |-
          ### ⟨setup.ui.texts.categories.notifications⟩ #1
          📺 **⟨vocabulary.texts.text_channel⟩:** <#100>
          🎮 **⟨notifications_twitch.ui.announcement.fields.streamer⟩:** xqcow
          📣 **⟨vocabulary.texts.mention⟩:** @everyone
          💬 **⟨vocabulary.texts.notification_messages⟩:** ```• {streamer} está ao vivo! {stream_link}```
      - type: actionrow
        children:
        - {type: button, label: ⟨buttons.edit.label⟩, style: secondary, disabled: false}
        - {type: button, label: ⟨buttons.preview.label⟩, style: secondary, disabled: false}
        - {type: button, label: ⟨buttons.remove.label⟩, style: danger, disabled: false}
      - {type: text, content: -# ⟨vocabulary.fallbacks.footer⟩}
    - type: actionrow
      children:
      - {type: button, label: ⟨buttons.pause.label⟩, style: secondary, disabled: false}
      - {type: button, label: ⟨buttons.disable.label⟩, style: secondary, disabled: false}
      - {type: button, label: ⟨buttons.history.label⟩, style: secondary, disabled: false}
      - {type: button, label: ⟨buttons.stats.label⟩, style: secondary, disabled: false}
      - {type: button, label: ⟨buttons.help.label⟩, style: secondary, disabled: false}
    components_v2: true
    rendered:
      pt-br:
      - '## 🟩 Kick Lives'
      - Aviso no servidor quando estes streamers entram ao vivo.
      - ':busts_in_silhouette: **Notificações:** 1 de 3 configurados'
      - Adicionar
      - |-
        ### Notificações #1
        📺 **Canal de Texto:** <#100>
        🎮 **Streamer:** xqcow
        📣 **Mencionar:** @everyone
        💬 **Mensagens de Notificação:** ```• {streamer} está ao vivo! {stream_link}```
      - Editar
      - Pré-visualizar
      - Remover
      - -# • Use o comando `/reportar` para me contar um bug
      - Pausar
      - Desativar
      - Histórico
      - Estatísticas
      - Ajuda
  form.streamers_panel+pause:
    from: form.streamers_panel
    changes:
    - set components.0.children.0.children.0.content: '## ⟨notifications_kick.form.steps.form.title⟩ (⟨texts.paused_suffix⟩)'

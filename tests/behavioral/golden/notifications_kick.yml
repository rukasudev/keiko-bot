flows:
  manager_add_item.pt-br:
  - start_command notifications_kick "pt-br":
    - send M1 form.streamers_panel
  - click add:
    - send M2 notification.streamer_card+add
    - delete M1
  - select channel ["general"]:
    - edit M2 notification.streamer_card+channel=general
  - click customize:streamer:
    - modal streamer
  - 'modal_submit {"O nome do streamer na Kick": "amouranth"}':
    - edit M2 notification.streamer_card+modal_submit@manager_add_item
    - edit M2 notification.streamer_card+modal_submit@manager_add_item#2
  - click customize:messages:
    - modal notification_messages.random_message_1+customize:messages
  - 'modal_submit {"Mensagem Aleatória #1": "{streamer} entrou ao vivo na Kick: {stream_link}"}':
    - edit M2 notification.streamer_card+modal_submit@manager_add_item#3
  - click done:
    - edit M2 form.streamers_panel+done
  manager_disable.pt-br:
  - start_command notifications_kick "pt-br":
    - send M1 form.streamers_panel
  - click disable:
    - send M2 delete
    - delete M1
  - click delete_all:
    - send M3 disabled
    - delete M2
  manager_edit_one_step.pt-br:
  - start_command notifications_kick "pt-br":
    - send M1 form.streamers_panel
  - click section:notifications$0:
    - send M2 notification.streamer_card+section:notifications$0
    - delete M1
  - select channel ["announcements"]:
    - edit M2 notification.streamer_card+channel=announcements
  - click customize:streamer:
    - modal streamer+customize:streamer
  - 'modal_submit {"O nome do streamer na Kick": "xqcow"}':
    - edit M2 notification.streamer_card+modal_submit@manager_edit_one_step
    - edit M2 notification.streamer_card+modal_submit@manager_edit_one_step#2
  - click customize:messages:
    - modal notification_messages.random_message_1+customize:messages@manager_edit_one_step
  - 'modal_submit {"Mensagem Aleatória #1": "{streamer} entrou ao vivo na Kick: {stream_link}"}':
    - edit M2 notification.streamer_card+modal_submit@manager_edit_one_step#3
  - click done:
    - edit M2 form.streamers_panel+done@manager_edit_one_step
  manager_history.pt-br:
  - start_command notifications_kick "pt-br":
    - send M1 form.streamers_panel
  - click history:
    - send M2 screen
    - edit M2 changes.history
  manager_pause.pt-br:
  - start_command notifications_kick "pt-br":
    - send M1 form.streamers_panel
  - click pause:
    - edit M1 form.streamers_panel+pause
    - send M2 paused (delete_after 5)
  manager_remove_item.pt-br:
  - start_command notifications_kick "pt-br":
    - send M1 form.streamers_panel+start_command
  - click remove_this:notifications$0:
    - send M2 remove
    - delete M1
  - click remove_items:
    - send M3 form.streamers_panel+remove_items
    - delete M2
  manager_unpause.pt-br:
  - start_command notifications_kick "pt-br":
    - send M1 form.streamers_panel+pause
  - click unpause:
    - edit M1 form.streamers_panel
    - send M2 unpaused (delete_after 5)
  setup_back.pt-br:
  - start_command notifications_kick "pt-br":
    - send M1 form
  - click continue:
    - send M2 notification.streamer_card+continue
    - delete M1
  - select channel ["general"]:
    - edit M2 notification.streamer_card
  - click customize:streamer:
    - modal streamer
  - 'modal_submit {"O nome do streamer na Kick": "xqcow"}':
    - edit M2 notification.streamer_card+modal_submit
    - edit M2 notification.streamer_card+modal_submit@setup_back
  - select channel ["announcements"]:
    - edit M2 notification.streamer_card+channel=announcements@setup_back
  - click customize:streamer:
    - modal streamer+customize:streamer
  - 'modal_submit {"O nome do streamer na Kick": "adinross"}':
    - edit M2 notification.streamer_card+modal_submit@setup_back#2
    - edit M2 notification.streamer_card+modal_submit@setup_back#3
  setup_cancel_discard.pt-br:
  - start_command notifications_kick "pt-br":
    - send M1 form
  - click continue:
    - send M2 notification.streamer_card+continue
    - delete M1
  - select channel ["general"]:
    - edit M2 notification.streamer_card
  - click cancel:
    - send M3 discard
  - click Descartar tudo:
    - edit M2 notification.streamer_card+Descartar_tudo
    - delete M3
  setup_cancel_keep.pt-br:
  - start_command notifications_kick "pt-br":
    - send M1 form
  - click continue:
    - send M2 notification.streamer_card+continue
    - delete M1
  - select channel ["general"]:
    - edit M2 notification.streamer_card
  - click cancel:
    - send M3 discard
  - click Continuar configurando:
    - delete M3
  setup_happy.en-us:
  - start_command notifications_kick "en-us":
    - send M1 form
  - click continue:
    - send M2 notification.streamer_card+continue
    - delete M1
  - select channel ["general"]:
    - edit M2 notification.streamer_card
  - click customize:streamer:
    - modal streamer
  - 'modal_submit {"The streamer''s name on Kick": "xqcow"}':
    - edit M2 notification.streamer_card+modal_submit
    - edit M2 notification.streamer_card+modal_submit@setup_back
  - click customize:messages:
    - modal notification_messages.random_message_1
  - 'modal_submit {"Random Message #1": "{streamer} entrou ao vivo na Kick: {stream_link}"}':
    - edit M2 notification.streamer_card+modal_submit@setup_happy
  - click done:
    - edit M2 form.review
  - click continue:
    - send M3 enabled
    - delete M2
    - send M4 form.streamers_panel+continue
  setup_happy.pt-br:
  - start_command notifications_kick "pt-br":
    - send M1 form
  - click continue:
    - send M2 notification.streamer_card+continue
    - delete M1
  - select channel ["general"]:
    - edit M2 notification.streamer_card
  - click customize:streamer:
    - modal streamer
  - 'modal_submit {"O nome do streamer na Kick": "xqcow"}':
    - edit M2 notification.streamer_card+modal_submit
    - edit M2 notification.streamer_card+modal_submit@setup_back
  - click customize:messages:
    - modal notification_messages.random_message_1
  - 'modal_submit {"Mensagem Aleatória #1": "{streamer} entrou ao vivo na Kick: {stream_link}"}':
    - edit M2 notification.streamer_card+modal_submit@setup_happy
  - click done:
    - edit M2 form.review
  - click continue:
    - send M3 enabled
    - delete M2
    - send M4 form.streamers_panel+continue
  setup_validation_error_and_recover.pt-br:
  - start_command notifications_kick "pt-br":
    - send M1 form
  - click continue:
    - send M2 notification.streamer_card+continue
    - delete M1
  - select channel ["general"]:
    - edit M2 notification.streamer_card
  - click customize:streamer:
    - modal streamer
  - 'modal_submit {"O nome do streamer na Kick": "naoexiste"}':
    - edit M2 notification.streamer_card+modal_submit
    - edit M2 notification.streamer_card
    - send M3 streamer_not_found (delete_after 10)
  - click customize:streamer:
    - modal streamer+customize:streamer@setup_validation_error_and_recover
  - 'modal_submit {"O nome do streamer na Kick": "xqcow"}':
    - edit M2 notification.streamer_card+modal_submit
    - edit M2 notification.streamer_card+modal_submit@setup_back

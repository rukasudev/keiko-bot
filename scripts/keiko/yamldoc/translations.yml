    nunca é obrigatória.
form.yml/DesignSection.appears_in:
  en-us: 'Where the card draws the section: always, only while nothing is saved (`setup`,
    for what a first setup offers once), or only once something is (`panel`).'
  pt-br: 'Onde o card desenha a seção: sempre, só enquanto nada foi salvo (`setup`, para o
    que o primeiro setup oferece uma vez só), ou só depois que algo foi salvo (`panel`).'
form.yml/DesignSection.placeholder:
  en-us: The grey hint of the section's select on the card; the title of its own screen, or
    its label, when left out.
  pt-br: A dica cinza do select da seção no card; o título da tela própria, ou o rótulo, quando
    omitida.
form.yml/DesignSection.options:
  en-us: The designs to pick among, with their previews.
  pt-br: Os designs para escolher, com as prévias.
form.yml/DesignSection.background:
  en-us: The answer the design previews are drawn over; the previews are drawn again when
    it changes.
  pt-br: A resposta sobre a qual as prévias dos designs são desenhadas; as prévias são redesenhadas
    quando ela muda.
form.yml/Unique:
  en-us: The item key two items of a list may not share.
  pt-br: A chave do item que dois itens de uma lista não podem repetir.
form.yml/Unique.key:
  en-us: The item key two items may not share, which also names an item.
  pt-br: A chave do item que dois itens não podem repetir, e que também dá nome ao item.
form.yml/Unique.immutable:
  en-us: Draws the key's value of an edited item as a line with no control, so the member
    an item is about stays fixed.
  pt-br: Mostra o valor da chave de um item em edição como uma linha sem controle, para o
    membro do item não mudar.
form.yml/SectionKeys:
  en-us: The state keys a card section owns.
  pt-br: As chaves de estado que uma seção de card controla.
form.yml/SectionKeys.value:
  en-us: The key the section's value is written to.
  pt-br: A chave onde o valor da seção é gravado.
form.yml/SectionKeys.mode:
  en-us: The key holding `default` or `custom` for a section that keeps a default until it
    is customized.
  pt-br: A chave que guarda `default` ou `custom`, para uma seção que mantém um padrão até
    ser personalizada.
form.yml/SectionKeys.title:
  en-us: The key a `title_content` section writes its title to.
  pt-br: A chave onde uma seção `title_content` grava o título.
form.yml/SectionKeys.description:
  en-us: The key a `title_content` section writes its body to.
  pt-br: A chave onde uma seção `title_content` grava o corpo.
form.yml/SectionKeys.image:
  en-us: The key a `file_upload` section writes the image url to.
  pt-br: A chave onde uma seção `file_upload` grava a url da imagem.
form.yml/TitleContentModal:
  en-us: 'The modal a `title_content` section opens: a title input and a body input.'
  pt-br: 'O modal que uma seção `title_content` abre: um campo de título e um campo de corpo.'
form.yml/TitleContentModal.title:
  en-us: The modal's title, after the section's emoji.
  pt-br: O título do modal, depois do emoji da seção.
form.yml/TitleContentModal.labels:
  en-us: The labels of the title and the body inputs.
  pt-br: Os rótulos dos campos de título e de corpo.
form.yml/TitleContentModal.normalize:
  en-us: "Runs a registered normalizer over the title and the body as they are saved."
  pt-br: "Passa o título e o corpo por um normalizador registrado quando são salvos."
form.yml/ModalSpec:
  en-us: The modal a section opens.
  pt-br: O modal que uma seção abre.
form.yml/ModalSpec.title:
  en-us: The modal's title, after the section's emoji.
  pt-br: O título do modal, depois do emoji da seção.
form.yml/ResetRule:
  en-us: A dependent key a change clears when the validator rejects it with the change.
  pt-br: Uma chave dependente que uma mudança limpa quando o validador a recusa com a mudança.
form.yml/ResetRule.key:
  en-us: The state key the change clears.
  pt-br: A chave de estado que a mudança limpa.
form.yml/ResetRule.validation:
  en-us: The validator that checks the dependent key against the new value.
  pt-br: O validador que checa a chave dependente contra o novo valor.
form.yml/InputsModal:
  en-us: 'The modal a `modal_input` section opens: its inputs and their check.'
  pt-br: 'O modal que uma seção `modal_input` abre: os campos dele e a validação deles.'
form.yml/InputsModal.title:
  en-us: The modal's title, after the section's emoji.
  pt-br: O título do modal, depois do emoji da seção.
form.yml/InputsModal.validation:
  en-us: Runs a registered validator on submit, with any lookup it needs.
  pt-br: Roda um validador registrado no envio, com a busca que ele precisar.
form.yml/InputsModal.inputs:
  en-us: The modal's inputs, five at most.
  pt-br: Os campos do modal, no máximo cinco.
form.yml/Fills:
  en-us: Copy a typed value writes into another key of its card.
  pt-br: Texto que um valor digitado escreve em outra chave do card.
form.yml/Fills.into:
  en-us: The state key whose text the value is written into.
  pt-br: A chave de estado em cujo texto o valor é escrito.
form.yml/Fills.tokens:
  en-us: Each `{token}` of the text becomes its template with the typed value, and a value
    typed earlier is rewritten.
  pt-br: Cada `{token}` do texto vira o seu modelo com o valor digitado, e um valor digitado
    antes é reescrito.
form.yml/Select:
  en-us: One native select of a selects section.
  pt-br: Um select nativo de uma seção selects.
form.yml/Select.type:
  en-us: 'What the select picks: channels, roles, or only the roles Keiko can assign.'
  pt-br: 'O que o select escolhe: canais, cargos, ou só os cargos que o Keiko consegue dar.'
form.yml/Select.key:
  en-us: The state key the picked ids are written to.
  pt-br: A chave de estado onde os ids escolhidos são gravados.
form.yml/Select.emoji:
  en-us: Leads the select's line on the card, the section's emoji when left out.
  pt-br: Vem antes da linha do select no card; o emoji da seção quando omitido.
form.yml/Select.label:
  en-us: The name of the picked values on summaries.
  pt-br: O nome dos valores escolhidos nos resumos.
form.yml/Select.placeholder:
  en-us: The grey hint inside the empty select.
  pt-br: A dica cinza dentro do select vazio.
form.yml/Design:
  en-us: One entry of a design gallery.
  pt-br: Uma entrada de uma galeria de designs.
form.yml/Design.value:
  en-us: The design id the bot stores and draws a preview of.
  pt-br: O id do design que o bot guarda e do qual desenha uma prévia.
form.yml/Design.label:
  en-us: The design's name on the gallery and summaries.
  pt-br: O nome do design na galeria e nos resumos.
form.yml/Design.description:
  en-us: What the design looks like, on the gallery.
  pt-br: Como o design é, na galeria.
form.yml/TitleContentLabels:
  en-us: The labels of a `title_content` modal's two inputs.
  pt-br: Os rótulos dos dois campos de um modal de `title_content`.
form.yml/TitleContentLabels.title:
  en-us: The label of the title input.
  pt-br: O rótulo do campo de título.
form.yml/TitleContentLabels.description:
  en-us: The label of the body input.
  pt-br: O rótulo do campo de corpo.
form.yml/TextField:
  en-us: One input of a `modal_input` section's modal.
  pt-br: Um campo do modal de uma seção `modal_input`.
form.yml/TextField.key:
  en-us: The state key the input writes; inputs without one are joined with `;` into the section's
    `keys.value`.
  pt-br: A chave de estado que o campo grava; campos sem chave são juntados com `;` no `keys.value`
    da seção.
form.yml/TextField.label:
  en-us: The input's label on the modal.
  pt-br: O rótulo do campo no modal.
form.yml/TextField.placeholder:
  en-us: The grey hint inside the empty input.
  pt-br: A dica cinza dentro do campo vazio.
form.yml/TextField.max_length:
  en-us: The most characters the input accepts.
  pt-br: O máximo de caracteres que o campo aceita.
form.yml/TextField.required:
  en-us: Refuses the modal while it is empty.
  pt-br: Recusa o modal enquanto o campo estiver vazio.
form.yml/TextField.multiline:
  en-us: Draws a paragraph input instead of a one-line one.
  pt-br: Desenha um campo de parágrafo em vez de um de uma linha.
form.yml/TextField.normalize:
  en-us: The registered normalizer the typed value goes through before it is checked and kept.
  pt-br: O normalizador registrado pelo qual o valor digitado passa antes de ser validado
    e guardado.
vocabulary.yml:
  en-us: 'The copy every form shares: the defaults a step reads when it leaves a field out
    (the report footer, the review description) and the texts a form or a copy file names
    with ${ref.<name>}.'
  pt-br: 'Os textos que todo form compartilha: os padrões que uma etapa lê quando omite um
    campo (o rodapé do report, a descrição da revisão) e os textos que um form ou um arquivo
    de copy cita com ${ref.<name>}.'
vocabulary.yml/Vocabulary:
  en-us: 'The copy every form shares: its fallbacks and the texts `${ref.<name>}` names.'
  pt-br: 'Os textos que todo form compartilha: os padrões dele e os textos que `${ref.<name>}`
    cita.'
vocabulary.yml/Vocabulary.fallbacks:
  en-us: The texts every form falls back to when a step leaves one out.
  pt-br: Os textos que todo form usa quando uma etapa omite um deles.
vocabulary.yml/Vocabulary.texts:
  en-us: The texts a form or a copy file names with `${ref.<name>}` wherever a text is allowed.
  pt-br: Os textos que um form ou um arquivo de copy cita com `${ref.<name>}` onde quer que
    um texto seja aceito.
vocabulary.yml/Fallbacks:
  en-us: The copy a step reads in place of a field it leaves out.
  pt-br: Os textos que uma etapa lê no lugar de um campo que ela omite.
vocabulary.yml/Fallbacks.footer:
  en-us: The footer of every step that writes no `footer`, at any depth, and the closing line
    of every embed and card that writes none.
  pt-br: O rodapé de toda etapa que não escreve `footer`, em qualquer nível, e a linha final
    de todo embed e card que não escreve nenhum.
vocabulary.yml/Fallbacks.review_description:
  en-us: The description of every review that writes none, naming the command it turns on
    with `${context.command}`.
  pt-br: A descrição de toda revisão que não escreve nenhuma, citando o comando que ela ativa
    com `${context.command}`.
vocabulary.yml/Text:
  en-us: One text in both locales Keiko speaks, the node every form and copy file writes.
  pt-br: Um texto nos dois idiomas que o Keiko fala, o nó que todo arquivo de form e de copy
    escreve.
vocabulary.yml/Text.en-us:
  en-us: What Keiko writes to an English-speaking server or member.
  pt-br: O que o Keiko escreve para um servidor ou membro que fala inglês.
vocabulary.yml/Text.pt-br:
  en-us: What Keiko writes to a Portuguese-speaking server or member.
  pt-br: O que o Keiko escreve para um servidor ou membro que fala português.
copy.yml:
  en-us: 'The copy of one command: the facts its texts read, the fixed places the shared
    screens fill (its slash names, its /setup row, its stats, its panel) under `command`, and
    every text it draws itself under `ui`, each a {en-us, pt-br} node under a key relative to
    the command.'
  pt-br: 'Os textos de um comando: os fatos que os textos dele leem, os lugares fixos que as
    telas compartilhadas preenchem (os nomes dos slash commands, a linha no /setup, as
    estatísticas, o painel) em `command`, e todo texto que ele mesmo desenha em `ui`, cada um
    num nó {en-us, pt-br} sob uma chave relativa ao comando.'
copy.yml/CommandCopy:
  en-us: 'A command''s `copy.yml`: the facts its texts read, then the fixed places the shared
    screens fill, then what it draws itself, under keys relative to the command.'
  pt-br: 'O `copy.yml` de um comando: os fatos que os textos dele leem, depois os lugares
    fixos que as telas compartilhadas preenchem, depois o que ele mesmo desenha, sob chaves
    relativas ao comando.'
copy.yml/CommandCopy.facts:
  en-us: The facts only this command's code passes, each read as `<key>.facts.<name>` by a rule
    and as `$<name>` by a text; a fact a second command needs moves to app/core/global.yml.
  pt-br: Os fatos que só o código deste comando passa, cada um lido como `<key>.facts.<name>`
    por uma regra e como `$<name>` por um texto; um fato que um segundo comando precisa vai
    para app/core/global.yml.
copy.yml/CommandCopy.command:
  en-us: 'The fixed places Keiko''s shared screens fill, each read under `<key>.command.`;
    `slash` is required for a command with cogs, `setup` and `stats` for one /setup offers.'
  pt-br: 'Os lugares fixos que as telas compartilhadas do Keiko preenchem, cada um lido em
    `<key>.command.`; `slash` é obrigatório para um comando com cogs, e `setup` e `stats` para
    um que o /setup oferece.'
copy.yml/CommandCopy.ui:
  en-us: 'What the command draws itself, each block read under `<key>.ui.` by the one
    primitive that draws it.'
  pt-br: 'O que o comando mesmo desenha, cada bloco lido em `<key>.ui.` pela única primitiva
    que o desenha.'
copy.yml/CommandPlaces:
  en-us: 'The fixed places of a command that Keiko''s shared screens fill: its app commands,
    its /setup row, its statistics and its manager panel.'
  pt-br: 'Os lugares fixos de um comando que as telas compartilhadas do Keiko preenchem: os
    app commands dele, a linha no /setup, as estatísticas e o painel de gerenciamento.'
copy.yml/CommandPlaces.slash:
  en-us: The names and captions of the command's app commands.
  pt-br: Os nomes e legendas dos app commands do comando.
copy.yml/CommandPlaces.setup:
  en-us: The command's row on /setup and on the first message.
  pt-br: A linha do comando no /setup e na primeira mensagem.
copy.yml/CommandPlaces.stats:
  en-us: The command's statistics and its recent-activity line.
  pt-br: As estatísticas do comando e a linha de atividade recente.
copy.yml/CommandPlaces.panel:
  en-us: What the command's feature adds to its manager panel.
  pt-br: O que a funcionalidade do comando acrescenta ao painel de gerenciamento.
copy.yml/CommandUi:
  en-us: 'What a command draws itself, one block per primitive that draws it.'
  pt-br: 'O que um comando mesmo desenha, um bloco por primitiva que o desenha.'
copy.yml/CommandUi.cards:
  en-us: The Components V2 cards the command draws, keyed by the screen.
  pt-br: Os cards Components V2 que o comando desenha, por tela.
copy.yml/CommandUi.texts:
  en-us: Texts no primitive draws, read by the command's own code.
  pt-br: Textos que nenhuma primitiva desenha, lidos pelo próprio código do comando.
copy.yml/CommandUi.records:
  en-us: 'The command''s browsable lists, each named `<key>.ui.records.<name>`.'
  pt-br: 'As listas navegáveis do comando, cada uma citada como `<key>.ui.records.<name>`.'
copy.yml/CommandUi.responses:
  en-us: 'The embeds the command answers with, each named `<key>.ui.responses.<name>`.'
  pt-br: 'Os embeds com que o comando responde, cada um citado como
    `<key>.ui.responses.<name>`.'
copy.yml/CommandUi.errors:
  en-us: 'The command''s errors, each named `<key>.ui.errors.<name>` by the code, a form or a
    validator.'
  pt-br: 'Os erros do comando, cada um citado como `<key>.ui.errors.<name>` pelo código, por
    um form ou por um validador.'
copy.yml/CommandUi.buttons:
  en-us: The command's own buttons, keyed by the aside a panel button runs or by what the
    button does.
  pt-br: Os botões próprios do comando, pela ação do painel que o botão roda ou pelo que ele
    faz.
copy.yml/CommandUi.announcement:
  en-us: What the command posts in a server channel.
  pt-br: O que o comando publica num canal do servidor.
copy.yml/Slash:
  en-us: The names and captions of a command's app commands, read by the `Translator` through
    `locale_str(namespace="<key>.command.slash")`.
  pt-br: Os nomes e legendas dos app commands de um comando, lidos pelo `Translator` via `locale_str(namespace="<key>.command.slash")`.
copy.yml/Slash.subgroup:
  en-us: The subgroup under the parent group, written when the command declares a `group`;
    /setup quotes it on the row.
  pt-br: O subgrupo abaixo do grupo pai, escrito quando o comando declara um `group`; o /setup
    o cita na linha.
copy.yml/Slash.name:
  en-us: The slash command's name, or the label of a context menu.
  pt-br: O nome do slash command, ou o rótulo de um menu de contexto.
copy.yml/Slash.description:
  en-us: The slash command's caption, in the third person; a context menu has none.
  pt-br: A legenda do slash command, em terceira pessoa; um menu de contexto não tem.
copy.yml/Slash.params:
  en-us: The parameters, keyed by the parameter name in Python; read under `<key>.command.slash` with
    the type `params.<name>.name`.
  pt-br: Os parâmetros, pelo nome do parâmetro no Python; lidos sob `<key>.command.slash` com o tipo
    `params.<name>.name`.
copy.yml/Slash.commands:
  en-us: The folder's other app commands, keyed by what each does; read with the namespace
    `<key>.command.slash.commands.<name>`.
  pt-br: Os outros app commands da pasta, pelo que cada um faz; lidos com o namespace `<key>.command.slash.commands.<name>`.
copy.yml/SetupRow:
  en-us: A command's row on /setup and on the greeting, read through `command_text`.
  pt-br: A linha de um comando no /setup e na saudação, lida via `command_text`.
copy.yml/SetupRow.label:
  en-us: 'The feature''s one name: its /setup row, its line on the first message, its buttons
    and its History.'
  pt-br: 'O nome único da funcionalidade: a linha no /setup, a linha na primeira mensagem,
    os botões e o Histórico.'
copy.yml/SetupRow.description:
  en-us: The row's one-line pitch, drawn under the name.
  pt-br: A frase de apresentação da linha, desenhada abaixo do nome.
copy.yml/Stats:
  en-us: 'A feature''s statistics: the embed its panel opens and its line on the recent activity,
    drawn by `send_feature_stats`, `health_line` and `figure_lines`.'
  pt-br: 'As estatísticas de uma funcionalidade: o embed que o painel abre e a linha na atividade
    recente, desenhados por `send_feature_stats`, `health_line` e `figure_lines`.'
copy.yml/Stats.title:
  en-us: The statistics embed's title, with one leading emoji.
  pt-br: O título do embed de estatísticas, com um emoji no começo.
copy.yml/Stats.delivered:
  en-us: The recent-activity line after the deliveries of the last days, by how many there
    were; $count, $days.
  pt-br: A linha de atividade recente depois das entregas dos últimos dias, conforme quantas
    foram; $count, $days.
copy.yml/Stats.empty:
  en-us: The only line `figure_lines` draws while the feature has no figure yet (the link
    blocker before its first block).
  pt-br: A única linha que `figure_lines` desenha enquanto a funcionalidade ainda não tem
    nenhum número (o bloqueio de links antes do primeiro bloqueio).
copy.yml/Stats.figures:
  en-us: The label of each figure, keyed by the figure `figure_lines` draws as `emoji **label:**
    value`.
  pt-br: O rótulo de cada número, pelo número que `figure_lines` desenha como `emoji **label:**
    value`.
copy.yml/Panel:
  en-us: What a feature adds to its manager panel through `PanelExtras`; the panel's own steps,
    headings and intro stay in its `form.yml`.
  pt-br: O que uma funcionalidade acrescenta ao painel de gerenciamento via `PanelExtras`;
    as etapas, títulos e intro do painel ficam no `form.yml` dela.
copy.yml/Panel.info:
  en-us: The closing paragraph, which `GenericCogFeature.panel_info` draws on every panel
    of the feature.
  pt-br: O parágrafo de fechamento, que `GenericCogFeature.panel_info` desenha em todo painel
    da funcionalidade.
copy.yml/Panel.pages:
  en-us: The pages of a long list (one page per month).
  pt-br: As páginas de uma lista longa (uma página por mês).
copy.yml/Panel.rows:
  en-us: A `PanelRow` title, keyed by the row; only for a panel whose document is built by
    the feature, not read from a step.
  pt-br: Um título de `PanelRow`, pela linha; só para um painel cujo documento é montado pela
    funcionalidade, e não lido de uma etapa.
copy.yml/Panel.authors:
  en-us: The label over the messages the screen of a found item shows, keyed by who wrote
    them (the member, the server, Keiko).
  pt-br: O rótulo acima das mensagens que a tela de um item encontrado mostra, por quem as
    escreveu (o membro, o servidor, o Keiko).
copy.yml/Announcement:
  en-us: 'What a command posts in a server channel through `announcement_embed`: the labels
    around the content, and Keiko''s own content where the admin wrote none.'
  pt-br: 'O que um comando publica num canal do servidor via `announcement_embed`: os rótulos
    em volta do conteúdo, e o conteúdo do próprio Keiko quando o admin não escreveu nenhum.'
copy.yml/Announcement.fields:
  en-us: The label of each inline field, keyed by the value the code gives it (a live's game,
    a video's tags).
  pt-br: O rótulo de cada campo inline, pelo valor que o código dá a ele (o jogo de uma live,
    as tags de um vídeo).
copy.yml/Announcement.states:
  en-us: 'The footer line of each state the announcement goes through (a live: online, offline,
    and its duration once over).'
  pt-br: 'A linha de rodapé de cada estado pelo qual o anúncio passa (uma live: online, offline
    e a duração quando acaba).'
copy.yml/Announcement.samples:
  en-us: The sample a preview draws while there is no real content yet, keyed by the part
    it stands for (title, game, description).
  pt-br: O exemplo que uma prévia desenha enquanto ainda não há conteúdo real, pela parte
    que ele representa (título, jogo, descrição).
copy.yml/Announcement.defaults:
  en-us: Keiko's own title and description, posted while the admin wrote none (a celebration).
  pt-br: O título e a descrição do próprio Keiko, publicados enquanto o admin não escreveu
    nenhum (uma comemoração).
copy.yml/FactSpec:
  en-us: 'One fact: what a rule or a `$name` of a text reads, of one type.'
  pt-br: 'Um fato: o que uma regra ou um `$name` de um texto lê, de um tipo só.'
copy.yml/FactSpec.type:
  en-us: 'The kind of value the code passes: `boolean`, `enum` (one of `values`), `number` or
    `text`.'
  pt-br: 'O tipo de valor que o código passa: `boolean`, `enum` (um dos `values`), `number`
    ou `text`.'
copy.yml/FactSpec.values:
  en-us: The values an `enum` fact takes, the only ones a rule may compare it with.
  pt-br: Os valores que um fato `enum` assume, os únicos com que uma regra pode compará-lo.
copy.yml/FactSpec.description:
  en-us: One sentence saying what the fact holds, for whoever writes a rule or a text that reads
    it.
  pt-br: Uma frase dizendo o que o fato guarda, para quem escreve uma regra ou um texto que
    o lê.
copy.yml/ErrorBlock:
  en-us: 'One error, named by its block: a red embed through `response_error_embed`, or the
    plain line of the forms'' `error_message`.'
  pt-br: 'Um erro, citado pelo bloco: um embed vermelho via `response_error_embed`, ou a linha
    simples do `error_message` dos forms.'
copy.yml/ErrorBlock.title:
  en-us: 'The error''s title, without an emoji: the embed adds 🚨.'
  pt-br: 'O título do erro, sem emoji: o embed acrescenta 🚨.'
copy.yml/ErrorBlock.message:
  en-us: What went wrong and how to recover; `$name` marks a value the code fills.
  pt-br: O que deu errado e como resolver; `$name` marca um valor que o código preenche.
copy.yml/Response:
  en-us: 'One embed Keiko answers with, drawn by `response_embed`: an answer, a `ConfirmActionView`
    question or the confirmation of a panel aside.'
  pt-br: 'Um embed com que o Keiko responde, desenhado por `response_embed`: uma resposta,
    uma pergunta de `ConfirmActionView` ou a confirmação de uma ação do painel.'
copy.yml/Response.title:
  en-us: The embed's title, with one leading emoji; `$name` marks a value the code fills.
  pt-br: O título do embed, com um emoji no começo; `$name` marca um valor que o código preenche.
copy.yml/Response.description:
  en-us: The embed's body; `$name` marks a value the code fills; absent, the embed has no
    body (the /report ticket, whose fields say it all).
  pt-br: O corpo do embed; `$name` marca um valor que o código preenche; se ausente, o embed
    não tem corpo (o ticket do /report, cujos campos já dizem tudo).
copy.yml/Response.tone:
  en-us: "The embed's colour: Keiko's blue, or the yellow of a warning, for a message that tells the admin Keiko changed what they did (a mention taken out of a text)."
  pt-br: "A cor do embed: o azul do Keiko, ou o amarelo de um aviso, para uma mensagem que conta ao admin que o Keiko mudou o que ele fez (uma menção tirada de um texto)."
copy.yml/Response.footer:
  en-us: 'The closing subtext line: absent draws the standard /report line, null draws none,
    a text draws that text.'
  pt-br: 'A linha final em letra pequena: ausente desenha a linha padrão do /report, null
    não desenha nenhuma, um texto desenha esse texto.'
copy.yml/Response.empty:
  en-us: The body drawn instead of `description` while there is nothing to list (the /setup
    permissions report).
  pt-br: O corpo desenhado no lugar de `description` enquanto não há nada para listar (o relatório
    de permissões do /setup).
copy.yml/Response.overrides:
  en-us: The title or description drawn while a rule on the facts holds, the first item whose
    rule holds winning (the link check, once it would block the message).
  pt-br: O título ou a descrição desenhados enquanto uma regra sobre os fatos vale, vencendo
    o primeiro item cuja regra vale (a verificação de link, quando ela bloquearia a mensagem).
copy.yml/Response.lines:
  en-us: Line templates the code repeats into the body, keyed by what each says (one line
    per category).
  pt-br: Modelos de linha que o código repete no corpo, pelo que cada um diz (uma linha por
    categoria).
copy.yml/Response.fields:
  en-us: The stacked fields below the body, drawn in the order written, keyed by the value
    the code gives each.
  pt-br: Os campos empilhados abaixo do corpo, desenhados na ordem escrita, pelo valor que
    o código dá a cada um.
copy.yml/Records:
  en-us: One browsable list, drawn by `RecordsBrowser(copy=...)` or a command's own `PaginationView`.
  pt-br: Uma lista navegável, desenhada por `RecordsBrowser(copy=...)` ou pelo `PaginationView`
    próprio de um comando.
copy.yml/Records.title:
  en-us: The list's title, with one leading emoji; `$name` marks a value the code fills.
  pt-br: O título da lista, com um emoji no começo; `$name` marca um valor que o código preenche.
copy.yml/Records.description:
  en-us: The line above the records; `$name` marks a value the code fills.
  pt-br: A linha acima dos registros; `$name` marca um valor que o código preenche.
copy.yml/Records.empty:
  en-us: Drawn alone when nothing is found; absent, an empty page is drawn.
  pt-br: Desenhado sozinho quando nada é encontrado; se ausente, desenha uma página vazia.
copy.yml/Records.placeholder:
  en-us: The placeholder of the select that follows the page and opens a record (/help).
  pt-br: O placeholder do select que vem depois da página e abre um registro (/help).
copy.yml/Records.detail:
  en-us: The screen that select opens (/help).
  pt-br: A tela que esse select abre (/help).
copy.yml/Records.filter:
  en-us: The member filter; absent, the list has no filter button.
  pt-br: O filtro por membro; se ausente, a lista não tem botão de filtro.
copy.yml/Records.lines:
  en-us: Line templates the formatter fills once per record ($user, $channel, $date), keyed
    by the part of the record each draws.
  pt-br: Modelos de linha que o formatador preenche uma vez por registro ($user, $channel,
    $date), pela parte do registro que cada um desenha.
copy.yml/ButtonCopy:
  en-us: 'One button''s copy: its label, and the caption the panel''s Help screen lists.'
  pt-br: 'O texto de um botão: o rótulo, e a legenda que a tela de Ajuda do painel lista.'
copy.yml/ButtonCopy.label:
  en-us: The text on the button.
  pt-br: O texto no botão.
copy.yml/ButtonCopy.description:
  en-us: The caption the panel's Help screen lists beside the button, in the third person;
    a button a form panel draws writes it.
  pt-br: A legenda que a tela de Ajuda do painel lista ao lado do botão, em terceira pessoa;
    um botão desenhado por um painel de form a escreve.
copy.yml/Card:
  en-us: One Components V2 card a command draws through `card_header`, `card_row` and `card_footer`.
  pt-br: Um card Components V2 que um comando desenha via `card_header`, `card_row` e `card_footer`.
copy.yml/Card.title:
  en-us: The card's `## title`, with one emoji.
  pt-br: O `## title` do card, com um emoji.
copy.yml/Card.description:
  en-us: The intro under the title.
  pt-br: A introdução abaixo do título.
copy.yml/Card.note:
  en-us: The subtext line under the intro; `$name` marks a value the code fills ($page, $pages).
  pt-br: A linha em letra pequena abaixo da introdução; `$name` marca um valor que o código
    preenche ($page, $pages).
copy.yml/Card.footer:
  en-us: 'The card''s closing subtext line: absent draws the standard /report line, null draws
    none, a text draws that text.'
  pt-br: 'A linha final em letra pequena do card: ausente desenha a linha padrão do /report,
    null não desenha nenhuma, um texto desenha esse texto.'
copy.yml/Card.overrides:
  en-us: The title, intro or note drawn while a rule on the facts holds, the first item whose
    rule holds winning (the dashboard once everything is configured).
  pt-br: O título, a introdução ou a nota desenhados enquanto uma regra sobre os fatos vale,
    vencendo o primeiro item cuja regra vale (o painel inicial depois que tudo está configurado).
copy.yml/Card.rows:
  en-us: The card's rows, keyed by what each row shows.
  pt-br: As linhas do card, pelo que cada linha mostra.
copy.yml/Text:
  en-us: One text in both locales Keiko speaks, the node every form and copy file writes.
  pt-br: Um texto nos dois idiomas que o Keiko fala, o nó que todo arquivo de form e de copy
    escreve.
copy.yml/Text.en-us:
  en-us: What Keiko writes to an English-speaking server or member.
  pt-br: O que o Keiko escreve para um servidor ou membro que fala inglês.
copy.yml/Text.pt-br:
  en-us: What Keiko writes to a Portuguese-speaking server or member.
  pt-br: O que o Keiko escreve para um servidor ou membro que fala português.
copy.yml/SlashParam:
  en-us: One parameter of a command's slash commands, shared by every command of the folder
    that takes it.
  pt-br: Um parâmetro dos slash commands de um comando, compartilhado por todo comando da
    pasta que o recebe.
copy.yml/SlashParam.name:
  en-us: 'The parameter''s name Discord shows: lowercase, no spaces.'
  pt-br: 'O nome do parâmetro que o Discord mostra: minúsculo, sem espaços.'
copy.yml/SlashParam.description:
  en-us: The parameter's caption Discord shows.
  pt-br: A legenda do parâmetro que o Discord mostra.
copy.yml/SlashCommand:
  en-us: One more app command of the folder, besides the one `slash` names.
  pt-br: Mais um app command da pasta, além do que `slash` nomeia.
copy.yml/SlashCommand.name:
  en-us: 'The command''s name Discord shows: lowercase, no spaces, or the label of a context
    menu.'
  pt-br: 'O nome do comando que o Discord mostra: minúsculo, sem espaços, ou o rótulo de um
    menu de contexto.'
copy.yml/SlashCommand.description:
  en-us: The command's caption, in the third person; a context menu has none.
  pt-br: A legenda do comando, em terceira pessoa; um menu de contexto não tem.
copy.yml/Plural:
  en-us: 'One text per plural form of a count the code fills: `one` for a count of one, `other`
    for every other count.'
  pt-br: 'Um texto para cada forma de plural de um número que o código preenche: `one` para
    o número um, `other` para qualquer outro.'
copy.yml/Plural.one:
  en-us: The text for a count of exactly one.
  pt-br: O texto para exatamente um.
copy.yml/Plural.other:
  en-us: The text for every other count.
  pt-br: O texto para qualquer outro número.
copy.yml/PanelInfo:
  en-us: The closing paragraph of a feature's manager panel.
  pt-br: O parágrafo de fechamento do painel de gerenciamento de uma funcionalidade.
copy.yml/PanelInfo.title:
  en-us: The paragraph's bold title; absent, the paragraph has none.
  pt-br: O título em negrito do parágrafo; se ausente, o parágrafo fica sem título.
copy.yml/PanelInfo.description:
  en-us: The paragraph; `$name` marks a value the code fills ($count).
  pt-br: O parágrafo; `$name` marca um valor que o código preenche ($count).
copy.yml/PanelInfo.overrides:
  en-us: The title or paragraph drawn while a rule on the facts holds, the first item whose
    rule holds winning (while the feature cannot tell what it counts).
  pt-br: O título ou o parágrafo desenhados enquanto uma regra sobre os fatos vale, vencendo
    o primeiro item cuja regra vale (enquanto a funcionalidade não consegue saber o que conta).
copy.yml/PanelPages:
  en-us: The pages a panel turns through over a long list, each a `PanelPage`.
  pt-br: As páginas que um painel percorre numa lista longa, cada uma um `PanelPage`.
copy.yml/PanelPages.title:
  en-us: Each page's title.
  pt-br: O título de cada página.
copy.yml/PanelPages.description:
  en-us: The line under each page's title.
  pt-br: A linha abaixo do título de cada página.
copy.yml/PanelPages.empty:
  en-us: Drawn while the list has nothing to page.
  pt-br: Desenhado enquanto a lista não tem nada para paginar.
copy.yml/AnnouncementDefaults:
  en-us: Keiko's own announcement, posted where the admin wrote none.
  pt-br: O anúncio do próprio Keiko, publicado quando o admin não escreveu nenhum.
copy.yml/AnnouncementDefaults.title:
  en-us: 'The announcement''s title, an admin template: `{user}`, `{server}` and `{date}`
    are filled like in what the admin writes.'
  pt-br: 'O título do anúncio, um modelo de admin: `{user}`, `{server}` e `{date}` são preenchidos
    como no que o admin escreve.'
copy.yml/AnnouncementDefaults.description:
  en-us: The announcement's body, an admin template like the title.
  pt-br: O corpo do anúncio, um modelo de admin como o título.
copy.yml/ResponseOverride:
  en-us: What a response draws while a rule holds, in place of its own title or description.
  pt-br: O que uma resposta desenha enquanto uma regra vale, no lugar do próprio título ou descrição.
copy.yml/ResponseOverride.when:
  en-us: The rule under which this item's fields replace the block's.
  pt-br: A regra sob a qual os campos deste item substituem os do bloco.
copy.yml/ResponseOverride.title:
  en-us: The title drawn while the rule holds; absent keeps the block's.
  pt-br: O título desenhado enquanto a regra vale; se ausente, mantém o do bloco.
copy.yml/ResponseOverride.description:
  en-us: The description drawn while the rule holds; absent keeps the block's.
  pt-br: A descrição desenhada enquanto a regra vale; se ausente, mantém a do bloco.
copy.yml/ResponseField:
  en-us: 'One stacked field of a response embed: its title, and its value when the copy writes
    it.'
  pt-br: 'Um campo empilhado de um embed de resposta: o título, e o valor quando o copy o
    escreve.'
copy.yml/ResponseField.title:
  en-us: The field's name, drawn in bold above its value.
  pt-br: O nome do campo, desenhado em negrito acima do valor.
copy.yml/ResponseField.value:
  en-us: A value the copy writes itself, drawn whenever the code gives none (the how-to field
    of /support); absent, the code gives the value.
  pt-br: Um valor que o próprio copy escreve, desenhado sempre que o código não der nenhum
    (o campo de passo a passo do /support); se ausente, o código dá o valor.
copy.yml/ResponseField.empty:
  en-us: The value drawn while the code has none to give (a /report ticket without attachments);
    absent, such a field is left out.
  pt-br: O valor desenhado enquanto o código não tem nenhum para dar (um ticket do /report
    sem anexos); se ausente, esse campo some.
copy.yml/ResponseField.overrides:
  en-us: The value drawn while a rule on the facts holds, the first item whose rule holds winning
    (the link check's feature line in each state of the feature).
  pt-br: O valor desenhado enquanto uma regra sobre os fatos vale, vencendo o primeiro item
    cuja regra vale (a linha da funcionalidade na verificação de link, em cada estado da funcionalidade).
copy.yml/ResponseField.lines:
  en-us: Line templates the code picks from to compose the value, keyed by what each says
    (the reasons of the link check).
  pt-br: Modelos de linha que o código escolhe para montar o valor, pelo que cada um diz (os
    motivos da checagem de link).
copy.yml/RecordsDetail:
  en-us: The screen a record's select opens, with a way back to the list.
  pt-br: A tela que o select de um registro abre, com um jeito de voltar para a lista.
copy.yml/RecordsDetail.title:
  en-us: The detail's title; `$name` marks a value the code fills.
  pt-br: O título do detalhe; `$name` marca um valor que o código preenche.
copy.yml/RecordsDetail.description:
  en-us: The detail's body; `$name` marks a value the code fills.
  pt-br: O corpo do detalhe; `$name` marca um valor que o código preenche.
copy.yml/RecordsFilter:
  en-us: 'The member filter of a records list: its button, its picker and its empty state.'
  pt-br: 'O filtro por membro de uma lista de registros: o botão, o seletor e o estado vazio.'
copy.yml/RecordsFilter.label:
  en-us: The filter button while the whole list shows.
  pt-br: O botão do filtro enquanto a lista inteira aparece.
copy.yml/RecordsFilter.clear_label:
  en-us: The same button once the list shows one member, which brings every record back.
  pt-br: O mesmo botão quando a lista mostra um membro só, que traz todos os registros de
    volta.
copy.yml/RecordsFilter.title:
  en-us: The member picker's title.
  pt-br: O título do seletor de membro.
copy.yml/RecordsFilter.description:
  en-us: The member picker's intro.
  pt-br: A introdução do seletor de membro.
copy.yml/RecordsFilter.empty:
  en-us: Drawn alone when the member picked has no record.
  pt-br: Desenhado sozinho quando o membro escolhido não tem registro.
copy.yml/CardOverride:
  en-us: What a card draws while a rule holds, in place of its own title, intro or note.
  pt-br: O que um card desenha enquanto uma regra vale, no lugar do próprio título, introdução
    ou nota.
copy.yml/CardOverride.when:
  en-us: The rule under which this item's fields replace the block's.
  pt-br: A regra sob a qual os campos deste item substituem os do bloco.
copy.yml/CardOverride.title:
  en-us: The title drawn while the rule holds; absent keeps the card's.
  pt-br: O título desenhado enquanto a regra vale; se ausente, mantém o do card.
copy.yml/CardOverride.description:
  en-us: The intro drawn while the rule holds; absent keeps the card's.
  pt-br: A introdução desenhada enquanto a regra vale; se ausente, mantém a do card.
copy.yml/CardOverride.note:
  en-us: The note drawn while the rule holds; absent keeps the card's.
  pt-br: A nota desenhada enquanto a regra vale; se ausente, mantém a do card.
copy.yml/CardRow:
  en-us: 'One row of a card: a block of text with its control beside or under it.'
  pt-br: 'Uma linha de um card: um bloco de texto com o controle ao lado ou embaixo.'
copy.yml/CardRow.title:
  en-us: The row's heading, drawn above its body (a setting's name).
  pt-br: O título da linha, desenhado acima do corpo (o nome de uma configuração).
copy.yml/CardRow.description:
  en-us: The row's body; `$name` marks a value the code fills ($value, $prefix).
  pt-br: O corpo da linha; `$name` marca um valor que o código preenche ($value, $prefix).
copy.yml/CardRow.placeholder:
  en-us: The placeholder of the select drawn under the row.
  pt-br: O placeholder do select desenhado abaixo da linha.
copy.yml/PanelInfoOverride:
  en-us: What the panel's closing paragraph draws while a rule holds, in place of its own title
    or paragraph.
  pt-br: O que o parágrafo final do painel desenha enquanto uma regra vale, no lugar do próprio
    título ou parágrafo.
copy.yml/PanelInfoOverride.when:
  en-us: The rule under which this item's fields replace the block's.
  pt-br: A regra sob a qual os campos deste item substituem os do bloco.
copy.yml/PanelInfoOverride.title:
  en-us: The title drawn while the rule holds; absent keeps the block's.
  pt-br: O título desenhado enquanto a regra vale; se ausente, mantém o do bloco.
copy.yml/PanelInfoOverride.description:
  en-us: The paragraph drawn while the rule holds; absent keeps the block's.
  pt-br: O parágrafo desenhado enquanto a regra vale; se ausente, mantém o do bloco.
copy.yml/Leaf:
  en-us: One test on one key of the scope chain, with exactly one operator.
  pt-br: Um teste sobre uma chave da cadeia de escopos, com exatamente um operador.
copy.yml/Leaf.key:
  en-us: 'The value the rule tests: in a form, an answer key, behind `parent.` or `item.` for
    an outer session or a list item, or `items.count`; in a copy file, a fact by its address
    (`<owner>.facts.<name>`).'
  pt-br: 'O valor que a regra testa: num form, uma chave de resposta, atrás de `parent.` ou
    `item.` para uma sessão externa ou um item de lista, ou `items.count`; num arquivo de copy,
    um fato pelo endereço dele (`<owner>.facts.<name>`).'
copy.yml/Leaf.is:
  en-us: Holds while the value equals this one.
  pt-br: Vale enquanto o valor é igual a este.
copy.yml/Leaf.in:
  en-us: Holds while the value is one of these.
  pt-br: Vale enquanto o valor é um destes.
copy.yml/Leaf.not_in:
  en-us: Holds while the value is none of these.
  pt-br: Vale enquanto o valor não é nenhum destes.
copy.yml/Leaf.matches:
  en-us: Holds while the value matches this regular expression.
  pt-br: Vale enquanto o valor bate com esta expressão regular.
copy.yml/Leaf.present:
  en-us: Holds while the value is filled, or while it is empty when `false`.
  pt-br: Vale enquanto o valor está preenchido, ou enquanto está vazio quando `false`.
copy.yml/Leaf.count:
  en-us: Holds while the number of values is within these bounds.
  pt-br: Vale enquanto o número de valores está dentro destes limites.
copy.yml/All:
  en-us: True when every rule holds.
  pt-br: Vale quando todas as regras valem.
copy.yml/All.all:
  en-us: The rules that must all hold.
  pt-br: As regras que precisam valer todas.
copy.yml/AnyOf:
  en-us: True when at least one rule holds.
  pt-br: Vale quando pelo menos uma regra vale.
copy.yml/AnyOf.any:
  en-us: The rules one of which must hold.
  pt-br: As regras das quais uma precisa valer.
copy.yml/Not:
  en-us: True when the rule does not hold.
  pt-br: Vale quando a regra não vale.
copy.yml/Not.not:
  en-us: The rule that must not hold.
  pt-br: A regra que não pode valer.
copy.yml/FieldOverride:
  en-us: The value a stacked field draws while a rule holds, in place of its own.
  pt-br: O valor que um campo empilhado desenha enquanto uma regra vale, no lugar do próprio.
copy.yml/FieldOverride.when:
  en-us: The rule under which this item's fields replace the block's.
  pt-br: A regra sob a qual os campos deste item substituem os do bloco.
copy.yml/FieldOverride.value:
  en-us: The value drawn while the rule holds; `$name` marks a fact the code passes.
  pt-br: O valor desenhado enquanto a regra vale; `$name` marca um fato que o código passa.
copy.yml/Count:
  en-us: Bounds on how many values an answer holds.
  pt-br: Limites de quantos valores uma resposta guarda.
copy.yml/Count.min:
  en-us: The fewest values the rule accepts.
  pt-br: O mínimo de valores que a regra aceita.
copy.yml/Count.max:
  en-us: The most values the rule accepts.
  pt-br: O máximo de valores que a regra aceita.
languages/buttons.yml:
  en-us: Every button the shared layers draw (the form steps, the manager panel, the cards),
    each its label and the caption the panel's Help lists, read under `buttons.<name>`.
  pt-br: Todo botão que as camadas compartilhadas desenham (as etapas dos forms, o painel
    de gerenciamento, os cards), cada um com o rótulo e a legenda que a Ajuda do painel lista,
    lido em `buttons.<name>`.
languages/buttons.yml/ButtonCopy:
  en-us: 'One button''s copy: its label, and the caption the panel''s Help screen lists.'
  pt-br: 'O texto de um botão: o rótulo, e a legenda que a tela de Ajuda do painel lista.'
languages/buttons.yml/ButtonCopy.label:
  en-us: The text on the button.
  pt-br: O texto no botão.
languages/buttons.yml/ButtonCopy.description:
  en-us: The caption the panel's Help screen lists beside the button, in the third person;
    a button a form panel draws writes it.
  pt-br: A legenda que a tela de Ajuda do painel lista ao lado do botão, em terceira pessoa;
    um botão desenhado por um painel de form a escreve.
languages/buttons.yml/Text:
  en-us: One text in both locales Keiko speaks, the node every form and copy file writes.
  pt-br: Um texto nos dois idiomas que o Keiko fala, o nó que todo arquivo de form e de copy
    escreve.
languages/buttons.yml/Text.en-us:
  en-us: What Keiko writes to an English-speaking server or member.
  pt-br: O que o Keiko escreve para um servidor ou membro que fala inglês.
languages/buttons.yml/Text.pt-br:
  en-us: What Keiko writes to a Portuguese-speaking server or member.
  pt-br: O que o Keiko escreve para um servidor ou membro que fala português.
languages/commands.yml:
  en-us: 'The screens the shared layers draw for every command, under `commands.`: the shared
    answers and questions (admin only, cooldown, Help, the lifecycle final messages, the member
    pickers, the removal and discard questions) and the History list.'
  pt-br: 'As telas que as camadas compartilhadas desenham para todo comando, em `commands.`:
    as respostas e perguntas compartilhadas (só para admins, cooldown, Ajuda, as mensagens
    finais do ciclo de vida, os seletores de membro, as perguntas de remover e de descartar)
    e a lista do Histórico.'
languages/commands.yml/SharedCommands:
  en-us: '`app/languages/commands.yml`: the screens the shared layers draw for every command,
    under `commands.`; their plain lines and tables live in `texts.yml`.'
  pt-br: '`app/languages/commands.yml`: as telas que as camadas compartilhadas desenham para
    todo comando, em `commands.`; as linhas simples e tabelas delas ficam em `texts.yml`.'
languages/commands.yml/SharedCommands.responses:
  en-us: The shared embeds and questions, each named `commands.responses.<name>` (the admin-only
    answer, the cooldown, the Help screen, the lifecycle final messages, the member pickers,
    the removal and discard questions).
  pt-br: Os embeds e perguntas compartilhados, cada um chamado `commands.responses.<name>`
    (a resposta de só para admins, o cooldown, a tela de Ajuda, as mensagens finais do ciclo
    de vida, os seletores de membro, as perguntas de remover e de descartar).
languages/commands.yml/SharedCommands.records:
  en-us: The shared lists, each named `commands.records.<name>` (a feature's History and its
    line per event, every change of a server).
  pt-br: As listas compartilhadas, cada uma chamada `commands.records.<name>` (o Histórico
    de uma funcionalidade e a linha dele por evento, toda mudança de um servidor).
languages/commands.yml/Response:
  en-us: 'One embed Keiko answers with, drawn by `response_embed`: an answer, a `ConfirmActionView`
    question or the confirmation of a panel aside.'
  pt-br: 'Um embed com que o Keiko responde, desenhado por `response_embed`: uma resposta,
    uma pergunta de `ConfirmActionView` ou a confirmação de uma ação do painel.'
languages/commands.yml/Response.title:
  en-us: The embed's title, with one leading emoji; `$name` marks a value the code fills.
  pt-br: O título do embed, com um emoji no começo; `$name` marca um valor que o código preenche.
languages/commands.yml/Response.description:
  en-us: The embed's body; `$name` marks a value the code fills; absent, the embed has no
    body (the /report ticket, whose fields say it all).
  pt-br: O corpo do embed; `$name` marca um valor que o código preenche; se ausente, o embed
    não tem corpo (o ticket do /report, cujos campos já dizem tudo).
languages/commands.yml/Response.tone:
  en-us: "The embed's colour: Keiko's blue, or the yellow of a warning, for a message that tells the admin Keiko changed what they did (a mention taken out of a text)."
  pt-br: "A cor do embed: o azul do Keiko, ou o amarelo de um aviso, para uma mensagem que conta ao admin que o Keiko mudou o que ele fez (uma menção tirada de um texto)."
languages/commands.yml/Response.footer:
  en-us: 'The closing subtext line: absent draws the standard /report line, null draws none,
    a text draws that text.'
  pt-br: 'A linha final em letra pequena: ausente desenha a linha padrão do /report, null
    não desenha nenhuma, um texto desenha esse texto.'
languages/commands.yml/Response.empty:
  en-us: The body drawn instead of `description` while there is nothing to list (the /setup
    permissions report).
  pt-br: O corpo desenhado no lugar de `description` enquanto não há nada para listar (o relatório
    de permissões do /setup).
languages/commands.yml/Response.overrides:
  en-us: The title or description drawn while a rule on the facts holds, the first item whose
    rule holds winning (the link check, once it would block the message).
  pt-br: O título ou a descrição desenhados enquanto uma regra sobre os fatos vale, vencendo
    o primeiro item cuja regra vale (a verificação de link, quando ela bloquearia a mensagem).
languages/commands.yml/Response.lines:
  en-us: Line templates the code repeats into the body, keyed by what each says (one line
    per category).
  pt-br: Modelos de linha que o código repete no corpo, pelo que cada um diz (uma linha por
    categoria).
languages/commands.yml/Response.fields:
  en-us: The stacked fields below the body, drawn in the order written, keyed by the value
    the code gives each.
  pt-br: Os campos empilhados abaixo do corpo, desenhados na ordem escrita, pelo valor que
    o código dá a cada um.
languages/commands.yml/Records:
  en-us: One browsable list, drawn by `RecordsBrowser(copy=...)` or a command's own `PaginationView`.
  pt-br: Uma lista navegável, desenhada por `RecordsBrowser(copy=...)` ou pelo `PaginationView`
    próprio de um comando.
languages/commands.yml/Records.title:
  en-us: The list's title, with one leading emoji; `$name` marks a value the code fills.
  pt-br: O título da lista, com um emoji no começo; `$name` marca um valor que o código preenche.
languages/commands.yml/Records.description:
  en-us: The line above the records; `$name` marks a value the code fills.
  pt-br: A linha acima dos registros; `$name` marca um valor que o código preenche.
languages/commands.yml/Records.empty:
  en-us: Drawn alone when nothing is found; absent, an empty page is drawn.
  pt-br: Desenhado sozinho quando nada é encontrado; se ausente, desenha uma página vazia.
languages/commands.yml/Records.placeholder:
  en-us: The placeholder of the select that follows the page and opens a record (/help).
  pt-br: O placeholder do select que vem depois da página e abre um registro (/help).
languages/commands.yml/Records.detail:
  en-us: The screen that select opens (/help).
  pt-br: A tela que esse select abre (/help).
languages/commands.yml/Records.filter:
  en-us: The member filter; absent, the list has no filter button.
  pt-br: O filtro por membro; se ausente, a lista não tem botão de filtro.
languages/commands.yml/Records.lines:
  en-us: Line templates the formatter fills once per record ($user, $channel, $date), keyed
    by the part of the record each draws.
  pt-br: Modelos de linha que o formatador preenche uma vez por registro ($user, $channel,
    $date), pela parte do registro que cada um desenha.
languages/commands.yml/Text:
  en-us: One text in both locales Keiko speaks, the node every form and copy file writes.
  pt-br: Um texto nos dois idiomas que o Keiko fala, o nó que todo arquivo de form e de copy
    escreve.
languages/commands.yml/Text.en-us:
  en-us: What Keiko writes to an English-speaking server or member.
  pt-br: O que o Keiko escreve para um servidor ou membro que fala inglês.
languages/commands.yml/Text.pt-br:
  en-us: What Keiko writes to a Portuguese-speaking server or member.
  pt-br: O que o Keiko escreve para um servidor ou membro que fala português.
languages/commands.yml/ResponseOverride:
  en-us: What a response draws while a rule holds, in place of its own title or description.
  pt-br: O que uma resposta desenha enquanto uma regra vale, no lugar do próprio título ou descrição.
languages/commands.yml/ResponseOverride.when:
  en-us: The rule under which this item's fields replace the block's.
  pt-br: A regra sob a qual os campos deste item substituem os do bloco.
languages/commands.yml/ResponseOverride.title:
  en-us: The title drawn while the rule holds; absent keeps the block's.
  pt-br: O título desenhado enquanto a regra vale; se ausente, mantém o do bloco.
languages/commands.yml/ResponseOverride.description:
  en-us: The description drawn while the rule holds; absent keeps the block's.
  pt-br: A descrição desenhada enquanto a regra vale; se ausente, mantém a do bloco.
languages/commands.yml/ResponseField:
  en-us: 'One stacked field of a response embed: its title, and its value when the copy writes
    it.'
  pt-br: 'Um campo empilhado de um embed de resposta: o título, e o valor quando o copy o
    escreve.'
languages/commands.yml/ResponseField.title:
  en-us: The field's name, drawn in bold above its value.
  pt-br: O nome do campo, desenhado em negrito acima do valor.
languages/commands.yml/ResponseField.value:
  en-us: A value the copy writes itself, drawn whenever the code gives none (the how-to field
    of /support); absent, the code gives the value.
  pt-br: Um valor que o próprio copy escreve, desenhado sempre que o código não der nenhum
    (o campo de passo a passo do /support); se ausente, o código dá o valor.
languages/commands.yml/ResponseField.empty:
  en-us: The value drawn while the code has none to give (a /report ticket without attachments);
    absent, such a field is left out.
  pt-br: O valor desenhado enquanto o código não tem nenhum para dar (um ticket do /report
    sem anexos); se ausente, esse campo some.
languages/commands.yml/ResponseField.overrides:
  en-us: The value drawn while a rule on the facts holds, the first item whose rule holds winning
    (the link check's feature line in each state of the feature).
  pt-br: O valor desenhado enquanto uma regra sobre os fatos vale, vencendo o primeiro item
    cuja regra vale (a linha da funcionalidade na verificação de link, em cada estado da funcionalidade).
languages/commands.yml/ResponseField.lines:
  en-us: Line templates the code picks from to compose the value, keyed by what each says
    (the reasons of the link check).
  pt-br: Modelos de linha que o código escolhe para montar o valor, pelo que cada um diz (os
    motivos da checagem de link).
languages/commands.yml/RecordsDetail:
  en-us: The screen a record's select opens, with a way back to the list.
  pt-br: A tela que o select de um registro abre, com um jeito de voltar para a lista.
languages/commands.yml/RecordsDetail.title:
  en-us: The detail's title; `$name` marks a value the code fills.
  pt-br: O título do detalhe; `$name` marca um valor que o código preenche.
languages/commands.yml/RecordsDetail.description:
  en-us: The detail's body; `$name` marks a value the code fills.
  pt-br: O corpo do detalhe; `$name` marca um valor que o código preenche.
languages/commands.yml/RecordsFilter:
  en-us: 'The member filter of a records list: its button, its picker and its empty state.'
  pt-br: 'O filtro por membro de uma lista de registros: o botão, o seletor e o estado vazio.'
languages/commands.yml/RecordsFilter.label:
  en-us: The filter button while the whole list shows.
  pt-br: O botão do filtro enquanto a lista inteira aparece.
languages/commands.yml/RecordsFilter.clear_label:
  en-us: The same button once the list shows one member, which brings every record back.
  pt-br: O mesmo botão quando a lista mostra um membro só, que traz todos os registros de
    volta.
languages/commands.yml/RecordsFilter.title:
  en-us: The member picker's title.
  pt-br: O título do seletor de membro.
languages/commands.yml/RecordsFilter.description:
  en-us: The member picker's intro.
  pt-br: A introdução do seletor de membro.
languages/commands.yml/RecordsFilter.empty:
  en-us: Drawn alone when the member picked has no record.
  pt-br: Desenhado sozinho quando o membro escolhido não tem registro.
languages/commands.yml/Leaf:
  en-us: One test on one key of the scope chain, with exactly one operator.
  pt-br: Um teste sobre uma chave da cadeia de escopos, com exatamente um operador.
languages/commands.yml/Leaf.key:
  en-us: 'The value the rule tests: in a form, an answer key, behind `parent.` or `item.` for
    an outer session or a list item, or `items.count`; in a copy file, a fact by its address
    (`<owner>.facts.<name>`).'
  pt-br: 'O valor que a regra testa: num form, uma chave de resposta, atrás de `parent.` ou
    `item.` para uma sessão externa ou um item de lista, ou `items.count`; num arquivo de copy,
    um fato pelo endereço dele (`<owner>.facts.<name>`).'
languages/commands.yml/Leaf.is:
  en-us: Holds while the value equals this one.
  pt-br: Vale enquanto o valor é igual a este.
languages/commands.yml/Leaf.in:
  en-us: Holds while the value is one of these.
  pt-br: Vale enquanto o valor é um destes.
languages/commands.yml/Leaf.not_in:
  en-us: Holds while the value is none of these.
  pt-br: Vale enquanto o valor não é nenhum destes.
languages/commands.yml/Leaf.matches:
  en-us: Holds while the value matches this regular expression.
  pt-br: Vale enquanto o valor bate com esta expressão regular.
languages/commands.yml/Leaf.present:
  en-us: Holds while the value is filled, or while it is empty when `false`.
  pt-br: Vale enquanto o valor está preenchido, ou enquanto está vazio quando `false`.
languages/commands.yml/Leaf.count:
  en-us: Holds while the number of values is within these bounds.
  pt-br: Vale enquanto o número de valores está dentro destes limites.
languages/commands.yml/All:
  en-us: True when every rule holds.
  pt-br: Vale quando todas as regras valem.
languages/commands.yml/All.all:
  en-us: The rules that must all hold.
  pt-br: As regras que precisam valer todas.
languages/commands.yml/AnyOf:
  en-us: True when at least one rule holds.
  pt-br: Vale quando pelo menos uma regra vale.
languages/commands.yml/AnyOf.any:
  en-us: The rules one of which must hold.
  pt-br: As regras das quais uma precisa valer.
languages/commands.yml/Not:
  en-us: True when the rule does not hold.
  pt-br: Vale quando a regra não vale.
languages/commands.yml/Not.not:
  en-us: The rule that must not hold.
  pt-br: A regra que não pode valer.
languages/commands.yml/FieldOverride:
  en-us: The value a stacked field draws while a rule holds, in place of its own.
  pt-br: O valor que um campo empilhado desenha enquanto uma regra vale, no lugar do próprio.
languages/commands.yml/FieldOverride.when:
  en-us: The rule under which this item's fields replace the block's.
  pt-br: A regra sob a qual os campos deste item substituem os do bloco.
languages/commands.yml/FieldOverride.value:
  en-us: The value drawn while the rule holds; `$name` marks a fact the code passes.
  pt-br: O valor desenhado enquanto a regra vale; `$name` marca um fato que o código passa.
languages/commands.yml/Count:
  en-us: Bounds on how many values an answer holds.
  pt-br: Limites de quantos valores uma resposta guarda.
languages/commands.yml/Count.min:
  en-us: The fewest values the rule accepts.
  pt-br: O mínimo de valores que a regra aceita.
languages/commands.yml/Count.max:
  en-us: The most values the rule accepts.
  pt-br: O máximo de valores que a regra aceita.
languages/errors.yml:
  en-us: Every error a shared layer names by its block (a validator, the form engine, the
    error handler), read under `errors.<name>`.
  pt-br: Todo erro que uma camada compartilhada cita pelo bloco (um validador, o motor de
    forms, o tratador de erros), lido em `errors.<name>`.
languages/errors.yml/ErrorBlock:
  en-us: 'One error, named by its block: a red embed through `response_error_embed`, or the
    plain line of the forms'' `error_message`.'
  pt-br: 'Um erro, citado pelo bloco: um embed vermelho via `response_error_embed`, ou a linha
    simples do `error_message` dos forms.'
languages/errors.yml/ErrorBlock.title:
  en-us: 'The error''s title, without an emoji: the embed adds 🚨.'
  pt-br: 'O título do erro, sem emoji: o embed acrescenta 🚨.'
languages/errors.yml/ErrorBlock.message:
  en-us: What went wrong and how to recover; `$name` marks a value the code fills.
  pt-br: O que deu errado e como resolver; `$name` marca um valor que o código preenche.
languages/errors.yml/Text:
  en-us: One text in both locales Keiko speaks, the node every form and copy file writes.
  pt-br: Um texto nos dois idiomas que o Keiko fala, o nó que todo arquivo de form e de copy
    escreve.
languages/errors.yml/Text.en-us:
  en-us: What Keiko writes to an English-speaking server or member.
  pt-br: O que o Keiko escreve para um servidor ou membro que fala inglês.
languages/errors.yml/Text.pt-br:
  en-us: What Keiko writes to a Portuguese-speaking server or member.
  pt-br: O que o Keiko escreve para um servidor ou membro que fala português.
languages/texts.yml:
  en-us: 'The plain lines and tables the shared layers read, under `texts.`: months, parent
    groups, notices, permission lines, placeholders, and the page and value words.'
  pt-br: 'As linhas simples e tabelas que as camadas compartilhadas leem, em `texts.`:
    meses, grupos pai, avisos, linhas de permissão, placeholders e as palavras de página e
    de valor.'
languages/texts.yml/Text:
  en-us: One text in both locales Keiko speaks, the node every form and copy file writes.
  pt-br: Um texto nos dois idiomas que o Keiko fala, o nó que todo arquivo de form e de copy
    escreve.
languages/texts.yml/Text.en-us:
  en-us: What Keiko writes to an English-speaking server or member.
  pt-br: O que o Keiko escreve para um servidor ou membro que fala inglês.
languages/texts.yml/Text.pt-br:
  en-us: What Keiko writes to a Portuguese-speaking server or member.
  pt-br: O que o Keiko escreve para um servidor ou membro que fala português.
languages/locales.yml:
  en-us: The name of each language Keiko speaks, keyed by its language code, read under `locales.<code>`.
  pt-br: O nome de cada idioma que o Keiko fala, pelo código do idioma, lido em `locales.<code>`.
languages/locales.yml/Text:
  en-us: One text in both locales Keiko speaks, the node every form and copy file writes.
  pt-br: Um texto nos dois idiomas que o Keiko fala, o nó que todo arquivo de form e de copy
    escreve.
languages/locales.yml/Text.en-us:
  en-us: What Keiko writes to an English-speaking server or member.
  pt-br: O que o Keiko escreve para um servidor ou membro que fala inglês.
languages/locales.yml/Text.pt-br:
  en-us: What Keiko writes to a Portuguese-speaking server or member.
  pt-br: O que o Keiko escreve para um servidor ou membro que fala português.
global.yml:
  en-us: 'The facts no single command owns and the context Keiko already holds: each fact
    a rule reads as `global.facts.<name>` and a text as `$<name>`, with its type and what
    it holds, and each value a text reads as `${context.<name>}`, with whether a public message
    may show it.'
  pt-br: 'Os fatos que nenhum comando sozinho possui e o contexto que o Keiko já guarda: cada
    fato que uma regra lê como `global.facts.<name>` e um texto como `$<name>`, com o tipo
    e o que ele guarda, e cada valor que um texto lê como `${context.<name>}`, dizendo se
    uma mensagem pública pode mostrá-lo.'
global.yml/GlobalCatalog:
  en-us: '`app/core/global.yml`: the facts more than one command reads, and the context every
    copy and form may read.'
  pt-br: '`app/core/global.yml`: os fatos que mais de um comando lê, e o contexto que todo copy
    e form pode ler.'
global.yml/GlobalCatalog.facts:
  en-us: The facts no single command owns, each read as `global.facts.<name>` by a rule and
    as `$<name>` or `${<name>}` by a text.
  pt-br: Os fatos que nenhum comando sozinho possui, cada um lido como `global.facts.<name>`
    por uma regra e como `$<name>` ou `${<name>}` por um texto.
global.yml/GlobalCatalog.context:
  en-us: The values Keiko already holds, each read as `${context.<name>}`.
  pt-br: Os valores que o Keiko já guarda, cada um lido como `${context.<name>}`.
global.yml/FactSpec:
  en-us: 'One fact: what a rule or a `$name` of a text reads, of one type.'
  pt-br: 'Um fato: o que uma regra ou um `$name` de um texto lê, de um tipo só.'
global.yml/FactSpec.type:
  en-us: 'The kind of value the code passes: `boolean`, `enum` (one of `values`), `number` or
    `text`.'
  pt-br: 'O tipo de valor que o código passa: `boolean`, `enum` (um dos `values`), `number`
    ou `text`.'
global.yml/FactSpec.values:
  en-us: The values an `enum` fact takes, the only ones a rule may compare it with.
  pt-br: Os valores que um fato `enum` assume, os únicos com que uma regra pode compará-lo.
global.yml/FactSpec.description:
  en-us: One sentence saying what the fact holds, for whoever writes a rule or a text that reads
    it.
  pt-br: Uma frase dizendo o que o fato guarda, para quem escreve uma regra ou um texto que
    o lê.
global.yml/ContextEntry:
  en-us: One value Keiko already holds in memory or in its cache, that a copy or a form text
    reads as `${context.<name>}`.
  pt-br: Um valor que o Keiko já guarda na memória ou no cache, que um texto de copy ou de
    form lê como `${context.<name>}`.
global.yml/ContextEntry.type:
  en-us: The kind of value the entry holds.
  pt-br: O tipo de valor que a entrada guarda.
global.yml/ContextEntry.each:
  en-us: 'Makes the entry a family read one member at a time, `${context.<name>.<key>}`: one
    per command key, or one per parent group; known when the copy loads.'
  pt-br: 'Faz da entrada uma família lida um membro por vez, `${context.<name>.<key>}`: um
    por chave de comando, ou um por grupo pai; conhecida quando a copy carrega.'
global.yml/ContextEntry.public:
  en-us: Whether the value may appear in a message every member of the server sees, not only
    in an admin's own screens.
  pt-br: Se o valor pode aparecer numa mensagem que todos os membros do servidor veem, e não
    só nas telas do próprio admin.
global.yml/ContextEntry.description:
  en-us: One sentence saying what the value is and where it comes from.
  pt-br: Uma frase dizendo o que é o valor e de onde ele vem.
catalog.yml:
  en-us: 'Every analytics event Keiko records: its collection, its actor, the props it may
    carry and how it advances a server''s lifetime counters.'
  pt-br: 'Todo evento de analytics que o Keiko registra: a coleção, o ator, as props que ele
    pode levar e como ele avança os contadores acumulados de um servidor.'
catalog.yml/Catalog:
  en-us: 'What app/analytics/catalog.yml declares: every event `record` accepts.'
  pt-br: 'O que o app/analytics/catalog.yml declara: todo evento que o `record` aceita.'
catalog.yml/Catalog.sources:
  en-us: Lists every value the `source` prop may take; any other becomes null, and an interaction
    no entry button stamped reads as `slash`.
  pt-br: Lista todo valor que a prop `source` pode ter; qualquer outro vira null, e uma interação
    que nenhum botão de entrada marcou conta como `slash`.
catalog.yml/Catalog.events:
  en-us: Declares every event `record` accepts under its `<domain>.<fact>` name; `record`
    drops any other name and counts it in `unknown`.
  pt-br: Declara todo evento que o `record` aceita, pelo nome `<domain>.<fact>`; o `record`
    descarta qualquer outro nome e o conta em `unknown`.
catalog.yml/EventDeclaration:
  en-us: 'One event `record` accepts: where it lands, who causes it and what it carries.'
  pt-br: 'Um evento que o `record` aceita: onde ele vai parar, quem o causa e o que ele leva.'
catalog.yml/EventDeclaration.version:
  en-us: Versions the event's props; every envelope carries it as `v`.
  pt-br: Versiona as props do evento; todo envelope leva a versão como `v`.
catalog.yml/EventDeclaration.collection:
  en-us: 'Says where the event lands: `changes` written at once and kept, `activity` and `interactions`
    in the writer''s batch for their TTL, `none` counted with no document.'
  pt-br: 'Diz onde o evento vai parar: `changes` é gravado na hora e guardado, `activity`
    e `interactions` vão no lote do writer pelo TTL delas, e `none` é contado sem documento.'
catalog.yml/EventDeclaration.description:
  en-us: Says what happened, for whoever reads the data; no code reads it.
  pt-br: Diz o que aconteceu, para quem lê os dados; nenhum código lê isto.
catalog.yml/EventDeclaration.recorded_in:
  en-us: Points to where the code records the event; every `app/...` path it cites must be
    a file of the repository.
  pt-br: Aponta onde o código registra o evento; todo caminho `app/...` citado precisa ser
    um arquivo do repositório.
catalog.yml/EventDeclaration.actor:
  en-us: Gives the actor kind when the call names none; a `user` actor gets the trace's user
    id.
  pt-br: Dá o tipo de ator quando a chamada não cita nenhum; um ator `user` recebe o id de
    usuário do trace.
catalog.yml/EventDeclaration.props:
  en-us: Lists the props the event may carry; `record` drops any other and counts it in `undeclared_props`,
    and none of them is guaranteed present.
  pt-br: Lista as props que o evento pode levar; o `record` descarta qualquer outra e a conta
    em `undeclared_props`, e nenhuma delas tem presença garantida.
catalog.yml/EventDeclaration.private_props:
  en-us: Keeps these props in the database and out of the monthly archive; the edge case it
    serves is a value a member wrote, such as a link's address.
  pt-br: Guarda estas props no banco e fora do arquivo mensal; o caso que isso cobre é um
    valor que um membro escreveu, como o endereço de um link.
catalog.yml/EventDeclaration.counts_as_value:
  en-us: 'Marks the feature doing its job: the reports count the event as delivered value
    and the writer advances the server''s value fields with it, so the event writes no `lifetime`
    of its own.'
  pt-br: 'Marca a funcionalidade fazendo o trabalho dela: os relatórios contam o evento como
    valor entregue e o writer avança com ele os campos de valor do servidor, então o evento
    não escreve um `lifetime` próprio.'
catalog.yml/EventDeclaration.scope:
  en-us: 'Says what the event is about: `server` names the call''s or the trace''s server,
    `keiko` is Keiko itself and names no server whatever the trace''s; only `keiko.settings_changed`
    is `keiko`.'
  pt-br: 'Diz do que o evento trata: `server` aponta o servidor da chamada ou do trace, `keiko`
    é o próprio Keiko e não aponta servidor nenhum, seja qual for o do trace; só `keiko.settings_changed`
    é `keiko`.'
catalog.yml/EventDeclaration.tally:
  en-us: Adds the event to a tally of Keiko's own in `analytics.keiko`; only `link.blocked`
    keeps one, by site.
  pt-br: Soma o evento a uma contagem do próprio Keiko em `analytics.keiko`; só o `link.blocked`
    tem uma, por site.
catalog.yml/EventDeclaration.lifetime:
  en-us: Says how the writer advances the server's `analytics.lifetime` with the event.
  pt-br: Diz como o writer avança o `analytics.lifetime` do servidor com o evento.
catalog.yml/Tally:
  en-us: A tally of Keiko's own the event adds to, split by the value of one prop.
  pt-br: Uma contagem do próprio Keiko à qual o evento soma, separada pelo valor de uma prop.
catalog.yml/Tally.name:
  en-us: 'Names the tally: the field it counts and the first part of its `{name}:total` and
    `{name}:{label}:{value}` counter ids.'
  pt-br: 'Dá o nome da contagem: o campo que ela conta e a primeira parte dos ids de contador
    `{name}:total` e `{name}:{label}:{value}`.'
catalog.yml/Tally.by:
  en-us: Names the prop, one the event declares, whose value gets its own counter.
  pt-br: Dá o nome da prop, uma que o evento declara, cujo valor ganha um contador próprio.
catalog.yml/Tally.label:
  en-us: Says what the prop's value is inside the per-value counter id.
  pt-br: Diz o que o valor da prop é dentro do id do contador por valor.
catalog.yml/Lifetime:
  en-us: How one event advances its server's `analytics.lifetime` document.
  pt-br: Como um evento avança o documento `analytics.lifetime` do servidor dele.
catalog.yml/Lifetime.counts_admin:
  en-us: Keeps the event's actor among the server's admins, counted in `admins_count`.
  pt-br: Mantém o ator do evento entre os admins do servidor, contados em `admins_count`.
catalog.yml/Lifetime.when:
  en-us: Applies the block only when every listed prop of the event equals its value.
  pt-br: Só aplica o bloco quando cada prop listada do evento é igual ao valor dela.
catalog.yml/Lifetime.inc:
  en-us: Adds the step to each counter path; `{feature}` is the event's cog, and a path naming
    it is skipped for an event with none.
  pt-br: Soma o incremento a cada caminho de contador; `{feature}` é o cog do evento, e um
    caminho que o cita é pulado num evento sem cog.
catalog.yml/Lifetime.set:
  en-us: 'Writes each path: `$ts` the event''s time, `null` clears the field.'
  pt-br: 'Grava cada caminho: `$ts` é o horário do evento, `null` limpa o campo.'
catalog.yml/Lifetime.min:
  en-us: Keeps the earliest event time at each path.
  pt-br: Guarda o horário mais antigo do evento em cada caminho.
catalog.yml/Lifetime.max:
  en-us: Keeps the latest event time at each path.
  pt-br: Guarda o horário mais recente do evento em cada caminho.
catalog.yml/Lifetime.removed_props:
  en-us: 'Names the `guild.removed` prop that reports a path this block writes: its count
    for an `inc` path, whether it is set for any other.'
  pt-br: 'Dá o nome da prop do `guild.removed` que informa um caminho que este bloco grava:
    a contagem dele num caminho de `inc`, e se ele está preenchido em qualquer outro.'

# The Portuguese of the YAML reference (docs/yaml-reference.html), read by make docs.
# Each key names the text it translates: <type> (the purpose of a YAML type),
# <type>/<Model> (a model) or <type>/<Model>.<field> (a field). `en-us` is the English
# the entry translated: when the schema's English changes, the entry is stale and the
# page shows the English until it is translated again (tests/test_yaml_reference.py).
form.yml:
  en-us: 'The settings flow of one command: the screens /setup and the manager panel walk
    (the intro, the cards and their sections, the lists, the review), what each screen asks
    and the answer key it writes. A command with settings writes one beside its package.'
  pt-br: 'O fluxo de configuração de um comando: as telas que o /setup e o painel de gerenciamento
    percorrem (a intro, os cards e suas seções, as listas, a revisão), o que cada tela pergunta
    e a chave de resposta que ela grava. Um comando com configurações escreve um ao lado do
    pacote dele.'
form.yml/FormFile:
  en-us: What a command's form.yml declares.
  pt-br: O que o form.yml de um comando declara.
form.yml/FormFile.version:
  en-us: The definition version a session is pinned to; every form is at 1 until one needs
    two live versions.
  pt-br: A versão da definição em que uma sessão fica presa; todo form está na 1 até algum
    precisar de duas versões ativas.
form.yml/FormFile.steps:
  en-us: The form's screens in order, the intro first and the review last.
  pt-br: 'As telas do form em ordem: a intro primeiro e a revisão por último.'
form.yml/FormFile.groups:
  en-us: Headings that steps and card fields name with `group` to share them on the panel
    and the review.
  pt-br: Títulos que etapas e campos de card citam com `group` para ficarem juntos sob eles
    no painel e na revisão.
form.yml/PanelGroupSpec:
  en-us: A heading several settings share on the panel and the review.
  pt-br: Um título que várias configurações dividem no painel e na revisão.
form.yml/PanelGroupSpec.title:
  en-us: The heading over the group's rows.
  pt-br: O título acima das linhas do grupo.
form.yml/PanelGroupSpec.emoji:
  en-us: The emoji before the heading.
  pt-br: O emoji antes do título.
form.yml/PanelGroupSpec.screen:
  en-us: The intro of the group's own screen under `description`; the screen is titled by
    the group's `title`.
  pt-br: A introdução da tela própria do grupo, em `description`; a tela leva o `title` do
    grupo como título.
form.yml/PanelGroupSpec.overrides:
  en-us: A heading and a screen intro that replace `title` and `screen.description` while a
    rule holds, for a group named after the mode in force; the first item whose rule holds wins.
  pt-br: Um título e uma introdução de tela que substituem `title` e `screen.description` enquanto
    uma regra vale, para um grupo cujo nome depende do modo ativo; vence o primeiro item cuja
    regra vale.
form.yml/PanelGroupSpec.opens:
  en-us: 'Where the group''s rows are edited: listed on the panel, on a screen of their own
    behind one Edit, or on that screen opened from a button on the panel''s last row, for
    settings that stay out of a list''s way.'
  pt-br: 'Onde as linhas do grupo são editadas: listadas no painel, numa tela própria atrás
    de um único Editar, ou nessa tela aberta por um botão na última linha do painel, para
    configurações que não devem atrapalhar uma lista.'
form.yml/PanelGroupSpec.button:
  en-us: 'The button that opens the group, with `opens: button`.'
  pt-br: 'O botão que abre o grupo, com `opens: button`.'
form.yml/PanelGroupSpec.order:
  en-us: Where the heading sorts among the panel's headings, lowest first.
  pt-br: A posição do título entre os títulos do painel, do menor para o maior.
form.yml/IntroStep:
  en-us: 'The first screen: what the feature does, then Confirm.'
  pt-br: 'A primeira tela: o que a funcionalidade faz, depois Confirmar.'
form.yml/IntroStep.type:
  en-us: 'Draws the first screen: what the feature does, then Confirm.'
  pt-br: 'Desenha a primeira tela: o que a funcionalidade faz, depois Confirmar.'
form.yml/IntroStep.key:
  en-us: The answer key the step produces, unique among the form's top-level steps.
  pt-br: A chave de resposta que a etapa produz, única entre as etapas de primeiro nível do
    form.
form.yml/IntroStep.title:
  en-us: The step's heading on its screen, its summary rows and the pickers.
  pt-br: O título da etapa na tela dela, nas linhas de resumo e nos seletores.
form.yml/IntroStep.description:
  en-us: The body under the title, with `${answer.<key>}`, `${plural.<key>|<one>|<many>}`
    and `${context.<name>}` tokens.
  pt-br: O corpo abaixo do título, com os tokens `${answer.<key>}`, `${plural.<key>|<one>|<many>}`
    e `${context.<name>}`.
form.yml/IntroStep.footer:
  en-us: The footer of the step's screen; the shared footer when left out, none when `null`.
  pt-br: O rodapé da tela da etapa; o rodapé compartilhado quando omitido, nenhum quando `null`.
form.yml/IntroStep.emoji:
  en-us: 'The step''s emoji: leads its title, its rows on summaries and, on a card, its header.'
  pt-br: 'O emoji da etapa: vem antes do título, das linhas nos resumos e, num card, do cabeçalho.'
form.yml/IntroStep.panel:
  en-us: How the intro reads on the panel; the step's description when left out.
  pt-br: Como a intro aparece no painel; a descrição da etapa quando omitido.
form.yml/TextStep:
  en-us: A modal with one text input, checked before it is answered.
  pt-br: Um modal com um campo de texto, validado antes de virar resposta.
form.yml/TextStep.type:
  en-us: Draws a modal with one text input, checked before it is answered.
  pt-br: Desenha um modal com um campo de texto, validado antes de virar resposta.
form.yml/TextStep.key:
  en-us: The answer key the step produces, unique among the form's top-level steps.
  pt-br: A chave de resposta que a etapa produz, única entre as etapas de primeiro nível do
    form.
form.yml/TextStep.title:
  en-us: The step's heading on its screen, its summary rows and the pickers.
  pt-br: O título da etapa na tela dela, nas linhas de resumo e nos seletores.
form.yml/TextStep.description:
  en-us: The body under the title, with `${answer.<key>}`, `${plural.<key>|<one>|<many>}`
    and `${context.<name>}` tokens.
  pt-br: O corpo abaixo do título, com os tokens `${answer.<key>}`, `${plural.<key>|<one>|<many>}`
    e `${context.<name>}`.
form.yml/TextStep.footer:
  en-us: The footer of the step's screen; the shared footer when left out, none when `null`.
  pt-br: O rodapé da tela da etapa; o rodapé compartilhado quando omitido, nenhum quando `null`.
form.yml/TextStep.emoji:
  en-us: 'The step''s emoji: leads its title, its rows on summaries and, on a card, its header.'
  pt-br: 'O emoji da etapa: vem antes do título, das linhas nos resumos e, num card, do cabeçalho.'
form.yml/TextStep.hidden:
  en-us: Keeps the answer off the review, the panel and the intro, for a question that only
    steers the flow.
  pt-br: Deixa a resposta fora da revisão, do painel e da intro, para uma pergunta que só
    direciona o fluxo.
form.yml/TextStep.appears_in:
  en-us: 'Where the step is asked: in the setup and on the panel, or only on the panel (`panel`,
    for a list filled after saving, left out of the setup and the intro); `setup` is refused,
    the panel edits every step.'
  pt-br: 'Onde a etapa é perguntada: no setup e no painel, ou só no painel (`panel`, para
    uma lista preenchida depois de salvar, fora do setup e da intro); `setup` é recusado,
    porque o painel edita toda etapa.'
form.yml/TextStep.when:
  en-us: Asks the step only while the rule holds.
  pt-br: Só pergunta a etapa enquanto a regra vale.
form.yml/TextStep.overrides:
  en-us: A title and a description that replace the step's own while a rule holds, for a step
    worded after the mode in force; the first item whose rule holds wins, so an item that writes
    a description, and every item before it, names only earlier answers, and a later one may
    name the step's own.
  pt-br: Um título e uma descrição que substituem os da etapa enquanto uma regra vale, para
    uma etapa escrita conforme o modo ativo; vence o primeiro item cuja regra vale, então um
    item que escreve uma descrição, e todo item antes dele, cita só respostas anteriores, e
    um item depois pode citar a resposta da própria etapa.
form.yml/TextStep.label:
  en-us: The label of the input, the step title when left out.
  pt-br: O rótulo do campo; o título da etapa quando omitido.
form.yml/TextStep.placeholder:
  en-us: The grey hint inside the empty input.
  pt-br: A dica cinza dentro do campo vazio.
form.yml/TextStep.max_length:
  en-us: The most characters the input accepts.
  pt-br: O máximo de caracteres que o campo aceita.
form.yml/TextStep.normalize:
  en-us: The registered normalizer the typed value goes through before it is checked, looked
    up and kept.
  pt-br: O normalizador registrado pelo qual o valor digitado passa antes de ser validado,
    buscado e guardado.
form.yml/TextStep.validation:
  en-us: Runs a registered validator on submit, with any lookup it needs.
  pt-br: Roda um validador registrado no envio, com a busca que ele precisar.
form.yml/TextStep.transform:
  en-us: Stores the typed value through a registered transform, such as a normalized link.
  pt-br: Guarda o valor digitado através de uma transformação registrada, como um link normalizado.
form.yml/TextStep.format:
  en-us: How summaries format the answer, such as a link shown as code.
  pt-br: Como os resumos formatam a resposta, por exemplo um link mostrado como código.
form.yml/TextStep.image:
  en-us: The lookup answer whose picture the review draws under the step's line, such as the
    avatar of the account the lookup found.
  pt-br: A resposta da busca cuja imagem a revisão desenha abaixo da linha da etapa, como
    o avatar da conta que a busca encontrou.
form.yml/TextStep.lookup_answers:
  en-us: Keeps values the validator's lookup found as answers a later description, line or
    picture reads.
  pt-br: Guarda valores que a busca do validador encontrou como respostas que uma descrição,
    linha ou imagem posterior lê.
form.yml/SingleChoiceStep:
  en-us: Buttons to pick one option from.
  pt-br: Botões para escolher uma opção.
form.yml/SingleChoiceStep.type:
  en-us: Draws buttons to pick one option from.
  pt-br: Desenha botões para escolher uma opção.
form.yml/SingleChoiceStep.key:
  en-us: The answer key the step produces, unique among the form's top-level steps.
  pt-br: A chave de resposta que a etapa produz, única entre as etapas de primeiro nível do
    form.
form.yml/SingleChoiceStep.title:
  en-us: The step's heading on its screen, its summary rows and the pickers.
  pt-br: O título da etapa na tela dela, nas linhas de resumo e nos seletores.
form.yml/SingleChoiceStep.description:
  en-us: The body under the title, with `${answer.<key>}`, `${plural.<key>|<one>|<many>}`
    and `${context.<name>}` tokens.
  pt-br: O corpo abaixo do título, com os tokens `${answer.<key>}`, `${plural.<key>|<one>|<many>}`
    e `${context.<name>}`.
form.yml/SingleChoiceStep.footer:
  en-us: The footer of the step's screen; the shared footer when left out, none when `null`.
  pt-br: O rodapé da tela da etapa; o rodapé compartilhado quando omitido, nenhum quando `null`.
form.yml/SingleChoiceStep.emoji:
  en-us: 'The step''s emoji: leads its title, its rows on summaries and, on a card, its header.'
  pt-br: 'O emoji da etapa: vem antes do título, das linhas nos resumos e, num card, do cabeçalho.'
form.yml/SingleChoiceStep.hidden:
  en-us: Keeps the answer off the review, the panel and the intro, for a question that only
    steers the flow.
  pt-br: Deixa a resposta fora da revisão, do painel e da intro, para uma pergunta que só
    direciona o fluxo.
form.yml/SingleChoiceStep.appears_in:
  en-us: 'Where the step is asked: in the setup and on the panel, or only on the panel (`panel`,
    for a list filled after saving, left out of the setup and the intro); `setup` is refused,
    the panel edits every step.'
  pt-br: 'Onde a etapa é perguntada: no setup e no painel, ou só no painel (`panel`, para
    uma lista preenchida depois de salvar, fora do setup e da intro); `setup` é recusado,
    porque o painel edita toda etapa.'
form.yml/SingleChoiceStep.when:
  en-us: Asks the step only while the rule holds.
  pt-br: Só pergunta a etapa enquanto a regra vale.
form.yml/SingleChoiceStep.overrides:
  en-us: A title and a description that replace the step's own while a rule holds, for a step
    worded after the mode in force; the first item whose rule holds wins, so an item that writes
    a description, and every item before it, names only earlier answers, and a later one may
    name the step's own.
  pt-br: Um título e uma descrição que substituem os da etapa enquanto uma regra vale, para
    uma etapa escrita conforme o modo ativo; vence o primeiro item cuja regra vale, então um
    item que escreve uma descrição, e todo item antes dele, cita só respostas anteriores, e
    um item depois pode citar a resposta da própria etapa.
form.yml/SingleChoiceStep.options:
  en-us: One button per option.
  pt-br: Um botão por opção.
form.yml/SingleChoiceStep.required:
  en-us: Refuses Confirm while nothing is chosen.
  pt-br: Recusa o Confirmar enquanto nada foi escolhido.
form.yml/SingleChoiceStep.auto_confirm:
  en-us: A press answers at once, with no Confirm button.
  pt-br: Um clique já responde, sem botão Confirmar.
form.yml/SingleChoiceStep.format:
  en-us: How summaries format the answer; the chosen option's label when left out.
  pt-br: Como os resumos formatam a resposta; o rótulo da opção escolhida quando omitido.
form.yml/CardStep:
  en-us: A Components V2 card whose sections each edit part of the answer.
  pt-br: Um card Components V2 em que cada seção edita uma parte da resposta.
form.yml/CardStep.type:
  en-us: Draws a card whose sections each edit part of the answer.
  pt-br: Desenha um card em que cada seção edita uma parte da resposta.
form.yml/CardStep.key:
  en-us: The answer key the step produces, unique among the form's top-level steps.
  pt-br: A chave de resposta que a etapa produz, única entre as etapas de primeiro nível do
    form.
form.yml/CardStep.title:
  en-us: The card's heading on its screen, its summary rows and the pickers; a top-level card
    left without one reads the intro's, a card inside a list writes it.
  pt-br: O título do card na tela dele, nas linhas de resumo e nos seletores; um card de primeiro
    nível sem título usa o da intro, e um card dentro de uma lista precisa escrever o seu.
form.yml/CardStep.description:
  en-us: The body under the title, with `${answer.<key>}`, `${plural.<key>|<one>|<many>}`
    and `${context.<name>}` tokens.
  pt-br: O corpo abaixo do título, com os tokens `${answer.<key>}`, `${plural.<key>|<one>|<many>}`
    e `${context.<name>}`.
form.yml/CardStep.footer:
  en-us: The footer of the step's screen; the shared footer when left out, none when `null`.
  pt-br: O rodapé da tela da etapa; o rodapé compartilhado quando omitido, nenhum quando `null`.
form.yml/CardStep.emoji:
  en-us: 'The step''s emoji: leads its title, its rows on summaries and, on a card, its header.'
  pt-br: 'O emoji da etapa: vem antes do título, das linhas nos resumos e, num card, do cabeçalho.'
form.yml/CardStep.hidden:
  en-us: Keeps the answer off the review, the panel and the intro, for a question that only
    steers the flow.
  pt-br: Deixa a resposta fora da revisão, do painel e da intro, para uma pergunta que só
    direciona o fluxo.
form.yml/CardStep.appears_in:
  en-us: 'Where the step is asked: in the setup and on the panel, or only on the panel (`panel`,
    for a list filled after saving, left out of the setup and the intro); `setup` is refused,
    the panel edits every step.'
  pt-br: 'Onde a etapa é perguntada: no setup e no painel, ou só no painel (`panel`, para
    uma lista preenchida depois de salvar, fora do setup e da intro); `setup` é recusado,
    porque o painel edita toda etapa.'
form.yml/CardStep.when:
  en-us: Asks the step only while the rule holds.
  pt-br: Só pergunta a etapa enquanto a regra vale.
form.yml/CardStep.overrides:
  en-us: A title and a description that replace the step's own while a rule holds, for a step
    worded after the mode in force; the first item whose rule holds wins, so an item that writes
    a description, and every item before it, names only earlier answers, and a later one may
    name the step's own.
  pt-br: Um título e uma descrição que substituem os da etapa enquanto uma regra vale, para
    uma etapa escrita conforme o modo ativo; vence o primeiro item cuja regra vale, então um
    item que escreve uma descrição, e todo item antes dele, cita só respostas anteriores, e
    um item depois pode citar a resposta da própria etapa.
form.yml/CardStep.header:
  en-us: The card's title and the picture of Keiko beside it.
  pt-br: O título do card e a imagem do Keiko ao lado.
form.yml/CardStep.edit:
  en-us: 'What one Edit opens on the panel and the review: the whole card, or only the section
    of each line (`field`, refused inside a list).'
  pt-br: 'O que um Editar abre no painel e na revisão: o card inteiro, ou só a seção de cada
    linha (`field`, recusado dentro de uma lista).'
form.yml/CardStep.preview:
  en-us: '`true` draws a Preview first under the card, and beside each item of a list for
    an item card; the object for a preview that waits on keys or fills tokens.'
  pt-br: '`true` desenha um Pré-visualizar primeiro abaixo do card, e ao lado de cada item
    de uma lista num card de item; o objeto, para uma prévia que espera chaves ou preenche
    tokens.'
form.yml/CardStep.required:
  en-us: Keys that refuse Done while they are empty.
  pt-br: Chaves que recusam o Avançar enquanto estiverem vazias.
form.yml/CardStep.transform:
  en-us: Writes a value derived from the card's state on Done and seeds its parts back on
    an edit, such as a date from a day and a month.
  pt-br: Grava no Avançar um valor derivado do estado do card e devolve as partes numa edição,
    como uma data feita de dia e mês.
form.yml/CardStep.group:
  en-us: The `groups` entry whose heading lists the card's rows.
  pt-br: A entrada de `groups` cujo título lista as linhas do card.
form.yml/CardStep.fields:
  en-us: The keys Done saves, and how summaries and the intro show them.
  pt-br: As chaves que o Avançar salva, e como os resumos e a intro as mostram.
form.yml/CardStep.sections:
  en-us: The card's editable parts.
  pt-br: As partes editáveis do card.
form.yml/CardStep.defaults:
  en-us: Seeds the card's state with these values while nothing is answered or saved.
  pt-br: Preenche o estado do card com estes valores enquanto nada foi respondido ou salvo.
form.yml/ListStep:
  en-us: A list of items, each built by a child session over `steps`.
  pt-br: Uma lista de itens, cada um montado por uma sessão filha sobre `steps`.
form.yml/ListStep.type:
  en-us: Draws a list of items, each built by a child session over `steps`.
  pt-br: Desenha uma lista de itens, cada um montado por uma sessão filha sobre `steps`.
form.yml/ListStep.key:
  en-us: The answer key the step produces, unique among the form's top-level steps.
  pt-br: A chave de resposta que a etapa produz, única entre as etapas de primeiro nível do
    form.
form.yml/ListStep.title:
  en-us: The step's heading on its screen, its summary rows and the pickers.
  pt-br: O título da etapa na tela dela, nas linhas de resumo e nos seletores.
form.yml/ListStep.description:
  en-us: The body under the title, with `${answer.<key>}`, `${plural.<key>|<one>|<many>}`
    and `${context.<name>}` tokens.
  pt-br: O corpo abaixo do título, com os tokens `${answer.<key>}`, `${plural.<key>|<one>|<many>}`
    e `${context.<name>}`.
form.yml/ListStep.footer:
  en-us: The footer of the step's screen; the shared footer when left out, none when `null`.
  pt-br: O rodapé da tela da etapa; o rodapé compartilhado quando omitido, nenhum quando `null`.
form.yml/ListStep.emoji:
  en-us: 'The step''s emoji: leads its title, its rows on summaries and, on a card, its header.'
  pt-br: 'O emoji da etapa: vem antes do título, das linhas nos resumos e, num card, do cabeçalho.'
form.yml/ListStep.hidden:
  en-us: Keeps the answer off the review, the panel and the intro, for a question that only
    steers the flow.
  pt-br: Deixa a resposta fora da revisão, do painel e da intro, para uma pergunta que só
    direciona o fluxo.
form.yml/ListStep.appears_in:
  en-us: 'Where the step is asked: in the setup and on the panel, or only on the panel (`panel`,
    for a list filled after saving, left out of the setup and the intro); `setup` is refused,
    the panel edits every step.'
  pt-br: 'Onde a etapa é perguntada: no setup e no painel, ou só no painel (`panel`, para
    uma lista preenchida depois de salvar, fora do setup e da intro); `setup` é recusado,
    porque o painel edita toda etapa.'
form.yml/ListStep.when:
  en-us: Asks the step only while the rule holds.
  pt-br: Só pergunta a etapa enquanto a regra vale.
form.yml/ListStep.overrides:
  en-us: A title and a description that replace the step's own while a rule holds, for a step
    worded after the mode in force; the first item whose rule holds wins, so an item that writes
    a description, and every item before it, names only earlier answers, and a later one may
    name the step's own.
  pt-br: Um título e uma descrição que substituem os da etapa enquanto uma regra vale, para
    uma etapa escrita conforme o modo ativo; vence o primeiro item cuja regra vale, então um
    item que escreve uma descrição, e todo item antes dele, cita só respostas anteriores, e
    um item depois pode citar a resposta da própria etapa.
form.yml/ListStep.items:
  en-us: How many items the list holds and how.
  pt-br: Quantos itens a lista comporta e como.
form.yml/ListStep.edit:
  en-us: 'What one Edit opens on the panel and the review: the whole list, or one item, each
    drawn as its own block with Edit and Preview (`item`).'
  pt-br: 'O que um Editar abre no painel e na revisão: a lista inteira, ou um item, cada um
    desenhado como um bloco próprio com Editar e Pré-visualizar (`item`).'
form.yml/ListStep.remove:
  en-us: 'Where items are removed: on the list''s own screen, or with a red Remove beside
    each item on the panel (`item`, needs `edit: item`).'
  pt-br: 'Onde os itens são removidos: na tela própria da lista, ou por um Remover vermelho
    ao lado de cada item no painel (`item`, precisa de `edit: item`).'
form.yml/ListStep.search:
  en-us: Adds a Search that finds an item by the member its `unique.key` picks, for a list
    keyed by members.
  pt-br: Adiciona um Pesquisar que acha um item pelo membro que a `unique.key` dele escolhe,
    para uma lista indexada por membros.
form.yml/ListStep.counter:
  en-us: The value beside the list's title on the panel and the review, with `$count` and
    `$max`.
  pt-br: O valor ao lado do título da lista no painel e na revisão, com `$count` e `$max`.
form.yml/ListStep.last_item_warning:
  en-us: 'The warning before removing the last item of a list with `items.min: 1`, with `$item`
    and `$feature`.'
  pt-br: 'O aviso antes de remover o último item de uma lista com `items.min: 1`, com `$item`
    e `$feature`.'
form.yml/ListStep.group:
  en-us: The `groups` entry whose heading lists the list's rows.
  pt-br: A entrada de `groups` cujo título lista as linhas da lista.
form.yml/ListStep.steps:
  en-us: The item's own steps, run as a child session for each item.
  pt-br: As etapas do próprio item, rodadas como uma sessão filha para cada item.
form.yml/ReviewStep:
  en-us: 'The last screen: the summary and the final Confirm.'
  pt-br: 'A última tela: o resumo e o Confirmar final.'
form.yml/ReviewStep.type:
  en-us: 'Draws the last screen: the summary and the final Confirm.'
  pt-br: 'Desenha a última tela: o resumo e o Confirmar final.'
form.yml/ReviewStep.key:
  en-us: The answer key the step produces, unique among the form's top-level steps.
  pt-br: A chave de resposta que a etapa produz, única entre as etapas de primeiro nível do
    form.
form.yml/ReviewStep.title:
  en-us: The review's heading; the intro's title when left out.
  pt-br: O título da revisão; o título da intro quando omitido.
form.yml/ReviewStep.description:
  en-us: The body under the title, with `${answer.<key>}`, `${plural.<key>|<one>|<many>}`
    and `${context.<name>}` tokens; the shared `fallbacks.review_description` when left out.
  pt-br: O corpo abaixo do título, com os tokens `${answer.<key>}`, `${plural.<key>|<one>|<many>}`
    e `${context.<name>}`; o `fallbacks.review_description` compartilhado quando omitido.
form.yml/ReviewStep.footer:
  en-us: The footer of the step's screen; the shared footer when left out, none when `null`.
  pt-br: O rodapé da tela da etapa; o rodapé compartilhado quando omitido, nenhum quando `null`.
form.yml/ReviewStep.emoji:
  en-us: 'The step''s emoji: leads its title, its rows on summaries and, on a card, its header.'
  pt-br: 'O emoji da etapa: vem antes do título, das linhas nos resumos e, num card, do cabeçalho.'
form.yml/ReviewStep.preview:
  en-us: Shows a Preview on the review while no list item previews itself.
  pt-br: Mostra um Pré-visualizar na revisão enquanto nenhum item de lista tiver prévia própria.
form.yml/ReviewStep.info:
  en-us: A closing note above the footer, such as how members add their own items.
  pt-br: Uma nota de fechamento acima do rodapé, como explicar que os membros cadastram os
    próprios itens.
form.yml/ReviewStep.lines:
  en-us: Lines read from answers the document never keeps, such as what a lookup found.
  pt-br: Linhas lidas de respostas que o documento nunca guarda, como o que uma busca encontrou.
form.yml/Text:
  en-us: One text in both locales Keiko speaks, the node every form and copy file writes.
  pt-br: Um texto nos dois idiomas que o Keiko fala, o nó que todo arquivo de form e de copy
    escreve.
form.yml/Text.en-us:
  en-us: What Keiko writes to an English-speaking server or member.
  pt-br: O que o Keiko escreve para um servidor ou membro que fala inglês.
form.yml/Text.pt-br:
  en-us: What Keiko writes to a Portuguese-speaking server or member.
  pt-br: O que o Keiko escreve para um servidor ou membro que fala português.
form.yml/Screen:
  en-us: 'The texts of a screen of its own: its title and the intro under it.'
  pt-br: 'Os textos de uma tela própria: o título e a introdução abaixo dele.'
form.yml/Screen.title:
  en-us: The screen's title; its owner's label when left out.
  pt-br: O título da tela; o rótulo do dono dela quando omitido.
form.yml/Screen.description:
  en-us: The intro under the screen's title; none when left out.
  pt-br: A introdução abaixo do título da tela; nenhuma quando omitida.
form.yml/TextOverride:
  en-us: Texts that replace the default ones while the rule holds; the first item whose rule
    holds wins and replaces only the texts it writes.
  pt-br: Textos que substituem os padrões enquanto a regra vale; vence o primeiro item cuja
    regra vale, e ele substitui só os textos que escreve.
form.yml/TextOverride.when:
  en-us: The rule under which this item's fields replace the block's.
  pt-br: A regra sob a qual os campos deste item substituem os do bloco.
form.yml/TextOverride.title:
  en-us: The title shown while the rule holds.
  pt-br: O título mostrado enquanto a regra vale.
form.yml/TextOverride.description:
  en-us: The description shown while the rule holds.
  pt-br: A descrição mostrada enquanto a regra vale.
form.yml/ButtonSpec:
  en-us: A button the form labels.
  pt-br: Um botão que o form rotula.
form.yml/ButtonSpec.label:
  en-us: The text on the button.
  pt-br: O texto no botão.
form.yml/IntroPanel:
  en-us: How the intro reads on the panel.
  pt-br: Como a intro aparece no painel.
form.yml/IntroPanel.description:
  en-us: The intro of the panel, written as what the feature is doing.
  pt-br: A introdução do painel, escrita como o que a funcionalidade está fazendo.
form.yml/Leaf:
  en-us: One test on one key of the scope chain, with exactly one operator.
  pt-br: Um teste sobre uma chave do escopo, com exatamente um operador.
form.yml/Leaf.key:
  en-us: 'The value the rule tests: in a form, an answer key, behind `parent.` or `item.` for
    an outer session or a list item, or `items.count`; in a copy file, a fact by its address
    (`<owner>.facts.<name>`).'
  pt-br: 'O valor que a regra testa: num form, uma chave de resposta, atrás de `parent.` ou
    `item.` para uma sessão externa ou um item de lista, ou `items.count`; num arquivo de copy,
    um fato pelo endereço dele (`<owner>.facts.<name>`).'
form.yml/Leaf.is:
  en-us: Holds while the value equals this one.
  pt-br: Vale enquanto o valor for igual a este.
form.yml/Leaf.in:
  en-us: Holds while the value is one of these.
  pt-br: Vale enquanto o valor for um destes.
form.yml/Leaf.not_in:
  en-us: Holds while the value is none of these.
  pt-br: Vale enquanto o valor não for nenhum destes.
form.yml/Leaf.matches:
  en-us: Holds while the value matches this regular expression.
  pt-br: Vale enquanto o valor casar com esta expressão regular.
form.yml/Leaf.present:
  en-us: Holds while the value is filled, or while it is empty when `false`.
  pt-br: Vale enquanto o valor estiver preenchido, ou vazio quando `false`.
form.yml/Leaf.count:
  en-us: Holds while the number of values is within these bounds.
  pt-br: Vale enquanto a quantidade de valores estiver dentro destes limites.
form.yml/All:
  en-us: True when every rule holds.
  pt-br: Verdadeira quando todas as regras valem.
form.yml/All.all:
  en-us: The rules that must all hold.
  pt-br: As regras que precisam valer todas.
form.yml/AnyOf:
  en-us: True when at least one rule holds.
  pt-br: Verdadeira quando pelo menos uma regra vale.
form.yml/AnyOf.any:
  en-us: The rules one of which must hold.
  pt-br: As regras das quais pelo menos uma precisa valer.
form.yml/Not:
  en-us: True when the rule does not hold.
  pt-br: Verdadeira quando a regra não vale.
form.yml/Not.not:
  en-us: The rule that must not hold.
  pt-br: A regra que não pode valer.
form.yml/Extension:
  en-us: A registered validator, transform or normalizer and the params it takes.
  pt-br: Um validador, transformação ou normalizador registrado e os parâmetros que ele recebe.
form.yml/Extension.name:
  en-us: 'The registered name the bot runs the value through: a validator under `validation`,
    a transform under `transform`, a normalizer under `normalize`.'
  pt-br: 'O nome registrado pelo qual o bot passa o valor: um validador em `validation`, uma
    transformação em `transform`, um normalizador em `normalize`.'
form.yml/Extension.params:
  en-us: What the extension reads besides the typed value; the compiler asks for exactly the
    params its declaration names, none for a transform or a normalizer.
  pt-br: O que a extensão lê além do valor digitado; o compilador exige exatamente os parâmetros
    que a declaração dela cita, e nenhum para uma transformação ou um normalizador.
form.yml/Option:
  en-us: One choice of a single-choice step or a card section.
  pt-br: Uma opção de uma etapa de escolha única ou de uma seção de card.
form.yml/Option.label:
  en-us: The text of the choice's button or select row.
  pt-br: O texto do botão ou da linha do select da opção.
form.yml/Option.value:
  en-us: The value stored when the choice is picked; rules compare with it.
  pt-br: O valor guardado quando a opção é escolhida; as regras comparam com ele.
form.yml/Option.style:
  en-us: The colour of the choice's button, grey when left out.
  pt-br: A cor do botão da opção; cinza quando omitida.
form.yml/Option.description:
  en-us: A line under the choice on its select and on its section's screen, for choices such
    as modes that need a sentence each.
  pt-br: Uma linha abaixo da opção no select e na tela da seção, para opções como modos que
    precisam de uma frase cada.
form.yml/Header:
  en-us: 'The card header: its title and the picture of Keiko beside it.'
  pt-br: 'O cabeçalho do card: o título e a imagem do Keiko ao lado.'
form.yml/Header.title:
  en-us: The header title, after the card's emoji; the card's title when left out.
  pt-br: O título do cabeçalho, depois do emoji do card; o título do card quando omitido.
form.yml/Header.thumbnail:
  en-us: The picture of Keiko drawn beside the header; none when left out.
  pt-br: A imagem do Keiko desenhada ao lado do cabeçalho; nenhuma quando omitida.
form.yml/CardPreview:
  en-us: The Preview of a card that waits on keys or fills tokens.
  pt-br: O Pré-visualizar de um card que espera chaves ou preenche tokens.
form.yml/CardPreview.required:
  en-us: 'Keys the preview is drawn from: while they are empty, Preview answers `error` instead.'
  pt-br: 'As chaves de onde a prévia é desenhada: enquanto elas estiverem vazias, o Pré-visualizar
    responde com `error` no lugar.'
form.yml/CardPreview.error:
  en-us: The error block whose message Preview answers while a key it requires is empty.
  pt-br: O bloco de erro cuja mensagem o Pré-visualizar mostra enquanto uma chave que ele
    exige estiver vazia.
form.yml/CardPreview.tokens:
  en-us: Fills these `{token}` names in the previews of the messages the admin types, such
    as the member, the server and the date.
  pt-br: Preenche estes nomes `{token}` nas prévias das mensagens que o admin digita, como
    o membro, o servidor e a data.
form.yml/Required:
  en-us: 'Keys that must hold a value: every one of some, or any one of others.'
  pt-br: 'Chaves que precisam ter um valor: todas de um grupo, ou qualquer uma de outro.'
form.yml/Required.all:
  en-us: Refuses while one of these keys is shown and empty.
  pt-br: Recusa enquanto uma destas chaves estiver visível e vazia.
form.yml/Required.any:
  en-us: Refuses while every one of these shown keys is empty, for settings any one of which
    is enough.
  pt-br: Recusa enquanto todas estas chaves visíveis estiverem vazias, para configurações
    em que qualquer uma basta.
form.yml/CardField:
  en-us: A persisted key of a card and how summaries show it.
  pt-br: Uma chave salva de um card e como os resumos a mostram.
form.yml/CardField.key:
  en-us: A key the card's Done saves; a state key no field names stays in the draft.
  pt-br: Uma chave que o Avançar do card salva; uma chave de estado que nenhum campo cita
    fica só no rascunho.
form.yml/CardField.label:
  en-us: The key's name on summaries, the panel and the intro; the label of the section, select
    or input that owns the key when left out.
  pt-br: O nome da chave nos resumos, no painel e na intro; o rótulo da seção, select ou campo
    dono da chave quando omitido.
form.yml/CardField.emoji:
  en-us: The emoji of the key's line when no section owns the key, for a value a transform
    writes.
  pt-br: O emoji da linha da chave quando nenhuma seção é dona dela, para um valor que uma
    transformação grava.
form.yml/CardField.description:
  en-us: The line the intro lists for this setting.
  pt-br: A linha que a intro lista para esta configuração.
form.yml/CardField.format:
  en-us: How summaries format the value; the format of the section or select that owns the
    key when left out.
  pt-br: Como os resumos formatam o valor; o formato da seção ou do select dono da chave quando
    omitido.
form.yml/CardField.hidden:
  en-us: Keeps the key off the review, the panel and the intro, for bookkeeping keys such
    as a mode or an image url.
  pt-br: Deixa a chave fora da revisão, do painel e da intro, para chaves de controle como
    um modo ou a url de uma imagem.
form.yml/CardField.button:
  en-us: The Edit beside the key's row, for a row whose Edit only adds; Edit when left out.
  pt-br: O Editar ao lado da linha da chave, para uma linha cujo Editar só adiciona; Editar
    quando omitido.
form.yml/CardField.group:
  en-us: The `groups` entry whose heading lists the key's row with an Edit of its own, for
    a key that belongs with another step's rows.
  pt-br: A entrada de `groups` cujo título lista a linha da chave com um Editar próprio, para
    uma chave que pertence às linhas de outra etapa.
form.yml/ItemsSpec:
  en-us: How many items a list holds and what tells them apart.
  pt-br: Quantos itens uma lista comporta e o que diferencia um do outro.
form.yml/ItemsSpec.max:
  en-us: The most items the list holds; Add is off when full.
  pt-br: O máximo de itens da lista; o Adicionar fica desligado quando ela enche.
form.yml/ItemsSpec.min:
  en-us: '`1` keeps the list from being emptied: Remove leaves the last item, or warns that
    the feature turns off with it.'
  pt-br: '`1` impede que a lista fique vazia: o Remover mantém o último item, ou avisa que
    a funcionalidade desliga junto.'
form.yml/ItemsSpec.unique:
  en-us: The item key two items may not share.
  pt-br: A chave do item que dois itens não podem repetir.
form.yml/Search:
  en-us: How an admin finds an item of a list by its member.
  pt-br: Como um admin acha um item de uma lista pelo membro.
form.yml/Search.screen:
  en-us: The title of a found item's screen, with `$item`; the list's emoji and the item's
    name when left out.
  pt-br: O título da tela de um item encontrado, com `$item`; o emoji da lista e o nome do
    item quando omitido.
form.yml/ReviewLine:
  en-us: A line of the review read from an answer the document never keeps.
  pt-br: Uma linha da revisão lida de uma resposta que o documento nunca guarda.
form.yml/ReviewLine.emoji:
  en-us: Leads the line.
  pt-br: Vem no começo da linha.
form.yml/ReviewLine.label:
  en-us: The line's label.
  pt-br: O rótulo da linha.
form.yml/ReviewLine.answer:
  en-us: The answer the line shows; the line is left out while it is empty.
  pt-br: A resposta que a linha mostra; a linha some enquanto ela estiver vazia.
form.yml/Count:
  en-us: Bounds on how many values an answer holds.
  pt-br: Limites de quantos valores uma resposta tem.
form.yml/Count.min:
  en-us: The fewest values the rule accepts.
  pt-br: O mínimo de valores que a regra aceita.
form.yml/Count.max:
  en-us: The most values the rule accepts.
  pt-br: O máximo de valores que a regra aceita.
form.yml/PreviewAnswer:
  en-us: A preview token filled with an answer.
  pt-br: Um token da prévia preenchido com uma resposta.
form.yml/PreviewAnswer.answer:
  en-us: The answer whose value replaces the token.
  pt-br: A resposta cujo valor substitui o token.
form.yml/PreviewAnswer.format:
  en-us: How the value is formatted before it replaces it.
  pt-br: Como o valor é formatado antes de substituir o token.
form.yml/PreviewContext:
  en-us: A preview token filled with a value of the interaction.
  pt-br: Um token da prévia preenchido com um valor da interação.
form.yml/PreviewContext.context:
  en-us: 'The interaction value that replaces the token: the server''s name.'
  pt-br: 'O valor da interação que substitui o token: o nome do servidor.'
form.yml/TitleContentSection:
  en-us: A title plus a body, default or custom.
  pt-br: Um título e um corpo, padrão ou personalizados.
form.yml/TitleContentSection.type:
  en-us: Draws a title and a body the admin keeps default or customizes.
  pt-br: Desenha um título e um corpo que o admin mantém no padrão ou personaliza.
form.yml/TitleContentSection.key:
  en-us: The section's id, unique in its card, named by groups and edits.
  pt-br: O id da seção, único no card, citado por grupos e edições.
form.yml/TitleContentSection.emoji:
  en-us: Leads the section's heading and lines.
  pt-br: Vem antes do título e das linhas da seção.
form.yml/TitleContentSection.label:
  en-us: The section's heading on the card.
  pt-br: O título da seção no card.
form.yml/TitleContentSection.description:
  en-us: Lines under the heading while the card is edited.
  pt-br: Linhas abaixo do título enquanto o card é editado.
form.yml/TitleContentSection.keys:
  en-us: The state keys the section writes.
  pt-br: As chaves de estado que a seção grava.
form.yml/TitleContentSection.image:
  en-us: Draws the picture held by that state key or lookup answer under the section's lines.
  pt-br: Desenha, abaixo das linhas da seção, a imagem guardada nessa chave de estado ou resposta
    de busca.
form.yml/TitleContentSection.when:
  en-us: Shows the section only while the rule over the card's state holds; a hidden section
    is never required.
  pt-br: Só mostra a seção enquanto a regra sobre o estado do card vale; uma seção escondida
    nunca é obrigatória.
form.yml/TitleContentSection.appears_in:
  en-us: 'Where the card draws the section: always, only while nothing is saved (`setup`,
    for what a first setup offers once), or only once something is (`panel`).'
  pt-br: 'Onde o card desenha a seção: sempre, só enquanto nada foi salvo (`setup`, para o
    que o primeiro setup oferece uma vez só), ou só depois que algo foi salvo (`panel`).'
form.yml/TitleContentSection.button:
  en-us: The button that opens the section, Edit when left out.
  pt-br: O botão que abre a seção; Editar quando omitido.
form.yml/TitleContentSection.modal:
  en-us: The modal the title and body are typed in.
  pt-br: O modal onde o título e o corpo são digitados.
form.yml/TitleContentSection.default:
  en-us: 'The copy block whose `title` and `description` the section shows, and its modal
    starts from, until the admin customizes them: the text the command posts while nobody
    did.'
  pt-br: 'O bloco de copy cujos `title` e `description` a seção mostra, e de onde o modal
    começa, até o admin personalizar: o texto que o comando publica enquanto ninguém mudou.'
form.yml/FileUploadSection:
  en-us: An image, default or uploaded.
  pt-br: Uma imagem, padrão ou enviada.
form.yml/FileUploadSection.type:
  en-us: Draws an image the admin keeps default or uploads.
  pt-br: Desenha uma imagem que o admin mantém no padrão ou envia.
form.yml/FileUploadSection.key:
  en-us: The section's id, unique in its card, named by groups and edits.
  pt-br: O id da seção, único no card, citado por grupos e edições.
form.yml/FileUploadSection.emoji:
  en-us: Leads the section's heading and lines.
  pt-br: Vem antes do título e das linhas da seção.
form.yml/FileUploadSection.label:
  en-us: The section's heading on the card.
  pt-br: O título da seção no card.
form.yml/FileUploadSection.description:
  en-us: Lines under the heading while the card is edited.
  pt-br: Linhas abaixo do título enquanto o card é editado.
form.yml/FileUploadSection.keys:
  en-us: The state keys the section writes.
  pt-br: As chaves de estado que a seção grava.
form.yml/FileUploadSection.image:
  en-us: Draws the picture held by that state key or lookup answer under the section's lines.
  pt-br: Desenha, abaixo das linhas da seção, a imagem guardada nessa chave de estado ou resposta
    de busca.
form.yml/FileUploadSection.when:
  en-us: Shows the section only while the rule over the card's state holds; a hidden section
    is never required.
  pt-br: Só mostra a seção enquanto a regra sobre o estado do card vale; uma seção escondida
    nunca é obrigatória.
form.yml/FileUploadSection.appears_in:
  en-us: 'Where the card draws the section: always, only while nothing is saved (`setup`,
    for what a first setup offers once), or only once something is (`panel`).'
  pt-br: 'Onde o card desenha a seção: sempre, só enquanto nada foi salvo (`setup`, para o
    que o primeiro setup oferece uma vez só), ou só depois que algo foi salvo (`panel`).'
form.yml/FileUploadSection.button:
  en-us: The button that opens the section, Edit when left out.
  pt-br: O botão que abre a seção; Editar quando omitido.
form.yml/FileUploadSection.modal:
  en-us: The modal the image is uploaded on.
  pt-br: O modal onde a imagem é enviada.
form.yml/FileUploadSection.validation:
  en-us: Runs a registered validator over the uploaded file's size, pixels and type before
    Keiko keeps it, and refuses the file it rejects.
  pt-br: Passa o arquivo enviado por um validador registrado, que confere o tamanho, os pixels
    e o tipo antes de o Keiko guardá-lo, e recusa o arquivo que ele rejeitar.
form.yml/ChannelSelectSection:
  en-us: One channel chosen on a native select.
  pt-br: Um canal escolhido num select nativo.
form.yml/ChannelSelectSection.type:
  en-us: Draws one channel picked on a native select.
  pt-br: Desenha um canal escolhido num select nativo.
form.yml/ChannelSelectSection.key:
  en-us: The section's id, unique in its card, named by groups and edits.
  pt-br: O id da seção, único no card, citado por grupos e edições.
form.yml/ChannelSelectSection.emoji:
  en-us: Leads the section's heading and lines.
  pt-br: Vem antes do título e das linhas da seção.
form.yml/ChannelSelectSection.label:
  en-us: The section's heading on the card.
  pt-br: O título da seção no card.
form.yml/ChannelSelectSection.description:
  en-us: Lines under the heading while the card is edited.
  pt-br: Linhas abaixo do título enquanto o card é editado.
form.yml/ChannelSelectSection.keys:
  en-us: The state keys the section writes.
  pt-br: As chaves de estado que a seção grava.
form.yml/ChannelSelectSection.image:
  en-us: Draws the picture held by that state key or lookup answer under the section's lines.
  pt-br: Desenha, abaixo das linhas da seção, a imagem guardada nessa chave de estado ou resposta
    de busca.
form.yml/ChannelSelectSection.when:
  en-us: Shows the section only while the rule over the card's state holds; a hidden section
    is never required.
  pt-br: Só mostra a seção enquanto a regra sobre o estado do card vale; uma seção escondida
    nunca é obrigatória.
form.yml/ChannelSelectSection.appears_in:
  en-us: 'Where the card draws the section: always, only while nothing is saved (`setup`,
    for what a first setup offers once), or only once something is (`panel`).'
  pt-br: 'Onde o card desenha a seção: sempre, só enquanto nada foi salvo (`setup`, para o
    que o primeiro setup oferece uma vez só), ou só depois que algo foi salvo (`panel`).'
form.yml/ChannelSelectSection.screen:
  en-us: The title and the intro of the section's own screen; its label and no intro when
    left out.
  pt-br: O título e a introdução da tela própria da seção; o rótulo dela e nenhuma introdução
    quando omitido.
form.yml/UserSelectSection:
  en-us: One member chosen on a native member select, the member's picture under it.
  pt-br: Um membro escolhido num select nativo de membros, com a foto dele embaixo.
form.yml/UserSelectSection.type:
  en-us: Draws one member picked on a native member select.
  pt-br: Desenha um membro escolhido num select nativo de membros.

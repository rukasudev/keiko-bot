# Every past bug the suite pins: one entry per "Broke as" docstring found on
# the day it was recorded. `test` is the test that pins it now (`path::name`,
# `path::Class::name`, or `path` when the module docstring tells the bug). A
# rebuild that moves or merges a test points the entry at its new home; an
# entry is never deleted. `python -m scripts.keiko testguard ledger` fails
# when an entry names a test that does not exist.
entries:
- id: pb-001
  test: tests/behavioral/contracts/test_a_typed_answer_fills_only_its_own_variables.py::test_an_account_fill_writes_each_variable_once
  guarantee: each variable is filled once and what was put in stays as typed.
  broke: a card's `fills` wrote each variable one after another, so an account typed as `{stream_link}`
    was read again and both slots showed the link (the Twitch and YouTube account inputs).
- id: pb-002
  test: tests/behavioral/contracts/test_analytics_catalog.py::test_the_catalog_file_is_read_through_its_schema
  guarantee: every field the file writes is one the schema declares, and the readers hand
    out the typed declarations.
  broke: the catalog was read as a plain dict, so a misspelled `lifetim:` or a field nothing
    reads (`cardinality_risk`, `results`) sat in the file without a trace.
- id: pb-003
  test: tests/behavioral/contracts/test_analytics_catalog.py::test_the_root_refuses_a_vocabulary_no_event_reads
  guarantee: the root holds only what a reader reads.
  broke: '`results` listed three values for a `result` prop no event declares, so every `result`
    was dropped anyway.'

  tree.addEventListener('keydown', e => {
    const rows = [...tree.querySelectorAll('.C-row')];
    const i = rows.findIndex(r => r.dataset.id === st.sel);
    const refocus = () => { const s = tree.querySelector('.C-row.sel'); if (s) { s.focus({ preventScroll: true }); toSel('nearest'); } };
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const r = rows[Math.min(rows.length - 1, Math.max(0, i + (e.key === 'ArrowDown' ? 1 : -1)))]; if (r) { st.sel = r.dataset.id; draw(); detail(); refocus(); } }
    if (e.key === 'ArrowRight' && i >= 0) { e.preventDefault(); st.open.add(st.sel); draw(); refocus(); }
    if (e.key === 'ArrowLeft' && i >= 0) { e.preventDefault(); st.open.delete(st.sel); draw(); refocus(); }
    if (e.key === 'Enter' && i >= 0) { e.preventDefault(); toRef(st.sel); }
  });
  el.querySelector('#C-detail').addEventListener('click', e => {
    const r = e.target.closest('[data-ref]'); if (r) { toRef(r.dataset.ref); return; }
    const b = e.target.closest('[data-sel]'); if (!b) return;
    reveal(st, b.dataset.sel); draw(); detail(); toSel('nearest');
  });
  el.querySelector('#C-exp').addEventListener('click', () => { IX().all.forEach(ch => { const n = ch[ch.length - 1]; if (ch.length < 8 && hasKids(n)) st.open.add(nodeId(n)); }); st.open.add('#'); draw(); });
  el.querySelector('#C-col').addEventListener('click', () => { st.open = new Set(['#']); st.sel = '#'; draw(); detail(); });
  el.querySelector('.C-roles').addEventListener('click', e => {
    const b = e.target.closest('[data-role]'); if (!b) return;
    const r = b.dataset.role;
    if (!r) st.roles.clear(); else if (st.roles.has(r)) st.roles.delete(r); else st.roles.add(r);
    C(el);
  });
  el.querySelector('#C-q').addEventListener('input', e => { st.q = e.target.value; search(el, st); });
  el.querySelector('#C-res').addEventListener('click', e => { const b = e.target.closest('[data-sel]'); if (!b) return; reveal(st, b.dataset.sel); draw(); detail(); toSel('center'); });
}
function search(el, st) {
  const box = el.querySelector('#C-res');
  const terms = st.q.trim().toLowerCase().split(/\s+/).filter(x => x.length > 1);
  if (!terms.length) { box.hidden = true; return; }
  const hits = IX().all.filter(ch => { const n = ch[ch.length - 1]; if (n.k === 'rec') return false; const p = pathText(n.path).toLowerCase(); return terms.every(x => p.includes(x)); });
  box.hidden = false;
  const rx = new RegExp(terms.map(x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'gi');
  box.innerHTML = `<p class="note" style="margin:2px 8px 6px">${esc(u('results', { n: hits.length }))}</p>` + hits.slice(0, 80).map(ch => {
    const n = ch[ch.length - 1];
    return `<button data-sel="${esc(nodeId(n))}">${esc(pathText(n.path)).replace(rx, m => `<mark>${m}</mark>`)}</button>`;
  }).join('');
}
function treeRows(n, d, st) {
  const id = nodeId(n);
  const has = hasKids(n);
  const open = st.open.has(id);
  const dim = st.roles.size && n.k === 'f' && !st.roles.has(roleOf(n.f));
  let lab;
  if (n.k === 'root') lab = `<code class="C-k">${esc(CT().name)}</code>${typeChip(rootMark(CT().root))}<span class="C-ty">${label(CT().root, null, true)}</span>`;
  else if (n.k === 'm') lab = `<code class="C-k mem">${esc(nodeName(n))}</code><span class="C-ty">${n.key ? esc(n.model) : ''}</span>`;
  else if (n.k === 'rec') lab = `<code class="C-k rec">↻ ${esc(u('recNode', { n: n.name }))}</code>`;
  else lab = `<code class="C-k">${esc(n.f.s)}</code>${n.f.q ? `<span class="C-req" title="${esc(u('required'))}">*</span>` : ''}${typeChip(n.f.mk)}<span class="C-ty">${label(n.f.t, null, true)}</span>`;
  const role = n.k === 'f' ? roleOf(n.f) : 'none';
  let html = `<div class="C-row role-${role}${st.sel === id ? ' sel' : ''}${dim ? ' dim' : ''}" style="--d:${d}" data-id="${esc(id)}" data-kids="${has ? 1 : 0}"${n.k === 'rec' ? ` data-rec="${esc(canonId(n.name) || '#')}"` : ''} role="treeitem"${has ? ` aria-expanded="${open}"` : ''} aria-selected="${st.sel === id}" tabindex="${st.sel === id ? 0 : -1}">
    <button class="C-car${has ? '' : ' leaf'}" aria-expanded="${open}" tabindex="-1" aria-label="${esc(nodeName(n))}">▶</button>${n.k === 'f' ? '<span class="C-dot"></span>' : ''}${lab}</div>`;
  if (has && open) html += kids(n).map(c => treeRows(c, d + 1, st)).join('');
  return html;
}
function kidsBlock(fields, base) {
  const counts = {};
  fields.forEach(f => { counts[roleOf(f)] = (counts[roleOf(f)] || 0) + 1; });
  const order = GROUPS.filter(r => counts[r]);
  const bar = order.map(r => `<span class="role-${r}" style="flex:${counts[r]}" title="${esc(roleName(r))}: ${counts[r]}"></span>`).join('');
  const groups = order.map(r => `<div class="C-kg role-${r}"><span>${esc(roleName(r))} · ${counts[r]}</span><div>${fields.filter(f => roleOf(f) === r).map(f => `<button class="C-kb${f.q ? ' q' : ''}" data-sel="${esc(base.concat(f.s).join('/'))}" title="${esc(said(f.d))}">${esc(f.n)}</button>`).join('')}</div></div>`).join('');
  return `<div class="C-sec"><h4>${esc(u('kids', { n: fields.length }))}</h4><div class="C-bar">${bar}</div><div class="C-kids">${groups}</div></div>`;
}
function exampleBlock(x) {
  if (!x) return `<p class="note">${esc(u('notUsed'))}</p>`;
  return `<pre class="code-snip">${esc(x.c)}</pre><p class="src">${esc(x.f)}:${x.l}</p>`;
}
function kindChips(to, path) {
  const items = to.k === 'kinds' ? uni(to.n).m.map(m => [m.tag, path.concat(`${uni(to.n).key}=${m.tag}`)]) : to.m.map(m => [m, path.concat('@' + m)]);
  const title = to.k === 'kinds' ? u('kindsInside', { n: items.length }) : u('shapesInside', { n: items.length });
  return `<div class="C-sec"><h4>${esc(title)}</h4><div class="C-chips">${items.map(([v, p]) => `<button class="C-kb role-none" data-sel="${esc(p.join('/'))}">${esc(v)}</button>`).join('')}</div></div>`;
}
function detailC(st) {
  const t = CT(), ix = IX();
  const chain = ix.byId[st.sel] || [ix.root];
  const n = chain[chain.length - 1];
  const crumbs = `<div class="crumb">` + chain.map((c, i) =>
    (i ? '<span class="x">›</span>' : '') + `<button class="s${c.k === 'm' ? ' k' : ''}${i === chain.length - 1 ? ' f' : ''}" data-sel="${esc(nodeId(c))}">${esc(nodeName(c))}</button>`).join('') + `</div>`;
  const ref = n.k === 'rec' ? '' : `<div class="C-sec" style="margin-top:14px"><button class="btn" data-ref="${esc(nodeId(n))}">${REF_ICON}${esc(u('openInRef'))}</button></div>`;
  let head = '', body = '', inside = null;
  if (n.k === 'root') {
    head = `<h3>${esc(t.name)}</h3><div class="C-chips">${typeChip(rootMark(t.root))}<span class="tl">${label(t.root)}</span></div><p class="d">${desc(t.purpose)}</p>`;
    body = `<div class="C-sec"><p class="src" style="margin:0">${esc(t.glob)} · ${esc(files(t.files.length))}</p></div>`;
    if (t.to && t.to.k === 'model') inside = { fields: obj(t.to.n).f, base: [] };
    else if (t.to) body += kindChips(t.to, []);
  } else if (n.k === 'm') {
    const o = obj(n.model);
    head = `<h3 class="mem">${esc(nodeName(n))}</h3><div class="C-chips">${typeChip('object')}<span class="tl">${esc(n.model)}</span></div><p class="d">${desc(o.d)}</p>`;
    const note = n.union ? u('unionOf', { n: uni(n.union).m.length, u: n.union, k: n.key }) : u('shapeUnion', { n: n.shapes.m.length });
    body = `<div class="C-sec"><p class="note" style="margin:0">${esc(note)}</p></div>`;
    if (n.mem) body += `<div class="C-sec"><h4>${esc(u('example'))}</h4>${exampleBlock(n.mem.x)}</div>`;
    inside = { fields: o.f, base: n.path };
  } else if (n.k === 'rec') {
    head = `<h3>↻ ${esc(n.name)}</h3><p class="d">${esc(u('sameAs', { n: n.name }))}</p>`;
    const target = canonId(n.name);
    if (target) body = `<div class="C-sec"><button class="btn" data-sel="${esc(target)}">${esc(u('goTo', { n: n.name }))}</button></div>`;
  } else {
    const f = n.f, to = f.to;
    head = `<h3>${esc(f.n)}</h3><div class="C-chips">${roleChip(roleOf(f))}${typeChip(f.mk)}${f.q ? reqChip() : optChip()}${isShared(n.owner, f.n) ? sharedChip() : ''}</div><p class="d">${desc(f.d) || `<span class="missing">${esc(u('noDesc'))}</span>`}</p>`;
    const kv = [[u('type'), `<span class="tl">${label(f.t)}</span>`], [u('path'), `<code class="ic">${esc(pathText(n.path))}</code>`]];
    if (f.df !== undefined) kv.push([u('default'), `<code class="ic">${esc(f.df)}</code>`]);
    const rules = rulesOf(f);
    if (rules.length) kv.push([u('rules'), rules.join(', ')]);
    if (f.mk === 'map') {
      const child = f.t.k === 'open' ? (f.t.c || [{ k: 'any' }])[0] : f.t;
      kv.push([u('openKeys'), esc(u('youChoose')) + (f.o || []).map(c => `<br><code class="ic">${esc(c)}</code>`).join('')], [u('eachValue'), `<span class="tl">${label(child)}</span>`]);
    }
    if (f.ex) kv.push([u('values'), f.ex.map(v => `<code class="ic">${esc(v)}</code>`).join(' ')]);
    if (f.u) kv.push([u('usedBy'), esc(u(f.u[1] === 1 ? 'usedOne' : 'usedCount', { u: f.u[0], f: f.u[1] }))]);
    kv.push([u('role'), esc(L(ROLE_TXT[roleOf(f)][1]))]);
    body = `<div class="C-sec"><dl class="C-kv">${kv.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${b}</dd>`).join('')}</dl></div>`;
    const fresh = to && !n.anc.has(to.n);
    if (fresh && to.k === 'model') {
      const wrap = f.t.k === 'list' ? u('each') + ': ' : f.t.k === 'open' ? u('mapOf') + ': ' : '';
      body += `<div class="C-sec"><h4>${esc(wrap + to.n)}</h4><p class="d" style="margin:0">${desc(obj(to.n).d)}</p></div>`;
      inside = { fields: obj(to.n).f, base: n.path };
    }
    body += `<div class="C-sec"><h4>${esc(u('example'))}</h4>${exampleBlock(f.x)}</div>`;
    if (fresh && to.k !== 'model') body += kindChips(to, n.path);
  }
  if (inside) body += kidsBlock(inside.fields, inside.base);
  return crumbs + head + ref + body;
}

const first = parseHash();
apply(first);
if (first.at && S.type) focusAt = openAt(first.at);
render();
})();
</script>

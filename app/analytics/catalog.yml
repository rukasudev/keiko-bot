# Product analytics catalog — the single source of truth for what Keiko records.
#
# `record()` refuses any event name that is not declared here, and
# tests/behavioral/contracts/test_analytics_catalog.py fails the build when the
# code and this file disagree. Reference: docs/analytics.md
#
# collection: changes      -> events.changes, written at once, kept
#             activity     -> events.activity, written in the sink's batch, 90 days
#             interactions -> events.interactions, written in the sink's batch, 90 days
#             none         -> no document; the sink still counts it
# actor:      user | bot | job (the kind of actor.id)
# private:    props kept in the database and left out of the monthly archive

sources:
  - slash
  - greeting_button
  - setup_dashboard
  - help_button
  - manager
  - context_menu
  - webhook
  - job
  - internal

results:
  - success
  - failure
  - abandoned

events:
  command.invoked:
    version: 1
    collection: interactions
    description: An application command reached the bot.
    emitted_at: app/cogs/events.py — Events.on_interaction
    actor: user
    required: [command, source]
    optional: [is_admin]
    cardinality_risk: low

  command.failed:
    version: 1
    collection: interactions
    description: A command raised an error that reached the error handler.
    emitted_at: app/cogs/errors.py — Errors.on_app_command_error
    actor: user
    required: [command, error_type]
    optional: [step_key]
    cardinality_risk: low

  feature.setup_opened:
    version: 1
    collection: interactions
    description: The first-time configuration form was opened for a feature.
    emitted_at: app/settings/discord/observability.py — emit, from Decision.analytics (feature.setup_opened)
    actor: user
    required: [source]
    optional: [is_admin]
    cardinality_risk: low

  feature.manager_opened:
    version: 1
    collection: interactions
    description: The manager panel of an already configured feature was opened.
    emitted_at: app/settings/discord/observability.py — emit, from Decision.analytics (feature.manager_opened)
    actor: user
    required: [source]
    optional: [enabled, is_admin]
    cardinality_risk: low

  setup.step_viewed:
    version: 1
    collection: interactions
    description: A form step was rendered to the user.
    emitted_at: app/settings/discord/observability.py — emit, from Decision.analytics (Engine.show)
    actor: user
    required: [step_key, step_action, step_index]
    optional: [ms_since_prev]
    cardinality_risk: low

  setup.step_completed:
    version: 1
    collection: interactions
    description: A step left the screen, with how long it was on it.
    emitted_at: app/settings/discord/observability.py — emit, from Decision.analytics (Engine.show)
    actor: user
    required: [step_key, step_action]
    optional: [ms_on_step, choice]
    cardinality_risk: low

  setup.step_back:
    version: 1
    collection: interactions
    description: The user navigated back to the previous step.
    emitted_at: app/settings/discord/observability.py — emit, from Decision.analytics (_on_back)
    actor: user
    required: [step_key]
    optional: []
    cardinality_risk: low

  setup.validation_failed:
    version: 1
    collection: interactions
    description: A YAML validator refused the value submitted in a modal.
    emitted_at: app/settings/discord/observability.py — emit, from Decision.analytics (Engine.refuse)
    actor: user
    required: [step_key, validation, error_key]
    optional: [attempt_n]
    cardinality_risk: low

  setup.required_missing:
    version: 1
    collection: interactions
    description: The configuration card was confirmed with required fields empty.
    emitted_at: app/settings/discord/observability.py — emit, from Decision.analytics (Engine.refuse, card done)
    actor: user
    required: [card_key, missing_count]
    optional: [missing_keys]
    cardinality_risk: low

  setup.completed:
    version: 1
    collection: interactions
    description: A configuration form was finished and persisted.
    emitted_at: app/settings/discord/observability.py — emit, from Decision.analytics (_on_commit_succeeded)
    actor: user
    required: [source, duration_ms, steps_viewed]
    optional: [validation_failures, back_count, duration_bucket, configured_steps, item_count]
    cardinality_risk: low

  feature.commit_failed:
    version: 1
    collection: interactions
    description: A feature's commit raised before finishing and the session closed as a failure (the error, or the duplicate copy when the commit ended the session). A refused change that keeps the session open, or that closes it after another panel's Disable, is not one and emits nothing.
    emitted_at: app/settings/form/form.py — engine.emit, from Decision.analytics (on_commit_failed)
    actor: user
    required: [commit_kind, error_type]
    optional: [step_key]
    cardinality_risk: low

  setup.discarded:
    version: 1
    collection: interactions
    description: The user explicitly discarded a configuration in progress.
    emitted_at: app/settings/discord/observability.py — emit, from Decision.analytics (_on_discard_confirmed)
    actor: user
    required: []
    optional:
      - step_key
      - steps_viewed
      - validation_failures
      - back_count
      - duration_ms
      - duration_bucket
    cardinality_risk: low

  setup.abandoned:
    version: 1
    collection: interactions
    description: The view timed out with the configuration unfinished.
    emitted_at: app/settings/discord/observability.py — emit, from Decision.analytics (_on_expired)
    actor: user
    required: []
    optional:
      - step_key
      - steps_viewed
      - validation_failures
      - back_count
      - duration_ms
      - duration_bucket
    cardinality_risk: low

  setup.discard_recovered:
    version: 1
    collection: interactions
    description: The user opened the discard prompt and chose to keep the setup.
    emitted_at: app/settings/discord/observability.py — emit, from Decision.analytics (_on_keep_editing)
    actor: user
    required: []
    optional:
      - step_key
      - steps_viewed
      - validation_failures
      - back_count
      - duration_ms
      - duration_bucket
    cardinality_risk: low

  config.changed:
    version: 1
    collection: changes
    description: An existing configuration was edited through the manager, or a server setting on the /setup settings screen (feature `settings`).
    emitted_at: app/settings/features/feature.py — GenericCogFeature.commit (edit, toggle, edit_item); app/services/setup.py — change_setting, for a server setting
    actor: user
    required: [source]
    optional: [changed_keys, changed_count]
    cardinality_risk: low

  feature.enabled:
    version: 1
    collection: changes
    description: A feature became active for a guild.
    emitted_at: app/settings/features/feature.py — GenericCogFeature.commit (setup)
    actor: user
    required: [source]
    optional: []
    cardinality_risk: low

  feature.paused:
    version: 1
    collection: changes
    description: A feature was paused from the manager.
    emitted_at: app/settings/features/feature.py — GenericCogFeature.commit (pause); app/core/servers.py — pause_features, as the bot, when Keiko leaves a server
    actor: user
    required: [source]
    optional: [days_since_enabled, value_events_since_enabled]
    cardinality_risk: low

  feature.unpaused:
    version: 1
    collection: changes
    description: A paused feature was resumed.
    emitted_at: app/settings/features/feature.py — GenericCogFeature.commit (unpause)
    actor: user
    required: [source]
    optional: [days_since_enabled]
    cardinality_risk: low

  feature.disabled:
    version: 1
    collection: changes
    description: A feature was turned off and its configuration removed.
    emitted_at: app/settings/features/feature.py — GenericCogFeature.commit (disable)
    actor: user
    required: [source]
    optional: [days_since_enabled, value_events_since_enabled]
    cardinality_risk: low

  feature.item_added:
    version: 1
    collection: changes
    description: An item was added to a composition-based feature.
    emitted_at: app/settings/features/feature.py — GenericCogFeature.commit (add_item)
    actor: user
    required: [source]
    optional: [item_count]
    cardinality_risk: low

  feature.item_removed:
    version: 1
    collection: changes
    description: An item was removed from a composition-based feature.
    emitted_at: app/settings/features/feature.py — GenericCogFeature.commit (remove_item)
    actor: user
    required: [source]
    optional: [item_count]
    cardinality_risk: low

  value.delivered:
    version: 1
    collection: none
    description: The feature did the thing the user configured it to do.
    emitted_at: the send/assign call site of each feature service
    actor: bot
    required: []
    optional: [outcome]
    cardinality_risk: low

  value.blocked_by_permission:
    version: 1
    collection: activity
    description: Delivery failed because Discord refused the bot's permission.
    emitted_at: the same call sites as value.delivered, failure branch
    actor: bot
    required: [error_type]
    optional: []
    cardinality_risk: low

  link.blocked:
    version: 1
    collection: activity
    description: A link the server's rules refuse was found in a message, deleted or not; the member who sent it is the actor.
    emitted_at: app/services/block_links.py — record_blocked_links
    actor: user
    required: [host, mode, reason, deleted]
    optional: [link, rule, match, channel_id]
    private: [link]
    cardinality_risk: medium

  feature.tested:
    version: 1
    collection: interactions
    description: The user exercised a preview or diagnostic surface.
    emitted_at: the welcome preview aside (app/settings/features/welcome_messages.py) and the block links diagnostic
    actor: user
    required: [surface]
    optional: []
    cardinality_risk: low

  guild.joined:
    version: 1
    collection: changes
    description: The bot was added to a guild.
    emitted_at: app/cogs/events.py — Events.on_guild_join
    actor: bot
    required: [returning]
    optional: [size_bucket, owner_guilds]
    cardinality_risk: low

  guild.removed:
    version: 1
    collection: changes
    description: The bot was removed from a guild, with the frozen guild profile.
    emitted_at: app/cogs/events.py — Events.on_guild_remove
    actor: bot
    required: [days_in_guild]
    optional:
      - features_configured
      - features_active
      - days_since_last_value
      - setups_completed
      - setups_discarded
      - value_events
      - permission_failures
      - distinct_admins
      - greeting_sent
      - first_feature
    cardinality_risk: low

  guild.greeting_sent:
    version: 1
    collection: activity
    description: The onboarding greeting was posted (or could not be posted).
    emitted_at: app/views/greetings.py — GreetingsView.send
    actor: bot
    required: [features_offered, channel_found]
    optional: []
    cardinality_risk: low

  help.opened:
    version: 1
    collection: interactions
    description: The /help command was opened.
    emitted_at: app/services/help.py — send_help, from /help and the Commands buttons of /setup and the greeting
    actor: user
    required: [source]
    optional: []
    cardinality_risk: low

  dashboard.opened:
    version: 1
    collection: interactions
    description: The /setup dashboard was opened.
    emitted_at: app/services/setup.py — open_setup_dashboard, from /setup, the greeting's Setup button and the /help Setup button
    actor: user
    required: [source]
    optional: []
    cardinality_risk: low

  report.submitted:
    version: 1
    collection: interactions
    description: A user sent feedback through /report.
    emitted_at: app/cogs/base/report.py — Report.report
    actor: user
    required: []
    optional: [command]
    cardinality_risk: low

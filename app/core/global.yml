# open: fact names -> a fact
facts:
  above_keiko:
    type: boolean
    description: Whether a role a warning names sits above Keiko's highest role, which the admin fixes by dragging Keiko's role above it.
  channel:
    type: text
    description: A channel a line names, as its mention.
  collections:
    type: number
    description: How many collections a database backup holds.
  command_name:
    type: text
    description: The slash command of a feature a line names, in the reader's language, without its `/`.
  count:
    type: number
    description: How many things a line counts, written as the code formats the number.
  date:
    type: text
    description: A date or a moment, already formatted for the reader.
  day:
    type: number
    description: The day of the month a date label writes.
  day_padded:
    type: text
    description: The day of the month a numeric date writes, in two digits.
  days:
    type: number
    description: How many days back a recent-activity line looks.
  documents:
    type: number
    description: How many documents a database backup holds.
  duration:
    type: text
    description: How long a live lasted, formatted for the reader.
  emoji:
    type: text
    description: The emoji of the parent group a line or a title names, as /setup shows it beside the group.
  feature:
    type: text
    description: The name of the feature a list's last-item warning turns off, the intro's title without its emoji.
  feature_state:
    type: enum
    values: [not_configured, paused, active]
    description: Whether a feature is set up in the server, and whether it is on.
  fields:
    type: text
    description: The settings a form still needs before it can be saved, joined in one line.
  files:
    type: number
    description: How many files an upload was split into.
  item:
    type: text
    description: The item a list screen names, as the panel draws it, on the search's screen and in the last-item warning.
  items:
    type: text
    description: The items a removal question names, one bullet each.
  live_status:
    type: enum
    values: [online, offline]
    description: Whether the live a notice announces is on or over.
  max:
    type: number
    description: The most items a list holds, for the count beside its title.
  month:
    type: text
    description: The month an archive covers, as its label.
  month_lower:
    type: text
    description: The name of a month in lower case, for a Portuguese date label.
  month_name:
    type: text
    description: The name of a month, for an English date label.
  month_padded:
    type: text
    description: The month a numeric date writes, in two digits.
  name:
    type: text
    description: The name a line or a title names, of a command or of a parent group, in the reader's language.
  permission:
    type: text
    description: The name of a Discord permission Keiko is missing.
  prefix:
    type: text
    description: The server's chat prefix.
  removing:
    type: enum
    values: [one, many, last]
    description: What a removal question removes, one item, several items, or the last item of a list that needs one.
  role:
    type: text
    description: The id of a role a permission line mentions.
  roles:
    type: text
    description: The roles a line names, joined in one line.
  skipped_collections:
    type: text
    description: The collections a database backup left out for their size, each in backticks, joined in one line.
  span_amount_max:
    type: number
    description: The largest number a time span may be typed as.
  span_amount_min:
    type: number
    description: The smallest number a time span may be typed as.
  span_years_max:
    type: number
    description: The most years a time span may last in all.
  thousands:
    type: text
    description: A count in thousands, for a floor written in Portuguese ("5 mil+").
  user:
    type: text
    description: A member a line names, as a mention.
  warning:
    type: text
    description: A warning already filled in, the one a list writes before its last item goes or the lines a card's warning embed tells about the roles just picked.
  year:
    type: number
    description: The year a full date label writes.

# open: context names -> a context value
context:
  commands:
    type: text
    each: command
    public: true
    description: The slash command of each command, in the reader's language and with its `/` (`/setup`, `/configurar`), read from the command's own `slash` copy.
  groups:
    type: text
    each: group
    public: true
    description: The slash name of each parent group, in the reader's language and with its `/` (`/moderations`), read from `texts.groups`.
  server_name:
    type: text
    public: true
    description: The name of the server a form runs in, read from the guild Discord sent.
  prefix:
    type: text
    public: true
    description: The server's chat prefix, read once per opened feature from the server's settings.
  server_language:
    type: text
    public: false
    description: The server's language (`pt-br` or `en-us`), read once per opened feature from the server's settings.
  server_timezone:
    type: text
    public: false
    description: The server's time zone, an IANA zone, read once per opened feature from the server's settings.
  command:
    type: text
    public: true
    description: The slash command of the feature a form sets up, in the server's language and without its `/`.
  members_count:
    type: text
    public: false
    description: How many members the server has, bots left out, as the feature that opened the form counted them.
  bots_count:
    type: text
    public: false
    description: How many bots the server has, as the feature that opened the form counted them.

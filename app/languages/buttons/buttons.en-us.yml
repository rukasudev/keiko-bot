  roles-sync:
    label: Sync
    desc: Keiko immediately assigns the default roles to all server users
    confirm:
      title: "🔄 Sync roles?"
      message: "I'll sync the default roles now for **every member and bot** already in the server, not only for whoever joins from now on. When I'm done, everyone will have these roles:\n\n👥 Members: $members\n🤖 Bots: $bots\n\nThis may take a few minutes. Do you want to continue?"
      footer: "Use the `/report` command to tell me a bug"
    waiting:
      title: 🔄 Syncing roles...
      message: I'm assigning the default roles to all members of the server! This may take a few minutes...
      footer: "Use the `/report` command to tell me a bug"
    response:
      title: "✨ Roles synced successfully!"
      message: "Done! I gave the default roles to everyone who was already in the server. Now everyone is even cuter! 🐶\n\n👥 Members: **$members**\n🤖 Bots: **$bots**"
      footer: "Use the `/report` command to tell me a bug"

  captions:
    desc: Here is a brief description of the buttons and their functionalities

  cooldown:
    title: "⏳ One Second!"
    message: "I just answered you! You can ask me again in a moment 🐶"

  changes-history:
    label: 📜 Changes history
    desc: "See the history of changes made to the feature **$cog_key**:"

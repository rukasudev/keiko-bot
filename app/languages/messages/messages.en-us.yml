en-us:
  admin-logs:
    daily-export: ":card_index_dividers: Here is my structured log for **{date}**! ({count} records)"
    daily-backup: ":floppy_disk: Here is my encrypted database backup for **{date}**! ({collections} collections, {documents} documents)"
    daily-backup-skipped: "I'm sorry, but these were too big for this channel even on their own, so I left them out: {collections}. A manual `mongodump` still copies them!"
    monthly-events: ":card_file_box: Here is my events archive for **{month}**! ({count} events)"
    files-parts: "I sent it in {files} files, one per message."

  birthday-defaults:
    title: "🎂 It's {user}'s birthday!"
    content: "Happy birthday {user}! 🎉 Hope your day is full of joy and treats! ✨"

  greetings-message:
    title: "Hello, I'm Keiko, your loyal Discord companion! :dog:"
    message:
      "I'm super excited to make new friends and help make your server even more awesome! :sparkles: Get started by using the `/help` command to find out everything I can do and how to set me up! :gear:\n\n
      Here are some tricks I know how to do:
      \n- **Moderation:** Setting up link blocking, auto-roles, and welcome messages.
      \n- **Notifications:** Twitch live and Youtube alerts.
      \n- **Utility:** Message translation to any language.
      \n- **Base:** Support, report, and quick help.\n\n
      You can also use the buttons below to quickly set up a feature, or use `/setup` at any time to see and manage all of them! :rocket:\n\n
      All of this and much more you can manage easily through Discord buttons, editing, pausing, or disabling features whenever you want :pencil:\n\n
      If you need *help*, just call me using `/support` :heart:"

  prefix-hint:
    guild: "🐾 Woof! Looking for one of my **$prefix** commands? They're not turned on in this server yet.\n\nAsk a moderator to set one up in `/setup` or with its own command:\n$commands\n\nMy other commands start with `/`! Try `/help` to see everything I can do :heart:"
    feature: "- `/$command`"
    direct: "🇺🇸 Woof! I don't answer prefix commands here in DMs. My commands start with `/`! Try `/help` to see everything I can do."

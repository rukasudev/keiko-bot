pt-br:
  admin-logs:
    daily-export: ":card_index_dividers: Aqui está o meu log estruturado de: **{date}**! ({count} registros)"

  birthday-defaults:
    title: "🎂 É aniversário do {user}!"
    content: "Feliz aniversário, {user}! 🎉 Que seu dia seja cheio de alegria e mimos! ✨"

  greetings-message:
    title: "Olá, eu sou o Keiko, o seu leal companheiro do Discord! :dog:"
    message:
      "Estou super animado para fazer novos amigos e ajudar a tornar o seu servidor ainda mais incrível! :sparkles: Comece utilizando o comando `/ajuda` para descobrir tudo o que posso fazer e como me configurar! :gear:\n\n
      Aqui estão alguns truques que eu sei fazer:
      \n- **Moderação:** Configuração de bloqueio de links, autocargos e mensagens de boas-vindas.
      \n- **Notificações:** Avisos de lives na Twitch e videos do Youtube.
      \n- **Utilitário:** Tradução de mensagens para qualquer idioma.
      \n- **Base:** Suporte, report e ajuda rápida.\n\n
      Você também pode usar os botões abaixo para configurar rapidamente uma funcionalidade, ou use `/configurar` a qualquer momento para ver e gerenciar todas elas! :rocket:\n\n
      Tudo isso e muito mais você pode gerenciar de forma fácil através dos botões do Discord, editando, pausando ou desabilitando funcionalidades quando quiser :pencil:\n\n
      Se precisar de *aujuda*, é só chamar utilizando `/suporte` :heart:"

  prefix-hint:
    guild: "🐾 Au au! Procurando um dos meus comandos com **$prefix**? Eles ainda não estão ativados neste servidor.\n\nPeça para um moderador configurar um deles no `/configurar` ou pelo próprio comando:\n$commands\n\nOs meus outros comandos começam com `/`! Experimente `/ajuda` para ver tudo o que eu sei fazer :heart:"
    feature: "- `/$command`"
    direct: "🇧🇷 Au au! Aqui no privado eu não respondo comandos com prefixo. Os meus comandos começam com `/`! Experimente `/ajuda` para ver tudo o que eu sei fazer."

pt-br:
  admin-logs:
    daily-export: ":card_index_dividers: Aqui está o meu log estruturado de **{date}**! ({count} registros)"
    daily-backup: ":floppy_disk: Aqui está o meu backup criptografado do banco de dados de **{date}**! ({collections} coleções, {documents} documentos)"
    daily-backup-skipped: "Desculpe, mas estas ficaram grandes demais para este canal, mesmo sozinhas, então deixei de fora: {collections}. Um `mongodump` manual ainda copia essas coleções!"
    monthly-events: ":card_file_box: Aqui está o meu arquivo de eventos de **{month}**! ({count} eventos)"
    files-parts: "Enviei em {files} arquivos, um por mensagem."

  birthday-defaults:
    title: "🎂 É aniversário do {user}!"
    content: "Feliz aniversário, {user}! 🎉 Que seu dia seja cheio de alegria e mimos! ✨"

  greetings-message:
    title: "Olá, eu sou o Keiko, o seu leal companheiro do Discord! :dog:"
    message: "Estou super animado para fazer novos amigos e ajudar a deixar o seu servidor ainda mais incrível! ✨\n\nAqui estão alguns truques que eu sei fazer:\n🛡️ **Moderação:** Bloquear Links, Cargos Padrão, Mensagens de Boas-Vindas e Lembretes de Aniversário.\n🔔 **Notificações:** Avisos de lives na Twitch e de vídeos novos no YouTube.\n🎮 **Integrações:** Respostas aos comandos do StreamElements aqui no chat.\n🌐 **Utilitário:** Tradução de mensagens para qualquer idioma.\n🧰 **Base:** Suporte, report e ajuda rápida.\n\nVocê pode usar o botão **Configurar** abaixo para começar 🚀 ou rodar `/configurar` a qualquer momento para ver e gerenciar todas as minhas funcionalidades!\n\nTudo isso você gerencia de um jeito fácil pelos botões do Discord, editando, pausando ou desativando o que quiser ✏️\n\nPara ver todos os meus comandos, toque em **Comandos**. E se precisar de *aujuda*, é só chamar com `/suporte` ❤️"

  prefix-hint:
    guild: "🐾 Au au! Procurando um dos meus comandos com **$prefix**? Eles ainda não estão ativados neste servidor.\n\nPeça para um moderador configurar um deles no `/configurar` ou pelo próprio comando:\n$commands\n\nOs meus outros comandos começam com `/`! Experimente `/ajuda` para ver tudo o que eu sei fazer :heart:"
    feature: "- `/$command`"
    direct: "🇧🇷 Au au! Aqui no privado eu não respondo comandos com prefixo. Os meus comandos começam com `/`! Experimente `/ajuda` para ver tudo o que eu sei fazer."

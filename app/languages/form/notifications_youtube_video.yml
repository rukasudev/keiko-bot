steps:
  - action: form
    key: form
    title:
      en-us: "▶️ YouTube Videos"
      pt-br: "▶️ YouTube Vídeos"
    description:
      en-us: Enabling this feature allows me to notify when your favorite youtuber posts a new video!
      pt-br: Ativar esta função faz com que eu notifique quando seu youtuber favorito postar um novo vídeo!
    manager_description:
      en-us: "I let the server know when these channels post a new video."
      pt-br: "Aviso no servidor quando estes canais postam um vídeo novo."
    footer:
      en-us: "• Use the `/report` command to tell me a bug"
      pt-br: "• Use o comando `/reportar` para me contar um bug"

  - action: composition
    key: notifications
    parent_key: notifications_youtube_video
    max: 2
    edit_by_item: true
    remove_each: true
    required: true
    unique_by: youtuber
    emoji: ":busts_in_silhouette:"
    style: composition
    title:
      en-us: Notifications
      pt-br: Notificações
    only_item_warning:
      en-us: "You only have **1** channel set up.\n\n$item\n\nIf you remove it now, **$feature** will be **turned off** and you'll need to set it up again. Are you sure you want to continue?"
      pt-br: "Você só tem **1** canal configurado.\n\n$item\n\nSe você removê-lo agora, a função **$feature** será **desativada** e você vai precisar configurá-la de novo. Tem certeza de que quer continuar?"
    title_count:
      en-us: "$count of $max set up"
      pt-br: "$count de $max configurados"
    description:
      en-us: "Do you want to add more youtubers? Add more youtubers to be notified when they post a new video! (Max: 2)"
      pt-br: "Deseja adicionar mais youtubers? Adicione mais youtubers para ser notificado quando eles postarem um novo vídeo! (Máx: 2)"
    footer:
      en-us: "• Use the `/report` command to tell me a bug"
      pt-br: "• Use o comando `/reportar` para me contar um bug"
    steps:
      - action: configuration_card
        key: notification
        preview: true
        preview_needs:
          keys:
            - youtuber
          error: preview-needs-youtuber
        required:
          - channel
          - youtuber
        defaults:
          notification_messages:
            en-us: "@everyone! {youtuber} just posted a new video!"
            pt-br: "@everyone! {youtuber} acabou de postar um novo vídeo!"
        title:
          en-us: "YouTube Channel"
          pt-br: "Canal do YouTube"
        description:
          en-us: "Choose the channel and the youtuber, and I'll let the server know when they post a new video! The message already comes set, change it if you want."
          pt-br: "Escolha o canal e o youtuber, e eu aviso no servidor quando ele postar um vídeo novo! A mensagem já vem configurada, mude se quiser."
        footer:
          en-us: "• Use the `/report` command to tell me a bug"
          pt-br: "• Use o comando `/reportar` para me contar um bug"
        header:
          title:
            en-us: "YouTube Channel"
            pt-br: "Canal do YouTube"
          title-emoji: "▶️"
          thumbnail: IMAGE_01
        fields:
          - key: channel
            style: channel
            label:
              en-us: Text Channel
              pt-br: Canal de Texto
            description:
              en-us: Where I'll announce the new video.
              pt-br: Onde vou avisar do vídeo novo.
          - key: youtuber
            label:
              en-us: Youtuber
              pt-br: Youtuber
            description:
              en-us: The YouTube channel name (with or without @).
              pt-br: O nome do canal no YouTube (com ou sem @).
          - key: notification_messages
            style: code-block
            label:
              en-us: Notification Messages
              pt-br: Mensagens de Notificação
            description:
              en-us: Up to three messages, I pick one at random each video.
              pt-br: Até três mensagens, eu sorteio uma a cada vídeo.
        sections:
          - key: channel
            icon: "📺"
            type: channel-select
            style: channel
            label:
              en-us: "Text Channel"
              pt-br: "Canal de Texto"
            state:
              value: channel
            customize-label:
              en-us: "Choose channel"
              pt-br: "Escolher canal"
            picker-title:
              en-us: "Where should I send the notifications?"
              pt-br: "Onde devo enviar as notificações?"
          - key: youtuber
            icon: "🎬"
            type: modal-input
            label:
              en-us: "Youtuber"
              pt-br: "Youtuber"
            state:
              value: youtuber
            media_key: youtuber_avatar
            fills:
              into: notification_messages
              tokens:
                youtuber: "{value}"
            lookup_answers:
              youtuber_avatar: youtube.profile_image
            customize-label:
              en-us: "Choose youtuber"
              pt-br: "Escolher youtuber"
            modal:
              title:
                en-us: "Youtuber"
                pt-br: "Youtuber"
              validation: validate_youtube_channel
              fields:
                - key: youtuber
                  max_length: 30
                  normalize: handle
                  label:
                    en-us: "The YouTube channel name (with or without @)"
                    pt-br: "O nome do canal no YouTube (com ou sem @)"
                  placeholder:
                    en-us: "e.g. @pewdiepie"
                    pt-br: "ex: @pewdiepie"
          - key: messages
            icon: "💬"
            type: modal-input
            style: code-block
            label:
              en-us: "Notification Messages"
              pt-br: "Mensagens de Notificação"
            description:
              en-us: "One of the messages is picked at random each time. You can use:\n- `{youtuber}`: the youtuber's channel name\n- `{video_link}`: the video link"
              pt-br: "Uma das mensagens é sorteada a cada vez. Você pode usar:\n- `{youtuber}`: o nome do canal do youtuber\n- `{video_link}`: o link do vídeo"
            state:
              value: notification_messages
            customize-label:
              en-us: "Edit messages"
              pt-br: "Editar mensagens"
            modal:
              title:
                en-us: "Notification Messages"
                pt-br: "Mensagens de Notificação"
              fields:
                - max_length: 100
                  multiline: true
                  label:
                    en-us: "Random Message #1"
                    pt-br: "Mensagem Aleatória #1"
                - max_length: 100
                  multiline: true
                  required: false
                  label:
                    en-us: "Random Message #2"
                    pt-br: "Mensagem Aleatória #2"
                - max_length: 100
                  multiline: true
                  required: false
                  label:
                    en-us: "Random Message #3"
                    pt-br: "Mensagem Aleatória #3"

  - action: resume
    key: confirm
    preview: true
    title:
      en-us: "▶️ YouTube Videos"
      pt-br: "▶️ YouTube Vídeos"
    description:
      en-us: "Here's a summary of your choices so far. All set for me to turn on the `/{context:command}` command with the settings below? ✅"
      pt-br: "Esse é o resumo das suas escolhas até aqui. Tudo certo para eu ativar o comando `/{context:command}` com as configurações abaixo? ✅"
    footer:
      en-us: "• Use the `/report` command to tell me a bug"
      pt-br: "• Use o comando `/reportar` para me contar um bug"

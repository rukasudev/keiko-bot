steps:
  - action: form
    key: form
    title:
      en-us: "🔔 Youtube Notifications"
      pt-br: "🔔 Youtube Notificações"
    description:
      en-us: Enabling this feature allows me to notify when your favorite youtuber posts a new video!
      pt-br: Ativar esta função faz com que eu notifique quando seu youtuber favorito postar um novo vídeo!
    manager_description:
      en-us: "I let the server know when these channels post a new video."
      pt-br: "Aviso no servidor quando estes canais postam um vídeo novo."
    footer:
      en-us: "• Use the `/report` command to tell me a bug"
      pt-br: "• Use o comando `/reportar` para me contar um bug"

  - action: composition
    key: notifications
    parent_key: notifications_youtube_video
    max: 2
    edit_by_item: true
    emoji: ":busts_in_silhouette:"
    style: composition
    title:
      en-us: Notifications
      pt-br: Notificações
    description:
      en-us: "Do you want to add more youtubers? Add more youtubers to be notified when they post a new video! (Max: 2)"
      pt-br: "Deseja adicionar mais youtubers? Adicione mais youtubers para ser notificado quando eles postarem um novo vídeo! (Máx: 2)"
    footer:
      en-us: "• Use the `/report` command to tell me a bug"
      pt-br: "• Use o comando `/reportar` para me contar um bug"
    steps:
      - action: configuration_card
        key: notification
        preview: true
        required:
          - channel
          - youtuber
        defaults:
          notification_messages:
            en-us: "@everyone! {youtuber} just posted a new video!"
            pt-br: "@everyone! {youtuber} acabou de postar um novo vídeo!"
        title:
          en-us: "YouTube Channel"
          pt-br: "Canal do YouTube"
        description:
          en-us: "Choose the channel and the youtuber, and I'll let the server know when they post a new video! The message already comes set, change it if you want.\n\nOne of the messages is picked at random each time. You can use:\n- `{youtuber}`: the youtuber's channel name\n- `{video_link}`: the video link"
          pt-br: "Escolha o canal e o youtuber, e eu aviso no servidor quando ele postar um vídeo novo! A mensagem já vem configurada, mude se quiser.\n\nUma das mensagens é sorteada a cada vez. Você pode usar:\n- `{youtuber}`: o nome do canal do youtuber\n- `{video_link}`: o link do vídeo"
        footer:
          en-us: "• Use the `/report` command to tell me a bug"
          pt-br: "• Use o comando `/reportar` para me contar um bug"
        header:
          title:
            en-us: "YouTube Channel"
            pt-br: "Canal do YouTube"
          title-emoji: "▶️"
          thumbnail_key: youtuber_avatar
        fields:
          - key: channel
            style: channel
            label:
              en-us: Text Channel
              pt-br: Canal de Texto
            description:
              en-us: Where I'll announce the new video.
              pt-br: Onde vou avisar do vídeo novo.
          - key: youtuber
            label:
              en-us: Youtuber
              pt-br: Youtuber
            description:
              en-us: The channel's name on YouTube, with or without the @.
              pt-br: O nome do canal no YouTube, com ou sem o @.
          - key: notification_messages
            style: bullet
            label:
              en-us: Notification Messages
              pt-br: Mensagens de Notificação
            description:
              en-us: Up to three messages, I pick one at random each video.
              pt-br: Até três mensagens, eu sorteio uma a cada vídeo.
        sections:
          - key: channel
            icon: "📺"
            type: channel-select
            style: channel
            label:
              en-us: "Text Channel"
              pt-br: "Canal de Texto"
            state:
              value: channel
            customize-label:
              en-us: "Choose channel"
              pt-br: "Escolher canal"
            picker-title:
              en-us: "Where should I send the notifications?"
              pt-br: "Onde devo enviar as notificações?"
          - key: youtuber
            icon: "🎬"
            type: modal-input
            label:
              en-us: "Youtuber"
              pt-br: "Youtuber"
            state:
              value: youtuber
            lookup_answers:
              youtuber_avatar: youtube.profile_image
            customize-label:
              en-us: "Choose youtuber"
              pt-br: "Escolher youtuber"
            modal:
              title:
                en-us: "Youtuber"
                pt-br: "Youtuber"
              validation: validate_youtube_channel
              fields:
                - key: youtuber
                  max_length: 30
                  normalize: handle
                  label:
                    en-us: "The channel's @ on YouTube"
                    pt-br: "O @ do canal no YouTube"
                  placeholder:
                    en-us: "e.g. @pewdiepie"
                    pt-br: "ex: @pewdiepie"
          - key: messages
            icon: "💬"
            type: modal-input
            style: bullet
            label:
              en-us: "Notification Messages"
              pt-br: "Mensagens de Notificação"
            state:
              value: notification_messages
            customize-label:
              en-us: "Edit messages"
              pt-br: "Editar mensagens"
            modal:
              title:
                en-us: "Notification Messages"
                pt-br: "Mensagens de Notificação"
              fields:
                - max_length: 100
                  multiline: true
                  label:
                    en-us: "Random Message #1"
                    pt-br: "Mensagem Aleatória #1"
                - max_length: 100
                  multiline: true
                  required: false
                  label:
                    en-us: "Random Message #2"
                    pt-br: "Mensagem Aleatória #2"
                - max_length: 100
                  multiline: true
                  required: false
                  label:
                    en-us: "Random Message #3"
                    pt-br: "Mensagem Aleatória #3"

  - action: resume
    key: confirm
    preview: true
    title:
      en-us: ":white_check_mark: Alright?"
      pt-br: ":white_check_mark: Tudo certo?"
    description:
      en-us: Enabling this feature allows me to notify when your favorite youtuber posts a new video!
      pt-br: Ativar esta função faz com que eu notifique quando seu youtuber favorito postar um novo vídeo!
    footer:
      en-us: "• Use the `/report` command to tell me a bug"
      pt-br: "• Use o comando `/reportar` para me contar um bug"

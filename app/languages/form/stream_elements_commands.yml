steps:
  - action: form
    key: form
    title:
      en-us: ":bulb: StreamElements Commands"
      pt-br: ":bulb: Comandos do StreamElements"
    description:
      en-us: |
        Whenever someone uses a command with the **{context:prefix}** prefix, I'll fetch the response from StreamElements!

        **Example:** `{context:prefix}mouse` -> "The streamer uses a Logitech G Pro!"
      pt-br: |
        Sempre que alguém usar um comando com o prefixo **{context:prefix}**, eu buscarei a resposta no StreamElements!

        **Exemplo:** `{context:prefix}mouse` -> "O streamer usa um Logitech G Pro!"
    manager_description:
      en-us: "I answer this streamer's StreamElements commands here on Discord."
      pt-br: "Respondo aos comandos do StreamElements deste streamer aqui no Discord."
    footer:
      en-us: "• Use the `/report` command to tell me a bug"
      pt-br: "• Use o comando `/reportar` para me contar um bug"

  - action: modal
    key: streamer
    emoji: "🎮"
    max_length: 30
    lowercase: true
    normalize: handle
    validation: validate_streamer_name
    lookup_answers:
      stream_elements_commands_count: stream_elements.enabled_commands
      stream_elements_top_commands: stream_elements.top_commands
      stream_elements_keiko_commands: stream_elements.keiko_commands
      streamer_image: twitch.profile_image
    title:
      en-us: "Streamer"
      pt-br: "Streamer"
    label:
      en-us: "Streamer username"
      pt-br: "Username do streamer"
    description:
      en-us: "Which streamer should I fetch commands from?"
      pt-br: "De qual streamer devo buscar os comandos?"
    placeholder:
      en-us: "e.g. @shroud"
      pt-br: "ex: @shroud"

  - action: resume
    key: confirm
    thumbnail_key: streamer_image
    title:
      en-us: ":white_check_mark: All set?"
      pt-br: ":white_check_mark: Tudo certo?"
    description:
      en-us: "Whenever someone uses a command with the **{context:prefix}** prefix, I'll fetch the response in `{response:streamer}`'s StreamElements and send it in chat!"
      pt-br: "Sempre que alguém usar um comando com o prefixo **{context:prefix}**, eu busco a resposta no StreamElements de `{response:streamer}` e envio no chat!"
    lines:
      - emoji: "💡"
        value-key: stream_elements_commands_count
        label:
          en-us: "Active commands"
          pt-br: "Comandos ativos"
      - emoji: "✨"
        value-key: stream_elements_top_commands
        label:
          en-us: "Some of them"
          pt-br: "Alguns deles"
      - emoji: "🐶"
        value-key: stream_elements_keiko_commands
        label:
          en-us: "My version"
          pt-br: "Versão do Keiko"
    footer:
      en-us: "• Use the `/report` command to tell me a bug"
      pt-br: "• Use o comando `/reportar` para me contar um bug"

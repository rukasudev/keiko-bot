steps:
  - action: form
    key: form
    title:
      en-us: "🔔 Twitch Notifications"
      pt-br: "🔔 Twitch Notificações"
    description:
      en-us: Enabling this feature allows me to notify when your favorite streamer is online on Twitch!
      pt-br: Ativar esta função faz com que eu notifique quando seu streamer favorito estiver online na Twitch!
    manager_description:
      en-us: "I let the server know when these streamers go live."
      pt-br: "Aviso no servidor quando estes streamers entram ao vivo."
    footer:
      en-us: "• Use the `/report` command to tell me a bug"
      pt-br: "• Use o comando `/reportar` para me contar um bug"

  - action: composition
    key: notifications
    parent_key: notifications_twitch
    max: 3
    edit_by_item: true
    emoji: ":busts_in_silhouette:"
    style: composition
    title:
      en-us: Notifications
      pt-br: Notificações
    description:
      en-us: "Do you want to add more streamers? Add more streamers to be notified when they are online on Twitch! (Max: 3)"
      pt-br: "Deseja adicionar mais streamers? Adicione mais streamers para ser notificado quando eles estiverem online na Twitch! (Max: 3)"
    footer:
      en-us: "• Use the `/report` command to tell me a bug"
      pt-br: "• Use o comando `/reportar` para me contar um bug"
    steps:
      - action: configuration_card
        key: notification
        preview: true
        required:
          - channel
          - streamer
        defaults:
          notification_messages:
            en-us: "@everyone {streamer} is live! {stream_link}"
            pt-br: "@everyone {streamer} está ao vivo! {stream_link}"
        title:
          en-us: "Twitch Streamer"
          pt-br: "Streamer da Twitch"
        description:
          en-us: "Choose the channel and the streamer, and I'll let the server know when they go live! The message already comes set, change it if you want.\n\nOne of the messages is picked at random each time. You can use:\n- `{streamer}`: the streamer's nick\n- `{stream_link}`: the live link"
          pt-br: "Escolha o canal e o streamer, e eu aviso no servidor quando ele entrar ao vivo! A mensagem já vem configurada, mude se quiser.\n\nUma das mensagens é sorteada a cada vez. Você pode usar:\n- `{streamer}`: o nick do streamer\n- `{stream_link}`: o link da live"
        footer:
          en-us: "• Use the `/report` command to tell me a bug"
          pt-br: "• Use o comando `/reportar` para me contar um bug"
        header:
          title:
            en-us: "Twitch Streamer"
            pt-br: "Streamer da Twitch"
          title-emoji: "📡"
          thumbnail_key: streamer_avatar
        fields:
          - key: channel
            style: channel
            label:
              en-us: Text Channel
              pt-br: Canal de Texto
            description:
              en-us: Where I'll announce the live.
              pt-br: Onde vou avisar da live.
          - key: streamer
            label:
              en-us: Streamer
              pt-br: Streamer
            description:
              en-us: The streamer's Twitch nick, with or without @.
              pt-br: O nick do streamer na Twitch, com ou sem @.
          - key: notification_messages
            style: bullet
            label:
              en-us: Notification Messages
              pt-br: Mensagens de Notificação
            description:
              en-us: Up to three messages, I pick one at random each live.
              pt-br: Até três mensagens, eu sorteio uma a cada live.
        sections:
          - key: channel
            icon: "📺"
            type: channel-select
            style: channel
            label:
              en-us: "Text Channel"
              pt-br: "Canal de Texto"
            state:
              value: channel
            customize-label:
              en-us: "Choose channel"
              pt-br: "Escolher canal"
            picker-title:
              en-us: "Where should I send the notifications?"
              pt-br: "Onde devo enviar as notificações?"
          - key: streamer
            icon: "🎮"
            type: modal-input
            label:
              en-us: "Streamer"
              pt-br: "Streamer"
            state:
              value: streamer
            lookup_answers:
              streamer_avatar: twitch.profile_image
            customize-label:
              en-us: "Choose streamer"
              pt-br: "Escolher streamer"
            modal:
              title:
                en-us: "Streamer"
                pt-br: "Streamer"
              validation: validate_streamer_name
              fields:
                - key: streamer
                  max_length: 30
                  normalize: handle
                  label:
                    en-us: "The streamer's Twitch nick, with or without @"
                    pt-br: "O nick do streamer na Twitch, com ou sem @"
                  placeholder:
                    en-us: "e.g. @shroud"
                    pt-br: "ex: @shroud"
          - key: messages
            icon: "💬"
            type: modal-input
            style: bullet
            label:
              en-us: "Notification Messages"
              pt-br: "Mensagens de Notificação"
            state:
              value: notification_messages
            customize-label:
              en-us: "Edit messages"
              pt-br: "Editar mensagens"
            modal:
              title:
                en-us: "Notification Messages"
                pt-br: "Mensagens de Notificação"
              fields:
                - max_length: 100
                  multiline: true
                  label:
                    en-us: "Random Message #1"
                    pt-br: "Mensagem Aleatória #1"
                - max_length: 100
                  multiline: true
                  required: false
                  label:
                    en-us: "Random Message #2"
                    pt-br: "Mensagem Aleatória #2"
                - max_length: 100
                  multiline: true
                  required: false
                  label:
                    en-us: "Random Message #3"
                    pt-br: "Mensagem Aleatória #3"

  - action: resume
    key: confirm
    preview: true
    title:
      en-us: ":white_check_mark: Alright?"
      pt-br: ":white_check_mark: Tudo certo?"
    description:
      en-us: Enabling this feature allows me to notify when your favorite streamer is online on Twitch!
      pt-br: Ativar esta função faz com que eu notifique quando seu streamer favorito estiver online na Twitch!
    footer:
      en-us: "• Use the `/report` command to tell me a bug"
      pt-br: "• Use o comando `/reportar` para me contar um bug"

steps:
  - action: form
    key: form
    title:
      en-us: "🎉 Welcome Messages"
      pt-br: "🎉 Mensagens de Boas-Vindas"
    description:
      en-us: Enabling this feature allows me to send a personalized welcome message to new members when they join your server
      pt-br: Ativar essa função me permitirá enviar uma mensagem de boas-vindas personalizada para novos membros quando eles entrarem no seu servidor
    manager_description:
      en-us: "I welcome everyone who joins the server with the message below."
      pt-br: "Dou boas-vindas a quem entra no servidor com a mensagem abaixo."
    footer:
      en-us: "• Use the `/report` command to tell me a bug"
      pt-br: "• Use o comando `/reportar` para me contar um bug"

  - action: configuration_card
    key: welcome_config
    edit_by_field: true
    preview: true
    required:
      - welcome_messages_channel
      - welcome_custom_image
    defaults:
      welcome_design: server_blur
      welcome_messages_title:
        en-us: "A new member has joined! 🎉"
        pt-br: "Um novo membro chegou! 🎉"
      welcome_messages:
        en-us: "Welcome {user} to {server}!;Look who just arrived! {user};{user} just arrived!"
        pt-br: "{user} bem-vindo ao {server}!;Olha quem chegou! {user};{user} acabou de chegar!"
      welcome_messages_footer:
        en-us: "Have fun!"
        pt-br: "Divirta-se!"
    title:
      en-us: "🎉 Welcome Messages"
      pt-br: "🎉 Mensagens de Boas-Vindas"
    description:
      en-us: "Choose the channel and I'm ready to welcome new members! The design and the messages already come set, change them if you want.\n\nYou can use these variables in the messages:\n- `{user}`: the new member's mention\n- `{server}`: the server name\n- `{member_count}`: how many members the server has"
      pt-br: "Escolha o canal e eu já fico pronto para receber os novos membros! O design e as mensagens já vêm configurados, mude se quiser.\n\nVocê pode usar estas variáveis nas mensagens:\n- `{user}`: a menção do novo membro\n- `{server}`: o nome do servidor\n- `{member_count}`: quantos membros o servidor tem"
    footer:
      en-us: "• Use the `/report` command to tell me a bug"
      pt-br: "• Use o comando `/reportar` para me contar um bug"
    header:
      title:
        en-us: "Welcome Messages"
        pt-br: "Mensagens de Boas-Vindas"
      title-emoji: "🎉"
      thumbnail: IMAGE_01
    fields:
      - key: welcome_messages_channel
        style: channel
        label:
          en-us: Channel
          pt-br: Canal
        description:
          en-us: Where I'll send the welcome message.
          pt-br: Onde vou enviar a mensagem de boas-vindas.
      - key: welcome_messages_title
        label:
          en-us: Title
          pt-br: Título
        description:
          en-us: The title of the welcome message.
          pt-br: O título da mensagem de boas-vindas.
      - key: welcome_messages
        style: code-block
        label:
          en-us: Messages
          pt-br: Mensagens
        description:
          en-us: Up to three greetings, I pick one at random each time.
          pt-br: Até três saudações, eu sorteio uma a cada vez.
      - key: welcome_messages_footer
        label:
          en-us: Footer
          pt-br: Rodapé
        description:
          en-us: The small line that closes the message.
          pt-br: A linha pequena que fecha a mensagem.
      - key: welcome_design
        label:
          en-us: Banner design
          pt-br: Design do banner
        description:
          en-us: The look of the banner I draw for each new member.
          pt-br: O visual do banner que eu desenho para cada novo membro.
      - key: welcome_custom_image
        label:
          en-us: Custom image
          pt-br: Imagem personalizada
        description:
          en-us: The picture I put on the banner when you pick a custom design.
          pt-br: A imagem que eu coloco no banner quando você escolhe um design personalizado.
    sections:
      - key: channel
        icon: "📺"
        type: channel-select
        style: channel
        label:
          en-us: "Channel"
          pt-br: "Canal"
        state:
          value: welcome_messages_channel
        customize-label:
          en-us: "Choose channel"
          pt-br: "Escolher canal"
        picker-title:
          en-us: "Where should I welcome new members?"
          pt-br: "Onde devo dar boas-vindas aos novos membros?"
      - key: messages
        icon: "💬"
        type: modal-input
        style: code-block
        label:
          en-us: "Messages"
          pt-br: "Mensagens"
        state:
          value: welcome_messages
        customize-label:
          en-us: "Edit messages"
          pt-br: "Editar mensagens"
        modal:
          title:
            en-us: "Welcome Messages"
            pt-br: "Mensagens de Boas-Vindas"
          fields:
            - key: welcome_messages_title
              multiline: true
              max_length: 50
              label:
                en-us: Title
                pt-br: Título
            - max_length: 100
              multiline: true
              label:
                en-us: "Random Message #1"
                pt-br: "Mensagem Aleatória #1"
            - max_length: 100
              multiline: true
              required: false
              label:
                en-us: "Random Message #2"
                pt-br: "Mensagem Aleatória #2"
            - max_length: 100
              multiline: true
              required: false
              label:
                en-us: "Random Message #3"
                pt-br: "Mensagem Aleatória #3"
            - key: welcome_messages_footer
              multiline: true
              max_length: 50
              required: false
              label:
                en-us: Footer
                pt-br: Rodapé

      - key: design
        icon: "🎨"
        type: design-select
        draws_from: welcome_custom_image
        label:
          en-us: "Banner design"
          pt-br: "Design do banner"
        state:
          value: welcome_design
        customize-label:
          en-us: "Choose design"
          pt-br: "Escolher design"
        designs:
          - key: server_blur
            label:
              en-us: "Server Image Background"
              pt-br: "Imagem do Servidor de fundo"
            description:
              en-us: "The server icon as the background with a blur effect and the new member's profile picture centered"
              pt-br: "Ícone do servidor de fundo com efeito blur e foto de perfil do novo membro centralizada"
          - key: custom_blur
            label:
              en-us: "Custom Image Background"
              pt-br: "Imagem personalizada de fundo"
            description:
              en-us: "A custom background (you choose it) with a blur effect and the new member's profile picture centered"
              pt-br: "Fundo personalizado (você escolhe) com efeito blur e foto de perfil do novo membro centralizada"
          - key: custom_only
            label:
              en-us: "Custom Banner Only"
              pt-br: "Somente banner personalizado"
            description:
              en-us: "Your own image (or GIF) as the banner, with no profile picture in the middle. See the example below :)"
              pt-br: "Sua imagem (ou GIF) personalizada como banner, sem foto de perfil no centro. Veja o exemplo abaixo :)"
      - key: image
        icon: "🖼️"
        type: file-upload
        label:
          en-us: "Custom image"
          pt-br: "Imagem personalizada"
        state:
          url: welcome_custom_image
        visible-when:
          key: welcome_design
          not_in:
            - server_blur
        customize-label:
          en-us: "Upload image"
          pt-br: "Enviar imagem"
        modal:
          title:
            en-us: "📷 Upload Custom Image"
            pt-br: "📷 Enviar Imagem Personalizada"
  - action: resume
    key: confirm
    preview: true
    title:
      en-us: "🎉 Welcome Messages"
      pt-br: "🎉 Mensagens de Boas-Vindas"
    description:
      en-us: "Here's a summary of your choices so far. All set for me to turn on the `/{context:command}` command with the settings below? ✅"
      pt-br: "Esse é o resumo das suas escolhas até aqui. Tudo certo para eu ativar o comando `/{context:command}` com as configurações abaixo? ✅"
    footer:
      en-us: "• Use the `/report` command to tell me a bug"
      pt-br: "• Use o comando `/reportar` para me contar um bug"

steps:
  - action: form
    key: form
    title:
      en-us: "👩‍🎓 Default Roles"
      pt-br: "👩‍🎓 Cargos Padrão"
    description:
      en-us: Enabling this feature allows me to automatically assign roles to new members when they join your server
      pt-br: Ativar esta função faz com que eu atribua cargos automaticamente quando alguém entrar no seu servidor
    manager_description:
      en-us: "I give these roles automatically to everyone who joins the server."
      pt-br: "Dou estes cargos automaticamente para quem entra no servidor."
    footer:
      en-us: "• Use the `/report` command to tell me a bug"
      pt-br: "• Use o comando `/reportar` para me contar um bug"

  - action: multi_select
    key: default_roles_config
    required: true
    title:
      en-us: Default Roles
      pt-br: Cargos Padrão
    description:
      en-us: "Choose the roles I'll give automatically:\n\n1. **Roles for bots**: when a bot joins the server\n2. **Roles for members**: when a person joins the server\n\nYou can leave one of them empty, just not both! 🐶"
      pt-br: "Escolha os cargos que eu vou dar automaticamente:\n\n1. **Cargos para bots**: quando um bot entrar no servidor\n2. **Cargos para membros**: quando uma pessoa entrar no servidor\n\nPode deixar um dos dois vazio, só não os dois! 🐶"
    footer:
      en-us: "• Use the `/report` command to tell me a bug"
      pt-br: "• Use o comando `/reportar` para me contar um bug"
    selects:
      - type: available_roles
        key: default_roles_bot
        style: role
        icon: "🤖"
        label:
          en-us: "Roles for Bots"
          pt-br: "Cargos para Bots"
        placeholder:
          en-us: "Roles for Bots..."
          pt-br: "Cargos para Bots..."
      - type: available_roles
        key: default_roles
        style: role
        icon: "👥"
        label:
          en-us: "Roles for Members"
          pt-br: "Cargos para Membros"
        placeholder:
          en-us: "Roles for Members..."
          pt-br: "Cargos para Membros..."

  - action: resume
    key: confirm
    title:
      en-us: ":white_check_mark: Alright?"
      pt-br: ":white_check_mark: Tudo certo?"
    description:
      en-us: Enabling this feature allows me to automatically assign roles to new members when they join your server
      pt-br: Ativar esta função faz com que eu atribua cargos automaticamente quando alguém entrar no seu servidor!
    footer:
      en-us: "• Use the `/report` command to tell me a bug"
      pt-br: "• Use o comando `/reportar` para me contar um bug"

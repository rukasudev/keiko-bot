steps:
  - action: form
    key: form
    title:
      en-us: ":no_entry_sign: Block Links"
      pt-br: ":no_entry_sign: Bloquear Links"
    description:
      en-us: "Enabling this feature allows me to watch every message and delete the links you don't want here! You choose how I do it: block all links with your exceptions, or allow links and block only the ones you pick."
      pt-br: "Ativar esta função faz com que eu fique de olho em cada mensagem e exclua os links que você não quer por aqui! Você escolhe como eu faço isso: bloquear todos os links com as suas exceções, ou permitir links e bloquear só os que você escolher."
    manager_description:
      en-us: "I'm keeping an eye on links sent in the server, following the rules below."
      pt-br: "Estou de olho nos links enviados no servidor e sigo as regras abaixo."
    footer:
      en-us: "• Use the `/report` command to tell me a bug"
      pt-br: "• Use o comando `/reportar` para me contar um bug"

  - action: configuration_card
    key: link_settings
    editable: true
    required:
      - mode
    defaults:
      mode: block_all
      answer:
        en-us: "No links here! :p"
        pt-br: "Nada de links por aqui! :p"
    title:
      en-us: "General Settings"
      pt-br: "Configurações Gerais"
    description:
      en-us: "Choose how I should treat links in your server"
      pt-br: "Escolha como eu devo tratar os links do seu servidor"
    footer:
      en-us: "• Use the `/report` command to tell me a bug"
      pt-br: "• Use o comando `/reportar` para me contar um bug"
    header:
      title:
        en-us: "General Settings"
        pt-br: "Configurações Gerais"
      title-emoji: "🚦"
      thumbnail: IMAGE_01
      lines: []
    fields:
      - key: mode
        label:
          en-us: "Blocking mode"
          pt-br: "Modo de bloqueio"
        description:
          en-us: Whether I block every link or only the ones you pick.
          pt-br: Se eu bloqueio todos os links ou só os que você escolher.
      - key: answer
        label:
          en-us: "My response when blocking"
          pt-br: "Minha resposta ao bloquear"
        description:
          en-us: What I say when I delete a link.
          pt-br: O que eu digo quando apago um link.
      - key: allowed_chats
        style: channel
        label:
          en-us: "Allowed channels"
          pt-br: "Canais permitidos"
        description:
          en-us: The channels where I never delete links.
          pt-br: Os canais onde eu nunca apago links.
      - key: allowed_roles
        style: role
        label:
          en-us: "Allowed roles"
          pt-br: "Cargos permitidos"
        description:
          en-us: Whoever has one of these roles can send links freely.
          pt-br: Quem tem um desses cargos pode mandar links à vontade.
      - key: allowed_links
        style: bullet
        label:
          en-us: "Allowed popular websites"
          pt-br: "Sites populares permitidos"
        description:
          en-us: Popular websites I always let through.
          pt-br: Sites populares que eu sempre libero.
        edit_label:
          en-us: "Add"
          pt-br: "Adicionar"
        panel_group:
          key: exceptions
          emoji: "✅"
          own_screen: true
          order: 1
          title:
            en-us: "Exceptions"
            pt-br: "Exceções"
          description:
            en-us: "These are the websites and links I always let through, even blocking every other one. Turn a popular website on or off right here, and add your own links below."
            pt-br: "Estes são os sites e links que eu sempre libero, mesmo bloqueando todos os outros. Ligue ou desligue um site popular aqui mesmo, e adicione os seus próprios links abaixo."
          description_when:
            - when:
                key: mode
                not_in: [block_all]
              text:
                en-us: "These are the only links I block, letting every other one through. Add your own links below."
                pt-br: "Estes são os únicos links que eu bloqueio, deixando todos os outros passarem. Adicione os seus próprios links abaixo."
          title_when:
            - when:
                key: mode
                not_in: [block_all]
              text:
                en-us: "Blocked links"
                pt-br: "Links bloqueados"
    sections:
      - key: mode
        icon: "🚦"
        type: button-options
        label:
          en-us: "Blocking mode"
          pt-br: "Modo de bloqueio"
        state:
          value: mode
        picker-title:
          en-us: "How should I block links?"
          pt-br: "Como devo bloquear os links?"
        customize-label:
          en-us: "Choose mode"
          pt-br: "Escolher modo"
        options:
          - label:
              en-us: "🔗 Block some"
              pt-br: "🔗 Bloquear alguns"
            description:
              en-us: "I let links through and block only the websites and links you pick."
              pt-br: "Eu deixo os links passarem e bloqueio só os sites e links que você escolher."
            value: allow_all
            style: primary
          - label:
              en-us: "🚫 Block all"
              pt-br: "🚫 Bloquear todos"
            description:
              en-us: "I delete every link, and you can still allow some websites and links afterwards."
              pt-br: "Eu apago todos os links, mas você ainda pode liberar alguns sites e links depois."
            value: block_all
            style: primary
      - key: answer
        icon: "💬"
        type: modal-input
        label:
          en-us: "My response when blocking"
          pt-br: "Minha resposta ao bloquear"
        state:
          value: answer
        customize-label:
          en-us: "Customize response"
          pt-br: "Personalizar resposta"
        modal:
          title:
            en-us: "My Response When Blocking Links"
            pt-br: "Minha Resposta ao Bloquear Links"
          fields:
            - key: answer
              max_length: 100
              label:
                en-us: "Type my answer when blocking links"
                pt-br: "Digite minha resposta ao bloquear links"
              placeholder:
                en-us: "No links here! :p (use {user} to mention)"
                pt-br: "Nada de links por aqui! :p (use {user} para mencionar)"
      - key: exceptions
        icon: "🛡️"
        type: group
        sections: [exempt, allowed_links, own_links]
        visible-when:
          key: mode
          not_in: [allow_all]
        label:
          en-us: "Add exceptions?"
          pt-br: "Adicionar exceções?"
        description:
          en-us: "Channels, roles, sites and links I never delete."
          pt-br: "Canais, cargos, sites e links que eu nunca apago."
        customize-label:
          en-us: "Configure"
          pt-br: "Configurar"
        picker-title:
          en-us: "Exceptions"
          pt-br: "Exceções"
      - key: channel_exceptions
        icon: "🛡️"
        type: group
        sections: [exempt]
        visible-when:
          key: mode
          not_in: [block_all]
        label:
          en-us: "Add exceptions?"
          pt-br: "Adicionar exceções?"
        description:
          en-us: "Channels and roles where I never delete links."
          pt-br: "Canais e cargos onde eu nunca apago links."
        customize-label:
          en-us: "Configure"
          pt-br: "Configurar"
        picker-title:
          en-us: "Exceptions"
          pt-br: "Exceções"
      - key: exempt
        icon: "🔓"
        type: selects
        label:
          en-us: "Allowed channels and roles"
          pt-br: "Canais e cargos permitidos"
        description:
          en-us: "I **never** delete links sent in these channels or by anyone with these roles."
          pt-br: "Eu **nunca** apago links enviados nesses canais ou por quem tem esses cargos."
        customize-label:
          en-us: "Choose channels and roles"
          pt-br: "Escolher canais e cargos"
        picker-title:
          en-us: "Where should I never delete links?"
          pt-br: "Onde eu nunca devo apagar links?"
        picker-description:
          en-us: "Pick the channels and the roles. I **never** delete links sent in those channels or by anyone with those roles."
          pt-br: "Escolha os canais e os cargos. Eu **nunca** apago links enviados nesses canais ou por quem tem esses cargos."
        selects:
          - type: channels
            key: allowed_chats
            style: channel
            icon: "#️⃣"
            label:
              en-us: "Allowed channels"
              pt-br: "Canais permitidos"
            placeholder:
              en-us: "Channels where I never delete links"
              pt-br: "Canais onde eu nunca apago links"
          - type: roles
            key: allowed_roles
            style: role
            icon: "🏷️"
            label:
              en-us: "Allowed roles"
              pt-br: "Cargos permitidos"
            placeholder:
              en-us: "Roles whose links I never delete"
              pt-br: "Cargos cujos links eu nunca apago"
      - key: allowed_links
        icon: "🔗"
        type: multi-select
        visible-when:
          key: mode
          not_in: [allow_all]
        label:
          en-us: "Allowed popular websites"
          pt-br: "Sites populares permitidos"
        state:
          value: allowed_links
        picker-title:
          en-us: "Pick the websites I should always allow"
          pt-br: "Escolha os sites que devo sempre permitir"
        customize-label:
          en-us: "Choose websites"
          pt-br: "Escolher sites"
        options:
          - label: { en-us: "Youtube", pt-br: "Youtube" }
            value: youtube.com
          - label: { en-us: "Spotify", pt-br: "Spotify" }
            value: spotify.com
          - label: { en-us: "Twitter", pt-br: "Twitter" }
            value: twitter.com
          - label: { en-us: "Facebook", pt-br: "Facebook" }
            value: facebook.com
          - label: { en-us: "Instagram", pt-br: "Instagram" }
            value: instagram.com
          - label: { en-us: "Twitch", pt-br: "Twitch" }
            value: twitch.tv
          - label: { en-us: "Tiktok", pt-br: "Tiktok" }
            value: tiktok.com
          - label: { en-us: "Reddit", pt-br: "Reddit" }
            value: reddit.com
          - label: { en-us: "Discord", pt-br: "Discord" }
            value: discord.gg
      - key: own_links
        icon: "📌"
        type: list
        list: custom_links
        setup-only: true
        label:
          en-us: "Allowed custom links"
          pt-br: "Links personalizados permitidos"
        description:
          en-us: "Your own websites or links, one at a time. You can add them later too!"
          pt-br: "Seus próprios sites ou links, um de cada vez. Você pode adicionar depois também!"

  - action: composition
    key: custom_links
    parent_key: block_links
    max: 25
    unique_by: link
    emoji: "📌"
    style: composition
    panel_group:
      key: exceptions
      own_screen: true
      order: 1
    title:
      en-us: "Allowed custom links"
      pt-br: "Links personalizados permitidos"
    title-when:
      - when:
          key: mode
          not_in: [block_all]
        en-us: "Blocked custom links"
        pt-br: "Links personalizados bloqueados"
    description:
      en-us: "Your own websites or links that I always let through, one at a time!"
      pt-br: "Seus próprios sites ou links que eu sempre libero, um de cada vez!"
    description-when:
      - when:
          key: mode
          not_in: [block_all]
        en-us: "Your own websites or links that I block, letting every other one through. One at a time!"
        pt-br: "Seus próprios sites ou links que eu bloqueio, deixando todos os outros passarem. Um de cada vez!"
    footer:
      en-us: "• Use the `/report` command to tell me a bug"
      pt-br: "• Use o comando `/reportar` para me contar um bug"
    steps:
      - action: modal
        key: link
        emoji: "🔗"
        lowercase: true
        max_length: 100
        style: code
        response_transform: normalize_link
        validation: validate_link_or_domain
        title:
          en-us: "Link or Website"
          pt-br: "Link ou Site"
        label:
          en-us: "Type the link or website"
          pt-br: "Digite o link ou site"
        description:
          en-us: "A whole website or one exact link. Example: `twitch.tv` or `youtube.com/watch?v=abc123`"
          pt-br: "Um site inteiro ou um link exato. Exemplo: `twitch.tv` ou `youtube.com/watch?v=abc123`"
        placeholder:
          en-us: "twitch.tv"
          pt-br: "twitch.tv"
        footer:
          en-us: "• Use the `/report` command to tell me a bug"
          pt-br: "• Use o comando `/reportar` para me contar um bug"
      - action: options
        key: match_type
        emoji: "🎯"
        required: true
        unique: true
        styled_values: true
        auto_confirm: true
        condition:
          key: link
          matches: "[/?]"
        title:
          en-us: "How Far Does This Rule Go?"
          pt-br: "Qual o Alcance da Regra?"
        description:
          en-us: "Tell me how far this rule goes!\n\n🌐 **Every link from this website**\nI always allow everything on `{response:link:host|youtube.com}`, any page or video of it.\n\n🔗 **Only this specific link**\nI always allow only `{response:link|youtube.com/watch?v=abc123}`, and the rest of the website stays blocked.\n\nWhich one do you prefer? Just pick it on the buttons below! 🐶"
          pt-br: "Me diga o alcance dessa regra!\n\n🌐 **Todos os links desse site**\nEu sempre libero tudo em `{response:link:host|youtube.com}`, qualquer página ou vídeo dele.\n\n🔗 **Só esse link específico**\nEu sempre libero só `{response:link|youtube.com/watch?v=abc123}`, e o resto do site continua bloqueado.\n\nQual você prefere? É só escolher nos botões abaixo! 🐶"
        description-when:
          - condition:
              key: mode
              not_in: [block_all]
            en-us: "Tell me how far this rule goes!\n\n🌐 **Every link from this website**\nI always block everything on `{response:link:host|youtube.com}`, any page or video of it.\n\n🔗 **Only this specific link**\nI always block only `{response:link|youtube.com/watch?v=abc123}`, and the rest of the website stays allowed.\n\nWhich one do you prefer? Just pick it on the buttons below! 🐶"
            pt-br: "Me diga o alcance dessa regra!\n\n🌐 **Todos os links desse site**\nEu sempre bloqueio tudo em `{response:link:host|youtube.com}`, qualquer página ou vídeo dele.\n\n🔗 **Só esse link específico**\nEu sempre bloqueio só `{response:link|youtube.com/watch?v=abc123}`, e o resto do site continua liberado.\n\nQual você prefere? É só escolher nos botões abaixo! 🐶"
        footer:
          en-us: "• Use the `/report` command to tell me a bug"
          pt-br: "• Use o comando `/reportar` para me contar um bug"
        options:
          - label:
              en-us: "🌐 Every link from this website"
              pt-br: "🌐 Todos os links desse site"
            value: domain
          - label:
              en-us: "🔗 Only this specific link"
              pt-br: "🔗 Só esse link específico"
            value: exact

  - action: resume
    key: confirm
    title:
      en-us: ":no_entry_sign: Block Links"
      pt-br: ":no_entry_sign: Bloquear Links"
    description:
      en-us: "Here's a summary of your choices so far. All set for me to turn on the `/{context:command}` command with the settings below? ✅"
      pt-br: "Esse é o resumo das suas escolhas até aqui. Tudo certo para eu ativar o comando `/{context:command}` com as configurações abaixo? ✅"
    footer:
      en-us: "• Use the `/report` command to tell me a bug"
      pt-br: "• Use o comando `/reportar` para me contar um bug"

# open: what each embed answers -> a response
responses:
  admin_only:
    title:
      en-us: ⚠️ Admin Only
      pt-br: ⚠️ Apenas Admins
    description:
      en-us: "Sorry, commands like `${context.groups.moderations}` and `${context.groups.notifications}` need the **Manage Server** permission! 🔧\n\nAsk someone on the server's team who has it to set them up. They can also use `${context.commands.setup}` to manage everything in one place ✨"
      pt-br: "Desculpe, comandos como `${context.groups.moderations}` e `${context.groups.notifications}` precisam da permissão **Gerenciar servidor**! 🔧\n\nPeça para alguém da equipe do servidor que tenha essa permissão configurar. Essa pessoa também pode usar `${context.commands.setup}` para gerenciar tudo em um só lugar ✨"
    footer: null
  cooldown:
    title:
      en-us: ⏳ One Second!
      pt-br: ⏳ Um segundinho!
    description:
      en-us: I just answered you! You can ask me again in a moment 🐶
      pt-br: Acabei de te responder! Já já você pode me pedir de novo 🐶
    footer: null
  help:
    title:
      en-us: 🙋 Help
      pt-br: 🙋 Ajuda
    description:
      en-us: Here is a brief description of the buttons and their functionalities
      pt-br: Aqui está uma breve descrição dos botões e suas funcionalidades
    footer: null
  enabled:
    title:
      en-us: 🎉 Command enabled successfully!
      pt-br: 🎉 Funcionalidade ativada com sucesso!
    description:
      en-us: "I turned on the **$command_name** command on $date, as $user asked! 🚀\n\nTo make changes or disable it, just use `/$command_name` or `${context.commands.setup}` 🔄"
      pt-br: "Ativei o comando **$command_name** em $date, a pedido de $user! 🚀\n\nPara fazer alterações ou desativar o comando, use o comando `/$command_name` ou `${context.commands.setup}` 🔄"
  paused:
    title:
      en-us: ⏸️ Command paused successfully!
      pt-br: ⏸️ Comando pausado com sucesso!
    description:
      en-us: Command **$command_name** paused on $date by $user
      pt-br: Comando **$command_name** pausado em $date por $user
  unpaused:
    title:
      en-us: ▶️ Command unpaused successfully!
      pt-br: ▶️ Comando despausado com sucesso!
    description:
      en-us: Command **$command_name** unpaused on $date by $user
      pt-br: Comando **$command_name** despausado em $date por $user
  mention_removed:
    title:
      en-us: 📣 I removed the mention from the text!
      pt-br: 📣 Tirei a menção do texto!
    description:
      en-us: Hey, I noticed you typed a mention in the text! Use the **📣 ${ref.mention}** field to choose who you want me to notify.
      pt-br: Ei, vi que você digitou uma menção no texto! Use o campo **📣 ${ref.mention}** para escolher quem você quer notificar.
    tone: warning
  delete:
    title:
      en-us: 🗑️ Delete this command's settings?
      pt-br: 🗑️ Apagar as configurações desse comando?
    description:
      en-us: "When you click **Disable and delete** below, the **$command_name** command is turned off and **everything set up right now is deleted**. To turn the command on again, you'll need to set it up from scratch!! 🚨\n\nJust need a break? Use ⏸️ Pause and the command stops for a while, and I'll keep everything just the way it is!"
      pt-br: "Ao clicar em **Desativar e apagar** abaixo, o comando **$command_name** é desativado e **tudo que está configurado agora é apagado**. Para ativar o comando de novo, você vai precisar configurar ele do zero!! 🚨\n\nSó quer dar um tempo? Use o ⏸️ Pausar e o comando para momentaneamente e eu guardo tudo do jeitinho que está!"
    footer: null
    overrides:
      - when:
          key: global.facts.feature_state
          is: paused
        description:
          en-us: When you click **Disable and delete** below, the **$command_name** command is turned off and **everything set up right now is deleted**. To turn the command on again, you'll need to set it up from scratch!! 🚨
          pt-br: Ao clicar em **Desativar e apagar** abaixo, o comando **$command_name** é desativado e **tudo que está configurado agora é apagado**. Para ativar o comando de novo, você vai precisar configurar ele do zero!! 🚨
  disabled:
    title:
      en-us: 🚫 Command disabled successfully!
      pt-br: 🚫 Comando desativado com sucesso!
    description:
      en-us: "Command **$command_name** disabled and deleted on $date by $user\n\nIf you need to turn it on again, just run `/$command_name` or `${context.commands.setup}`!"
      pt-br: "Comando **$command_name** desativado e apagado em $date por $user\n\nSe precisar ativar de novo, é só rodar `/$command_name` ou `${context.commands.setup}`!"
  edit_member:
    title:
      en-us: 👤 Select a member to edit
      pt-br: 👤 Selecione um membro para editar
    description:
      en-us: Tell me which member you want to update in this list.
      pt-br: Me diga qual membro você quer atualizar nesta lista.
  search_member:
    title:
      en-us: 🔎 Search for a member
      pt-br: 🔎 Pesquisar um membro
    description:
      en-us: Tell me which member of this list you want to see.
      pt-br: Me diga qual membro desta lista você quer ver.
  remove_member:
    title:
      en-us: 👤 Select the members to remove
      pt-br: 👤 Selecione os membros para remover
    description:
      en-us: Tell me which members you want to remove from this list. You can pick more than one!
      pt-br: Me diga quais membros você quer tirar desta lista. Pode escolher mais de um!
  remove:
    title:
      en-us: 🗑️ Remove this item?
      pt-br: 🗑️ Remover este item?
    description:
      en-us: "$items\n\nIf I remove it, it leaves the list right away. You can add it again later, just ask me!"
      pt-br: "$items\n\nSe eu remover, ele sai da lista na hora. Você pode adicionar de novo depois, é só me pedir!"
    footer: null
    overrides:
      - when:
          key: global.facts.removing
          is: many
        title:
          en-us: 🗑️ Remove these items?
          pt-br: 🗑️ Remover estes itens?
        description:
          en-us: "$items\n\nIf I remove them, they leave the list right away. You can add them again later, just ask me!"
          pt-br: "$items\n\nSe eu remover, eles saem da lista na hora. Você pode adicionar de novo depois, é só me pedir!"
      - when:
          key: global.facts.removing
          is: last
        title:
          en-us: ⚠️ Hey, wait! Read this first
          pt-br: ⚠️ Ei, espere! Leia abaixo primeiro
        description:
          en-us: $warning
          pt-br: $warning
  discard:
    title:
      en-us: 🚨 Discard Settings?
      pt-br: 🚨 Descartar Configurações?
    description:
      en-us: If you cancel now, I'll close this message and everything we configured so far will be lost. To configure it again, you'll need to start over. Are you sure you want to discard everything?
      pt-br: Se você cancelar agora, vou encerrar esta mensagem e tudo o que configuramos até aqui será perdido. Para configurar de novo, você precisará começar do zero. Tem certeza de que quer descartar tudo?
    footer: null

# open: what each list shows -> a list
records:
  changes:
    title: ${ref.changes_history}
  history:
    title: ${ref.changes_history}
    description:
      en-us: "See the history of changes made to the feature **$command_name**:"
      pt-br: "Veja o histórico de alterações feitas na funcionalidade **$command_name**:"
    # open: the change each line tells -> a line template
    lines:
      enabled:
        en-us: ✅ Enabled
        pt-br: ✅ Ativado
      paused:
        en-us: ⏸️ Paused
        pt-br: ⏸️ Pausado
      unpaused:
        en-us: ▶️ Unpaused
        pt-br: ▶️ Despausado
      disabled:
        en-us: 🚫 Disabled and deleted
        pt-br: 🚫 Desativado e apagado
      edited:
        en-us: 📝 Edited
        pt-br: 📝 Editado
      added:
        en-us: ➕ Item added
        pt-br: ➕ Item adicionado
      removed:
        en-us: 🗑️ Item removed
        pt-br: 🗑️ Item removido
      by:
        en-us: $user · $date
        pt-br: $user · $date
      system:
        en-us: That's an automatic action I take when leaving the server
        pt-br: Essa é uma ação automática que eu faço ao sair do servidor

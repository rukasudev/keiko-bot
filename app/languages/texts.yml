# open: what Keiko is missing -> the line that says so
permissions:
  server:
    en-us: ⚠️ I need the **$permission** permission in the server
    pt-br: ⚠️ Preciso da permissão **$permission** no servidor
  channel:
    en-us: ⚠️ I need the **$permission** permission in $channel
    pt-br: ⚠️ Preciso da permissão **$permission** em $channel
  channel_gone:
    en-us: ⚠️ A configured channel no longer exists
    pt-br: ⚠️ Um canal configurado não existe mais
  role_above:
    en-us: ⚠️ The <@&$role> role is above mine, so I can't assign it
    pt-br: ⚠️ O cargo <@&$role> está acima do meu, então não consigo atribuí-lo

# open: a Discord permission flag -> its name
permission_names:
  view_channel:
    en-us: View Channels
    pt-br: Ver canais
  send_messages:
    en-us: Send Messages
    pt-br: Enviar mensagens
  embed_links:
    en-us: Embed Links
    pt-br: Inserir links
  attach_files:
    en-us: Attach Files
    pt-br: Anexar arquivos
  manage_roles:
    en-us: Manage Roles
    pt-br: Gerenciar cargos
  manage_messages:
    en-us: Manage Messages
    pt-br: Gerenciar mensagens

# open: how a feature's last days went -> the closing line of its statistics
recent:
  quiet:
    en-us: 💤 Nothing new in the last $days days.
    pt-br: 💤 Nenhuma novidade nos últimos $days dias.
  refused_one:
    en-us: ⚠️ In the last $days days, I couldn't do my job once because of a missing permission. Check **Permissions** on `${context.commands.setup}`!
    pt-br: ⚠️ Nos últimos $days dias, 1 vez eu não consegui fazer meu trabalho por falta de permissão. Confira em **Permissões** no `${context.commands.setup}`!
  refused_many:
    en-us: ⚠️ In the last $days days, I couldn't do my job $count times because of a missing permission. Check **Permissions** on `${context.commands.setup}`!
    pt-br: ⚠️ Nos últimos $days dias, $count vezes eu não consegui fazer meu trabalho por falta de permissão. Confira em **Permissões** no `${context.commands.setup}`!

# open: the message an admin job posts -> its line
admin_logs:
  daily_export:
    en-us: ":card_index_dividers: Here is my structured log for **$date**! ($count records)"
    pt-br: ":card_index_dividers: Aqui está o meu log estruturado de **$date**! ($count registros)"
  daily_backup:
    en-us: ":floppy_disk: Here is my encrypted database backup for **$date**! ($collections collections, $documents documents)"
    pt-br: ":floppy_disk: Aqui está o meu backup criptografado do banco de dados de **$date**! ($collections coleções, $documents documentos)"
  daily_backup_skipped:
    en-us: "I'm sorry, but these were too big for this channel even on their own, so I left them out: $skipped_collections. A manual `mongodump` still copies them!"
    pt-br: "Desculpe, mas estas ficaram grandes demais para este canal, mesmo sozinhas, então deixei de fora: $skipped_collections. Um `mongodump` manual ainda copia essas coleções!"
  monthly_events:
    en-us: ":card_file_box: Here is my events archive for **$month**! ($count events)"
    pt-br: ":card_file_box: Aqui está o meu arquivo de eventos de **$month**! ($count eventos)"
  files_parts:
    en-us: I sent it in $files files, one per message.
    pt-br: Enviei em $files arquivos, um por mensagem.

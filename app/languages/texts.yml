  pt-br: $thousands mil+

date_label:
  en-us: $month_name $day
  pt-br: $day de $month_lower

page:
  en-us: Page
  pt-br: Página

and_more:
  en-us: and $count more
  pt-br: e mais $count

empty_value:
  en-us: Empty
  pt-br: Em branco

settings_heading:
  en-us: Settings
  pt-br: Configurações

server_settings:
  en-us: Server Settings
  pt-br: Configurações do Servidor

paused_suffix:
  en-us: Paused
  pt-br: Pausado

selected:
  en-us: Selected
  pt-br: Selecionado

file_upload:
  en-us: Image
  pt-br: Imagem

preview_empty:
  en-us: I don't have any message written yet! Write one and I'll show you exactly how it arrives. 🐶
  pt-br: Ainda não tenho nenhuma mensagem escrita! Escreva uma e eu te mostro exatamente como ela chega. 🐶

unknown_language:
  en-us: Unknown
  pt-br: Desconhecido

# open: a boolean value -> the word it reads as
boolean:
  "yes":
    en-us: "Yes"
    pt-br: Sim
  "no":
    en-us: "No"
    pt-br: Não

# open: a default-or-custom mode -> the word it reads as
modes:
  default:
    en-us: Default
    pt-br: Padrão
  custom:
    en-us: Custom
    pt-br: Personalizado

# open: a default-or-custom mode -> the badge after a card section's heading
badges:
  default:
    en-us: 📌 Keiko's default
    pt-br: 📌 Padrão do Keiko
  custom:
    en-us: ✨ Custom
    pt-br: ✨ Personalizado

# open: what a select picks -> its placeholder
placeholders:
  channel:
    en-us: Select a channel...
    pt-br: Selecione um canal...
  user:
    en-us: Select a member...
    pt-br: Selecione um membro...
  edit:
    en-us: Select the settings you want to edit
    pt-br: Selecione as configurações que deseja editar
  remove:
    en-us: Select the items you want to remove
    pt-br: Selecione os itens que deseja remover

# open: the part of the design gallery -> its line
design_gallery:
  header:
    en-us: "⬇️ Select one of the designs below:"
    pt-br: "⬇️ Selecione um dos designs abaixo:"
  footer:
    en-us: ⬆️ Scroll up to see all options
    pt-br: ⬆️ Role para cima para ver todas as opções

# open: why a click changed nothing -> the note it gets
notices:
  stale:
    en-us: Oops! That screen is out of date, here's the current one 🐶
    pt-br: Ops! Essa tela já mudou, aqui está a atual 🐶
  busy:
    en-us: One second! I'm still saving what you just confirmed 🐶
    pt-br: Um segundinho! Ainda estou salvando o que você acabou de confirmar 🐶
  closed:
    en-us: This form is already closed! If you need to change something, just call the command again 🐶
    pt-br: Esse formulário já foi fechado! Se precisar mudar algo, é só chamar o comando de novo 🐶
  expired:
    en-us: Hey... this form expired! If you'd like to continue, just call the command again or press the button below ⏳
    pt-br: Ei... esse formulário expirou! Se quiser continuar, é só chamar o comando de novo ou apertar no botão abaixo ⏳


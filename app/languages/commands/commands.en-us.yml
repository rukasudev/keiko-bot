en-us:
  commands:
    commons:
      embed:
        footer: "Use the `/report` command to tell me a bug"
      months:
        january: January
        february: February
        march: March
        april: April
        may: May
        june: June
        july: July
        august: August
        september: September
        october: October
        november: November
        december: December
      birthday-params:
        member:
          name: member
          desc: Member whose birthday will be registered
        day:
          name: day
          desc: "Birthday day (1-31)"
        month:
          name: month
          desc: "Birthday month"
      block-links-manager:
        info-title: "🔎 Why did a link get through?"
        info: "Right click the message, pick **Apps** and then **Check Link Blocking**: I show you which rule allowed or blocked every link in it!"
        blocked-list:
          button:
            label: Blocks
            desc: See the links I blocked and filter them by member
          embed:
            title: "🔎 Links I blocked"
            description: "The most recent blocks of this server! I keep these details for 90 days."
            empty: "I haven't blocked any link here yet! 🐶"
          filter:
            label: Filter by member
            all-label: See everyone
            title: "🔎 Filter by member"
            description: "Pick the member and I'll show you only their blocks!"
            empty: "I haven't blocked any link from this member yet! 🐶"
          record:
            line: "$user · $channel · $date"
            rule: "Rule: $rule"
            not-deleted: "⚠️ I could not delete this message. Check if I have the manage messages permission!"
        stats:
          button:
            desc: See the numbers of the links I blocked
          embed:
            title: "📊 Link blocking stats"
          fields:
            total: Blocks of all time
            recent: Blocks in the last 90 days
            top-websites: Most blocked websites
            top-member: Member with most blocks
            not-deleted: Messages I could not delete
          empty: "I haven't blocked any link here yet! 🐶"
      reminders-birthdays-manager:
        stats:
          button:
            label: Stats
            desc: View birthday statistics
          embed:
            title: "📊 Birthday stats"
          fields:
            total: Total birthdays
            this-month: Birthdays this month
            top: Top month
            quietest: Quietest month
            most-common: Most common date
        settings:
          channel: Birthday Channel
          mention-everyone: "Mention @everyone"
          timezone: Timezone
          notification-time: Notification time
          default-message: Default member message
          total: Total birthdays
          next: Next birthdays
        disable:
          confirmed: Birthday reminders disabled.

    help:
      name: help
      desc: Keiko helps you understand how to use the available commands
      embed:
        title: 📚 Available commands
        desc:
          "Here are my commands that will help you make your server more cozy! ✨\n\n
          Select a command below to see its description and run it directly ⬇️\n\n"
        placeholder: Select a command
        base-commands: Base commands

      embed-desc:
        title: 📚 Command description
        desc: "If you need more information about a specific command, don't hesitate to send us a message on my official server with the `/support` command! 💌\n\n"

    report:
      name: report
      desc: Keiko helps you report any bugs or issues you encounter
      response:
        title: 📝 Report sent!
        message: I've passed your report to my team! Check your DMs, I just sent you a message with more details 💌
        footer: If you need help, don't hesitate to call us on my official server with the `/support` command.
      dm-message:
        title: 📝 Your ticket has been created!
        fields:
          title: Title
          description: Description
          command: Command
          author: Author
          atachments: Attachment
          no-atachments: Without attachments
        footer: If you need help, don't hesitate to call us on my official server with the `/support` command.

    support:
      name: support
      desc: Keiko shows you how you can get help through your official server
      response:
        title: 💌 Support
        message: "[✨ Click here to join my official server ✨](https://discord.gg/Hdg239Cvbd)"
        field:
          title: How to ask for help 🙋‍♂️
          desc: "1. Go to the **#support** channel and describe your problem
            \n2. Wait for a team member to respond
            \n3. If necessary, a team member will call you to a private support room"
        footer: Use the `/help` command to better understand how to use the available commands.

    ping:
      name: ping
      desc: Keiko shows you what your current response time is
      response:
        title: 🏓 Pong!
        message: My current latency is **$ping ms** 🐾

    translate-message:
      name: Translate Message
      desc: Keiko translates a message into your preferred language
      response:
        title: 🌐 Translate Message
        message: "I used my polyglot skills to translate the message you sent: {message_url}!\n\n**Original ({src_lang})**\n{original_message}\n\n**Translated ({dest_lang})**\n{translated_message}"
        footer: If you need help, don't hesitate to call us on my official server with the `/support` command.

    block-links:
      subgroup: block
      name: links
      desc: Keiko blocks links your way, everything with exceptions or only the links you choose

    block-links-check:
      name: Check Link Blocking
      desc: Keiko explains why she blocked or allowed the links of a message
      embed:
        title-blocked: "🚫 I would block this message"
        title-allowed: "✅ I would let this message through"
      fields:
        feature:
          title: "1️⃣ Is the feature active?"
          not-configured: "❌ I'm not set up here yet, so I block no links at all. Use `/moderations block links` to get started!"
          paused: "⏸️ I'm paused here, so I let every link through. Bring me back with `/moderations block links`!"
          active: "✅ I'm active, in **$mode** mode."
        exemptions:
          title: "2️⃣ Are the author or the channel exempt?"
          role-exempt: "🔓 The role $roles is exempt, so I never block links from this member."
          role-not-exempt: "🔒 No role of this member is on the exempt list."
          channel-exempt: "🔓 The channel $channel is exempt, so I never block links there."
          channel-not-exempt: "🔒 This channel is not on the exempt list."
        links:
          title: "3️⃣ What about the links?"
          none: "I found no link in this message."
          more: "And $count more links."
          reasons:
            allowed-by-popular: "✅ `$link`: allowed because **$rule** is on your popular websites list."
            allowed-by-custom-domain: "✅ `$link`: allowed by your website rule **$rule**."
            allowed-by-custom-exact: "✅ `$link`: allowed by your exact link rule **$rule**."
            allowed-by-default: "✅ `$link`: allowed because the mode allows everything and no rule of yours blocks it."
            blocked-by-custom-domain: "🚫 `$link`: blocked by your website rule **$rule**."
            blocked-by-custom-exact: "🚫 `$link`: blocked by your exact link rule **$rule**."
            blocked-no-rule: "🚫 `$link`: blocked because nothing on your list allows it."

    welcome-messages:
      subgroup: welcome
      name: messages
      desc: Keiko warmly welcomes new members with a personalized message

    notifications-twitch:
      subgroup: twitch
      name: lives
      desc: Keiko will notify you whenever your favorite streamers is online on Twitch

    notifications-youtube:
      subgroup: youtube
      name: videos
      desc: Keiko will notify you whenever your favorite YouTubers uploads a new video on YouTube

    moderations-birthdays:
      subgroup: birthdays
      name: reminders
      desc: Keiko warmly celebrates your members' birthdays with personalized messages

    moderations-birthdays-add:
      name: add
      desc: Quickly register a member birthday
      response:
        title: 🎂 Birthday registered!
        message: "I saved {member}'s birthday for **{date}**.\n\nTo review all reminders, use `/moderations birthdays reminders`."
        footer: "Use the `/report` command to tell me a bug"

    birthday-personal:
      name: birthday
      desc: Keiko remembers your birthday and celebrates it on your server
      response:
        title: 🎂 Birthday saved!
        message: "All set! I'll keep **{date}** safe and get ready to celebrate when the day arrives."
        footer: "Use the `/report` command to tell me a bug"
      overwrite-confirm:
        title: 🎂 Update birthday?
        message: "You already have a birthday saved on **{current_date}**. Do you want to overwrite it with **{new_date}**? This is your last edit."
        footer: "Use the `/report` command to tell me a bug"
      overwrite-response:
        title: 🎂 Birthday updated!
        message: "I updated your birthday to **{date}**. I'll use this new date from now on."
        footer: "Use the `/report` command to tell me a bug"

    default-roles:
      subgroup: default
      name: roles
      desc: Keiko warmly welcomes new members by automatically assigning roles when they join the server
      warning: If a role isn't showing up, make sure my role is **above** the role you want to assign to new members 🧑‍⚖️

    stream-elements:
      subgroup: streamelements
      name: commands
      desc: Keiko responds to StreamElements commands here in Discord chat

    setup:
      name: setup
      desc: Keiko shows you all features available and helps you set them up
      embed:
        title: "🐶 Server Setup"
        desc: "Pick what you want to set up and I'll guide you step by step!"
        note: "These are my moderation and notification features. More commands and help live in `/help`!"
        configured: "Configured · {count}"
        pending: "Not set up yet · {count}"
        paused: Paused
        all-configured: "Everything is set up! Use the buttons to fine-tune whatever you like ✨"
        footer: "Use the `/report` command to tell me a bug"
        features:
          welcome-messages: A warm welcome for new members
          default-roles: Roles given to new members automatically
          block-links: Keeps unwanted links out of your server
          twitch: Notifies you when your streamers go live
          youtube: Notifies you when a new video is out
          birthdays: Birthday wishes for your members

  groups:
    moderations: moderations
    notifications: notifications
    integrations: integrations

  command-events:
    enabled:
      title: 🎉 Command enabled successfully!
      key: Enabled
      description: "Command **$command_name** enabled on $date by $user 🚀\n\n
        To make changes or disable it, use the command `/$command_name` or `/$setup_command` 🔄"
      short-description: ✅ Enabled by $user
      short-description-with-cog: ✅ **$cog_name** enabled by $user

    paused:
      title: ⏸️ Command paused successfully!
      key: Paused
      action: Pause
      description: Command **$command_name** paused on $date by $user
      short-description: ⏸️ Paused by $user
      short-description-with-cog: ⏸️ **$cog_name** paused by $user

    unpaused:
      title: ▶️ Command unpaused successfully!
      key: Unpaused
      action: Unpause
      description: Command **$command_name** unpaused on $date by $user
      short-description: ▶️ Unpaused by $user
      short-description-with-cog: ▶️ **$cog_name** unpaused by $user

    disabled:
      title: 🚫 Command disabled successfully!
      action: Disable
      description: Command **$command_name** disabled on $date by $user
      short-description: 🚫 Disabled by $user
      short-description-with-cog: 🚫 **$cog_name** disabled by $user

    edited:
      title: 📝 Command edited successfully!
      description: Command **$command_name** edited on $date by $user
      placeholder: Select the settings you want to edit
      member-picker:
        title: 👤 Select a member to edit
        description: Tell me which member you want to update in this list.
        not-found: Hmm, I don't have anything saved for that member yet. Pick someone already on the list.
      short-description: 📝 Edited by $user
      short-description-with-cog: 📝 **$cog_name** edited by $user

    added:
      title: ➕ Item added to **$command_name** successfully!
      action: Add
      description: An item was added to **$command_name** on $date by $user
      short-description: ➕ Item added by $user
      short-description-with-cog: ➕ **$cog_name** added by $user

    removed:
      title: 🗑️ Item removed from **$command_name** successfully!
      action: Remove
      description: An item was removed from **$command_name** on $date by $user
      placeholder: Select the item you want to remove
      member-picker:
        title: 👤 Select a member to remove
        description: Tell me which member you want to remove from this list.
        not-found: Hmm, I don't have anything saved for that member yet. Pick someone already on the list.
      short-description: 🗑️ Item removed by $user
      short-description-with-cog: 🗑️ **$cog_name** removed by $user

    system:
      description: That's an automatic action I take when leaving the server

  form-notices:
    stale: "Oops! That screen is out of date, here's the current one 🐶"
    busy: "One second! I'm still saving what you just confirmed 🐶"
    closed: "This form is already closed! If you need to change something, just call the command again 🐶"
    expired: "⌛ This form expired! If you'd like to continue, just call the command again 🐶"

  confirmation-modal:
    title: Are you sure?
    desc: Type `$action` to confirm.

  pagination-view:
    footer: Page

  resume:
    settings: Settings
    empty: nothing here yet
    more: "and $count more"

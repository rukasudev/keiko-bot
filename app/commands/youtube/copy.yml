command:
  slash:
    subgroup:
      en-us: youtube
      pt-br: youtube
    name:
      en-us: videos
      pt-br: vídeos
    description:
      en-us: Keiko lets the server know whenever your favorite YouTubers post a new video
      pt-br: Keiko avisa o servidor sempre que seus youtubers favoritos postam um vídeo novo

  setup:
    label:
      en-us: YouTube Videos
      pt-br: YouTube Vídeos
    description:
      en-us: Notifies you when a new video is out
      pt-br: Avisa quando sai um vídeo novo no canal

  stats:
    title:
      en-us: 📊 YouTube Videos Statistics
      pt-br: 📊 Estatísticas de YouTube Vídeos
    delivered:
      one:
        en-us: ✅ I sent 1 new video notification in the last $days days!
        pt-br: ✅ Enviei 1 aviso de vídeo novo nos últimos $days dias!
      other:
        en-us: ✅ I sent $count new video notifications in the last $days days!
        pt-br: ✅ Enviei $count avisos de vídeo novo nos últimos $days dias!

ui:
  # open: error names -> an error block
  errors:
    youtuber_already_registered:
      title:
        en-us: Youtuber Already Registered
        pt-br: Youtuber Já Registrado
      message:
        en-us: I'm sorry, but this youtuber's video notifications are already set up on this server. Pick another youtuber and try again!
        pt-br: Sinto muito, mas a notificação dos vídeos desse youtuber já está configurada neste servidor. Escolha outro youtuber e tente de novo!
    youtuber_not_found:
      title:
        en-us: Youtuber Not Found
        pt-br: Youtuber Não Encontrado
      message:
        en-us: I'm sorry, but I couldn't find the youtuber you're looking for. Please check the name and try again.
        pt-br: Desculpe, mas não consegui encontrar o youtuber que você está procurando. Por favor, verifique o nome e tente novamente.
    preview_needs_youtuber:
      title:
        en-us: YouTuber Required
        pt-br: YouTuber Obrigatório
      message:
        en-us: Oops! You need to pick the YouTuber before I can show the preview. Pick one on the card and try again! 🐶
        pt-br: Ops! Você precisa escolher o youtuber antes de eu mostrar a pré-visualização. Escolha um no card e tente de novo! 🐶

  announcement:
    # open: the value the code gives each field -> its label
    fields:
      description:
        en-us: Description
        pt-br: Descrição
      tags:
        en-us: Tags
        pt-br: Tags
    # open: the part each sample stands for -> the sample a preview draws
    samples:
      title:
        en-us: The video title shows up here
        pt-br: O título do vídeo aparece aqui
      description:
        en-us: Video description here
        pt-br: Descrição do vídeo aqui

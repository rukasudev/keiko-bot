steps:
  - type: intro
    key: form
    title:
      en-us: ▶️ YouTube Videos
      pt-br: ▶️ YouTube Vídeos
    description:
      en-us: Enabling this feature allows me to notify when your favorite youtuber posts a new video!
      pt-br: Ativar esta função faz com que eu notifique quando seu youtuber favorito postar um novo vídeo!
    panel:
      description:
        en-us: I let the server know when these channels post a new video.
        pt-br: Aviso no servidor quando estes canais postam um vídeo novo.

  - type: list
    key: notifications
    title: ${ref.notifications}
    description:
      en-us: "Do you want to add more youtubers? Add more youtubers to be notified when they post a new video! (Max: 2)"
      pt-br: "Deseja adicionar mais youtubers? Adicione mais youtubers para ser notificado quando eles postarem um novo vídeo! (Máx: 2)"
    emoji: ":busts_in_silhouette:"
    items:
      max: 2
      min: 1
      unique:
        key: youtuber
    edit: item
    remove: item
    counter: ${ref.set_up_counter}
    last_item_warning: ${ref.last_channel_warning}
    steps:
      - type: card
        key: notification
        title: ${ref.youtube_channel}
        description:
          en-us: Choose the channel and the youtuber, and I'll let the server know when they post a new video! The message already comes set, change it if you want.
          pt-br: Escolha o canal e o youtuber, e eu aviso no servidor quando ele postar um vídeo novo! A mensagem já vem configurada, mude se quiser.
        emoji: ▶️
        header:
          thumbnail: default
        preview:
          required:
            all: [youtuber]
          error: notifications_youtube_video.ui.errors.preview_needs_youtuber
        required:
          all: [channel, youtuber, mention_roles]
        fields:
          - key: channel
            description:
              en-us: Where I'll announce the new video.
              pt-br: Onde vou avisar do vídeo novo.
          - key: youtuber
            description: ${ref.youtube_channel_name_description}
          - key: mention
            description: ${ref.notification_mention_description}
          - key: mention_roles
            description: ${ref.roles_i_mention_description}
          - key: notification_messages
            description:
              en-us: Up to three messages, I pick one at random each video.
              pt-br: Até três mensagens, eu sorteio uma a cada vídeo.
        sections:
          - type: channel_select
            key: channel
            emoji: 📺
            label: ${ref.text_channel}
            keys:
              value: channel
            screen:
              title: ${ref.notifications_channel_title}
          - type: modal_input
            key: youtuber
            emoji: 🎬
            label: ${ref.youtuber}
            keys:
              value: youtuber
            image: youtuber_avatar
            button:
              label: ${ref.choose_youtuber}
            modal:
              title: ${ref.youtuber}
              validation:
                name: registered_and_found
                # open: the validator's params -> an answer key or a value
                params:
                  item: youtuber
                  service: youtube
                  id: channel_id
                  error: notifications_youtube_video.ui.errors.youtuber
              inputs:
                - key: youtuber
                  label: ${ref.youtube_channel_name}
                  placeholder: ${ref.youtuber_placeholder}
                  max_length: 30
                  normalize:
                    name: handle
            fills:
              into: notification_messages
              # open: {token} names in that text -> a template with {value}
              tokens:
                youtuber: "{value}"
            # open: hidden answer keys -> service.field of the lookup
            lookup_answers:
              youtuber_avatar: youtube.profile_image
          - type: value_select
            key: mention
            emoji: 📣
            label: ${ref.mention}
            keys:
              value: mention
            screen:
              title: ${ref.mention_screen_title}
            placeholder: ${ref.mention_placeholder}
            options:
              - label: ${ref.mention_none}
                value: none
                description: ${ref.mention_none_description}
              - label: ${ref.mention_everyone}
                value: everyone
                description: ${ref.mention_everyone_description}
              - label: ${ref.mention_here}
                value: here
                description: ${ref.mention_here_description}
              - label: ${ref.mention_roles}
                value: roles
                description: ${ref.mention_roles_description}
          - type: selects
            key: mention_roles
            emoji: 🏷️
            label: ${ref.roles_i_mention}
            when:
              key: mention
              is: roles
            screen:
              title: ${ref.roles_i_mention_screen_title}
            selects:
              - type: roles
                key: mention_roles
                emoji: 🏷️
                label: ${ref.roles_i_mention}
                placeholder: ${ref.roles_placeholder}
          - type: modal_input
            key: messages
            emoji: 💬
            label: ${ref.notification_messages}
            description:
              en-us: "One of the messages is picked at random each time. You can use:\n- `{youtuber}`: the youtuber's channel name\n- `{video_link}`: the video link"
              pt-br: "Uma das mensagens é sorteada a cada vez. Você pode usar:\n- `{youtuber}`: o nome do canal do youtuber\n- `{video_link}`: o link do vídeo"
            keys:
              value: notification_messages
            button:
              label: ${ref.edit_messages}
            format: code_block
            modal:
              title: ${ref.notification_messages}
              inputs:
                - label: ${ref.random_message_1}
                  max_length: 100
                  multiline: true
                  normalize:
                    name: without_group_mentions
                - label: ${ref.random_message_2}
                  max_length: 100
                  required: false
                  multiline: true
                  normalize:
                    name: without_group_mentions
                - label: ${ref.random_message_3}
                  max_length: 100
                  required: false
                  multiline: true
                  normalize:
                    name: without_group_mentions
        # open: state keys of the card -> a value or a text
        defaults:
          mention: everyone
          notification_messages:
            en-us: "{youtuber} just posted a new video!"
            pt-br: "{youtuber} acabou de postar um novo vídeo!"

  - type: review
    key: confirm
    preview: true

# open: fact names -> a fact the code passes
facts:
  configures:
    type: boolean
    description: Whether the reader of the command list may configure Keiko in the server.
  ping:
    type: number
    description: Keiko's latency to Discord, in milliseconds.

command:
  slash:
    name:
      en-us: help
      pt-br: ajuda
    description:
      en-us: Keiko helps you understand how to use the available commands
      pt-br: Keiko ajuda você a entender como usar os comandos disponíveis
    # open: the folder's other app commands -> a SlashCommand
    commands:
      ping:
        name:
          en-us: ping
          pt-br: ping
        description:
          en-us: Keiko shows you what your current response time is
          pt-br: Keiko mostra qual o seu tempo de resposta atual

ui:
  # open: text names -> a text, or a table of texts
  texts:
    # open: the barks Keiko may answer a mention with -> a text
    woof:
      once:
        en-us: WOOF!
        pt-br: WOOF!
      twice:
        en-us: WOOF WOOF!
        pt-br: WOOF WOOF!

  # open: list names -> a Records list
  records:
    commands:
      title:
        en-us: 📚 Available commands
        pt-br: 📚 Comandos disponíveis
      description:
        en-us: "Here are my commands that will help you make your server more cozy! ✨\n\nTaking care of this server? Use `${context.commands.setup}` to turn on and adjust my features! ⚙️\n\nSelect a command below to see its description and run it directly ⬇️"
        pt-br: "Aqui estão meus comandos que irão te ajudar a deixar seu servidor mais aconchegante! ✨\n\nCuida deste servidor? Use `${context.commands.setup}` para ativar e ajustar minhas funcionalidades! ⚙️\n\nSelecione um comando abaixo para ver sua descrição e executá-lo diretamente ⬇️"
      placeholder:
        en-us: Select a command
        pt-br: Selecione um comando
      detail:
        title:
          en-us: 📚 Command description
          pt-br: 📚 Descrição do comando
        description:
          en-us: "If you need more information about a specific command, don't hesitate to send us a message on my official server with the `${context.commands.support}` command! 💌\n\n"
          pt-br: "Se você precisar de mais informações sobre um comando específico, é só me chamar no meu servidor oficial com o comando `${context.commands.support}`! 💌\n\n"
      overrides:
        - when:
            key: help.facts.configures
            is: false
          description:
            en-us: "Here are my commands that will help you make your server more cozy! ✨\n\nSelect a command below to see its description ⬇️"
            pt-br: "Aqui estão meus comandos que irão te ajudar a deixar seu servidor mais aconchegante! ✨\n\nSelecione um comando abaixo para ver sua descrição ⬇️"
      # open: record parts -> a line template
      lines:
        general:
          en-us: 🧰 General commands
          pt-br: 🧰 Comandos gerais
        menus:
          en-us: 🖱️ Message apps
          pt-br: 🖱️ Apps de mensagem
        menus_path:
          en-us: "Right-click a message (or long-press it on mobile), then go to **Apps** → **Keiko**:"
          pt-br: "Clique com o botão direito numa mensagem (ou segure ela no celular) e vá em **Apps** → **Keiko**:"
        setup:
          en-us: ⚙️ Setup
          pt-br: ⚙️ Configuração
        group:
          en-us: $emoji $name
          pt-br: $emoji $name
        slash_command:
          en-us: ":flying_disc: `$name`"
          pt-br: ":flying_disc: `$name`"
        message_command:
          en-us: ":flying_disc: **$name**"
          pt-br: ":flying_disc: **$name**"
        picked:
          en-us: ✨ $name
          pt-br: ✨ $name

  # open: response names -> a Response
  responses:
    ping:
      title:
        en-us: 🏓 Pong!
        pt-br: 🏓 Pong!
      description:
        en-us: My current latency is **$ping ms** 🐾
        pt-br: Minha latência atual é de **$ping ms** 🐾
      footer: null

  # open: button names -> a ButtonCopy
  buttons:
    execute:
      label:
        en-us: Execute
        pt-br: Executar

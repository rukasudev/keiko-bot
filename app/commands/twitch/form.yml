steps:
  - type: intro
    key: form
    title:
      en-us: 📡 Twitch Lives
      pt-br: 📡 Twitch Lives
    description:
      en-us: Enabling this feature allows me to notify when your favorite streamer is online on Twitch!
      pt-br: Ativar esta função faz com que eu notifique quando seu streamer favorito estiver online na Twitch!
    panel:
      description: ${ref.streamers_panel_description}

  - type: list
    key: notifications
    title: ${ref.notifications}
    description:
      en-us: "Do you want to add more streamers? Add more streamers to be notified when they are online on Twitch! (Max: 3)"
      pt-br: "Deseja adicionar mais streamers? Adicione mais streamers para ser notificado quando eles estiverem online na Twitch! (Max: 3)"
    emoji: ":busts_in_silhouette:"
    items:
      max: 3
      min: 1
      unique:
        key: streamer
    edit: item
    remove: item
    counter: ${ref.set_up_counter}
    last_item_warning: ${ref.last_streamer_warning}
    steps:
      - type: card
        key: notification
        title:
          en-us: Twitch Streamer
          pt-br: Streamer da Twitch
        description: ${ref.streamer_card_description}
        emoji: 📡
        header:
          thumbnail: default
        preview:
          required:
            all: [streamer]
          error: notifications_twitch.ui.errors.preview_needs_streamer
        required:
          all: [channel, streamer, mention_roles]
        fields:
          - key: channel
            description: ${ref.live_channel_description}
          - key: streamer
            description:
              en-us: The streamer's Twitch nick (with or without @).
              pt-br: O nick do streamer na Twitch (com ou sem @).
          - key: mention
            description: ${ref.notification_mention_description}
          - key: mention_roles
            description: ${ref.roles_i_mention_description}
          - key: notification_messages
            description: ${ref.live_messages_description}
        sections:
          - type: channel_select
            key: channel
            emoji: 📺
            label: ${ref.text_channel}
            keys:
              value: channel
            screen:
              title: ${ref.notifications_channel_title}
          - type: modal_input
            key: streamer
            emoji: 🎮
            label: ${ref.streamer}
            keys:
              value: streamer
            image: streamer_avatar
            button:
              label: ${ref.choose_streamer}
            modal:
              title: ${ref.streamer}
              validation:
                name: registered_and_found
                # open: the validator's params -> an answer key or a value
                params:
                  item: streamer
                  service: twitch
                  id: user_id
                  error: streamer
              inputs:
                - key: streamer
                  label:
                    en-us: Streamer's Twitch nick (with or without @)
                    pt-br: O nick do streamer na Twitch (com ou sem @)
                  placeholder:
                    en-us: e.g. @shroud
                    pt-br: "ex: @shroud"
                  max_length: 30
                  normalize:
                    name: handle
            fills:
              into: notification_messages
              # open: {token} names in that text -> a template with {value}
              tokens:
                streamer: "{value}"
                stream_link: https://twitch.tv/{value}
            # open: hidden answer keys -> service.field of the lookup
            lookup_answers:
              streamer_avatar: twitch.profile_image
          - type: value_select
            key: mention
            emoji: 📣
            label: ${ref.mention}
            keys:
              value: mention
            screen:
              title: ${ref.mention_screen_title}
            placeholder: ${ref.mention_placeholder}
            options:
              - label: ${ref.mention_none}
                value: none
                description: ${ref.mention_none_description}
              - label: ${ref.mention_everyone}
                value: everyone
                description: ${ref.mention_everyone_description}
              - label: ${ref.mention_here}
                value: here
                description: ${ref.mention_here_description}
              - label: ${ref.mention_roles}
                value: roles
                description: ${ref.mention_roles_description}
          - type: selects
            key: mention_roles
            emoji: 🏷️
            label: ${ref.roles_i_mention}
            when:
              key: mention
              is: roles
            screen:
              title: ${ref.roles_i_mention_screen_title}
            selects:
              - type: roles
                key: mention_roles
                emoji: 🏷️
                label: ${ref.roles_i_mention}
                placeholder: ${ref.roles_placeholder}
          - type: modal_input
            key: messages
            emoji: 💬
            label: ${ref.notification_messages}
            description:
              en-us: "One of the messages is picked at random each time. You can use:\n- `{streamer}`: the streamer's nick\n- `{stream_link}`: the live link"
              pt-br: "Uma das mensagens é sorteada a cada vez. Você pode usar:\n- `{streamer}`: o nick do streamer\n- `{stream_link}`: o link da live"
            keys:
              value: notification_messages
            button:
              label: ${ref.edit_messages}
            format: code_block
            modal:
              title: ${ref.notification_messages}
              inputs:
                - label: ${ref.random_message_1}
                  max_length: 100
                  multiline: true
                  normalize:
                    name: without_group_mentions
                - label: ${ref.random_message_2}
                  max_length: 100
                  required: false
                  multiline: true
                  normalize:
                    name: without_group_mentions
                - label: ${ref.random_message_3}
                  max_length: 100
                  required: false
                  multiline: true
                  normalize:
                    name: without_group_mentions
        # open: state keys of the card -> a value or a text
        defaults:
          mention: everyone
          notification_messages: ${ref.streamer_live_message}

  - type: review
    key: confirm
    preview: true

steps:
  - type: intro
    key: form
    title:
      en-us: 🎂 Birthday Reminders
      pt-br: 🎂 Lembretes de Aniversário
    description:
      en-us: "Set up how I'll celebrate birthdays in this server!\n\nAfter saving, you add the birthdays with the **➕ Add** button of `/${context.command}`, or each member adds their own with `/birthday`."
      pt-br: "Configure como eu vou comemorar os aniversários deste servidor!\n\nDepois de salvar, você cadastra os aniversários com o botão **➕ Adicionar** do `/${context.command}`, ou cada membro cadastra o seu com `/aniversário`."
    panel:
      description:
        en-us: I celebrate the members' birthdays with the settings below.
        pt-br: Comemoro o aniversário dos membros com as configurações abaixo.

  - type: card
    key: birthday_config
    title:
      en-us: Birthday reminder settings
      pt-br: Configuração do lembrete de aniversário
    description:
      en-us: Choose the channel, time, mention behavior and the default message for birthday reminders.
      pt-br: Escolha o canal, horário, menção e mensagem padrão dos lembretes de aniversário.
    emoji: 🎂
    header:
      title:
        en-us: Reminder Settings
        pt-br: Configuração do Lembrete
      thumbnail: cake
    required:
      all: [channel, timezone, notification_time]
    group: settings
    fields:
      - key: channel
        description:
          en-us: Pick the channel where I'll send birthday reminders.
          pt-br: Escolha o canal onde vou enviar os lembretes de aniversário.
      - key: timezone
        description:
          en-us: Choose the timezone used to calculate the notification time.
          pt-br: Escolha o fuso horário usado para calcular o horário da notificação.
      - key: notification_time
        description:
          en-us: Choose when I'll send the birthday notification.
          pt-br: Escolha em qual horário vou enviar a notificação de aniversário.
      - key: mention_everyone
        description:
          en-us: Decide whether birthday reminders should mention @everyone.
          pt-br: Escolha se os lembretes de aniversário devem mencionar @everyone.
      - key: default_message_mode
        description:
          en-us: Customize the default message used when a member has no custom message.
          pt-br: Personalize a mensagem padrão usada quando um membro não tiver mensagem própria.
      - key: default_message_title
        label:
          en-us: Default message title
          pt-br: Título da mensagem padrão
        hidden: true
      - key: default_message_content
        label:
          en-us: Default message content
          pt-br: Conteúdo da mensagem padrão
        hidden: true
    sections:
      - type: channel_select
        key: channel
        emoji: 📺
        label: ${ref.channel}
        keys:
          value: channel
        screen:
          title:
            en-us: Choose the birthday channel
            pt-br: Escolha o canal de aniversário
      - type: value_select
        key: timezone
        emoji: 🌎
        label:
          en-us: Timezone
          pt-br: Fuso horário
        keys:
          value: timezone
        screen:
          title:
            en-us: Choose the notification timezone
            pt-br: Escolha o fuso horário da notificação
        placeholder:
          en-us: Choose timezone
          pt-br: Escolher fuso horário
        options:
          - label:
              en-us: 🇧🇷 Brazil (UTC-3)
              pt-br: 🇧🇷 Brasil (UTC-3)
            value: America/Sao_Paulo
          - label:
              en-us: 🇦🇷 Argentina (UTC-3)
              pt-br: 🇦🇷 Argentina (UTC-3)
            value: America/Argentina/Buenos_Aires
          - label:
              en-us: 🇺🇸 United States (UTC-5/UTC-4)
              pt-br: 🇺🇸 Estados Unidos (UTC-5/UTC-4)
            value: America/New_York
          - label:
              en-us: 🇵🇹 Portugal (UTC+0/UTC+1)
              pt-br: 🇵🇹 Portugal (UTC+0/UTC+1)
            value: Europe/Lisbon
          - label:
              en-us: 🇬🇧 United Kingdom (UTC+0/UTC+1)
              pt-br: 🇬🇧 Reino Unido (UTC+0/UTC+1)
            value: Europe/London
          - label:
              en-us: 🇪🇸 Spain (UTC+1/UTC+2)
              pt-br: 🇪🇸 Espanha (UTC+1/UTC+2)
            value: Europe/Madrid
          - label:
              en-us: 🇩🇪 Germany (UTC+1/UTC+2)
              pt-br: 🇩🇪 Alemanha (UTC+1/UTC+2)
            value: Europe/Berlin
          - label:
              en-us: 🇯🇵 Japan (UTC+9)
              pt-br: 🇯🇵 Japão (UTC+9)
            value: Asia/Tokyo
          - label:
              en-us: 🌐 UTC (UTC+0)
              pt-br: 🌐 UTC (UTC+0)
            value: UTC
      - type: button_options
        key: notification_time
        emoji: 🕒
        label:
          en-us: Notification time
          pt-br: Horário da notificação
        keys:
          value: notification_time
        screen:
          title:
            en-us: Choose the notification time
            pt-br: Escolha o horário da notificação
        placeholder:
          en-us: Choose time
          pt-br: Escolher horário
        options:
          - label:
              en-us: "08:00"
              pt-br: "08:00"
            value: "08:00"
          - label:
              en-us: "10:00"
              pt-br: "10:00"
            value: "10:00"
          - label:
              en-us: "12:00"
              pt-br: "12:00"
            value: "12:00"
          - label:
              en-us: "14:00"
              pt-br: "14:00"
            value: "14:00"
          - label:
              en-us: "16:00"
              pt-br: "16:00"
            value: "16:00"
          - label:
              en-us: "18:00"
              pt-br: "18:00"
            value: "18:00"
          - label:
              en-us: "20:00"
              pt-br: "20:00"
            value: "20:00"
          - label:
              en-us: "22:00"
              pt-br: "22:00"
            value: "22:00"
      - type: boolean_toggle
        key: mention_everyone
        emoji: 📣
        label:
          en-us: Mention @everyone
          pt-br: Mencionar @everyone
        keys:
          value: mention_everyone
      - type: title_content
        key: default_message
        emoji: 💬
        label:
          en-us: Default member message
          pt-br: Mensagem padrão dos membros
        keys:
          mode: default_message_mode
          title: default_message_title
          description: default_message_content
        button:
          label:
            en-us: Customize message
            pt-br: Personalizar mensagem
        modal:
          title:
            en-us: Customize Default Message
            pt-br: Personalizar Mensagem Padrão
          labels:
            title: ${ref.title}
            description:
              en-us: Content
              pt-br: Conteúdo
        default: reminders_birthday.ui.announcement.defaults
    # open: state keys of the card -> a value or a text
    defaults:
      mention_everyone: false
      default_message_mode: default

  - type: list
    key: reminders_birthday
    title:
      en-us: Birthday List
      pt-br: Lista de Aniversários
    description:
      en-us: "Build the server birthday list one member at a time. After saving, use Add to include more members. (Max: 25)"
      pt-br: "Monte a lista de aniversários do servidor um membro por vez. Depois de salvar, use Adicionar para incluir mais membros. (Máx: 25)"
    emoji: 🎉
    appears_in: panel
    items:
      max: 25
      unique:
        key: user
        immutable: true
    search:
      screen:
        title:
          en-us: 🎉 Birthday settings for $item
          pt-br: 🎉 Configurações de aniversário de $item
    group: summary
    steps:
      - type: card
        key: birthday_member_config
        title:
          en-us: Member reminder settings
          pt-br: Configuração do lembrete do membro
        description:
          en-us: Pick the member, then set up the date, the message and the image of their birthday.
          pt-br: Escolha o membro e configure a data, a mensagem e a imagem do aniversário.
        emoji: 🎂
        header:
          title:
            en-us: Member Reminder
            pt-br: Lembrete do Membro
          thumbnail: cake
        preview:
          # open: preview tokens -> an answer or a context value
          tokens:
            user:
              answer: user
              format: user
            server:
              context: server_name
            date:
              answer: date
              format: month_day
        required:
          all: [user, month, day]
        transform:
          name: mm_dd_date_parts
        fields:
          - key: user
          - key: month
            hidden: true
          - key: day
            hidden: true
          - key: date
            label:
              en-us: Birthday
              pt-br: Dia do aniversário
            emoji: 📅
            format: month_day
          - key: use_custom_message
            label:
              en-us: Custom message
              pt-br: Mensagem personalizada
            format: customized
          - key: custom_message_title
            label:
              en-us: Message title
              pt-br: Título da mensagem
            hidden: true
          - key: custom_message_content
            label:
              en-us: Message content
              pt-br: Conteúdo da mensagem
            hidden: true
          - key: use_custom_image
            label: ${ref.custom_image}
            format: customized
          - key: custom_image
            label: ${ref.custom_image}
            hidden: true
        sections:
          - type: user_select
            key: member
            emoji: 👤
            label:
              en-us: Member
              pt-br: Membro
            keys:
              value: user
            screen:
              title:
                en-us: Choose the member
                pt-br: Escolha o membro
            avatar: true
          - type: value_select
            key: month
            emoji: 📅
            label:
              en-us: Birthday month
              pt-br: Mês do aniversário
            keys:
              value: month
            screen:
              title:
                en-us: Choose the birthday month
                pt-br: Escolha o mês do aniversário
            placeholder:
              en-us: Choose month
              pt-br: Selecionar mês
            options:
              - label:
                  en-us: January
                  pt-br: Janeiro
                value: "01"
              - label:
                  en-us: February
                  pt-br: Fevereiro
                value: "02"
              - label:
                  en-us: March
                  pt-br: Março
                value: "03"
              - label:
                  en-us: April
                  pt-br: Abril
                value: "04"
              - label:
                  en-us: May
                  pt-br: Maio
                value: "05"
              - label:
                  en-us: June
                  pt-br: Junho
                value: "06"
              - label:
                  en-us: July
                  pt-br: Julho
                value: "07"
              - label:
                  en-us: August
                  pt-br: Agosto
                value: "08"
              - label:
                  en-us: September
                  pt-br: Setembro
                value: "09"
              - label:
                  en-us: October
                  pt-br: Outubro
                value: "10"
              - label:
                  en-us: November
                  pt-br: Novembro
                value: "11"
              - label:
                  en-us: December
                  pt-br: Dezembro
                value: "12"
            dependents:
              - key: day
                validation:
                  name: date
                  # open: the validator's params -> an answer key or a value
                  params:
                    month: month
          - type: modal_input
            key: day
            emoji: 🗓️
            label:
              en-us: Birthday day
              pt-br: Dia do aniversário
            keys:
              value: day
            button:
              label:
                en-us: Choose day
                pt-br: Selecionar dia
            modal:
              title:
                en-us: Birthday Day
                pt-br: Dia do Aniversário
              validation:
                name: date
                # open: the validator's params -> an answer key or a value
                params:
                  month: month
              inputs:
                - key: day
                  label:
                    en-us: Day
                    pt-br: Dia
                  placeholder:
                    en-us: "15"
                    pt-br: "15"
                  max_length: 2
          - type: title_content
            key: message
            emoji: 💬
            label:
              en-us: Message
              pt-br: Mensagem
            keys:
              mode: use_custom_message
              title: custom_message_title
              description: custom_message_content
            button:
              label:
                en-us: Customize message
                pt-br: Personalizar mensagem
            modal:
              title:
                en-us: Customize Message
                pt-br: Personalizar Mensagem
              labels:
                title: ${ref.title}
                description:
                  en-us: Content
                  pt-br: Conteúdo
            default: reminders_birthday.ui.announcement.defaults
          - type: file_upload
            key: image
            emoji: 🖼️
            label:
              en-us: Image
              pt-br: Imagem
            keys:
              mode: use_custom_image
              image: custom_image
            button:
              label:
                en-us: Customize image
                pt-br: Personalizar imagem
            modal:
              title:
                en-us: Custom Image
                pt-br: Imagem Personalizada
        # open: state keys of the card -> a value or a text
        defaults:
          use_custom_message: default
          use_custom_image: default

  - type: review
    key: confirm
    preview: true
    info:
      en-us: Once you confirm below, you can create the members' birthday reminders on the next screen. Or, if you prefer, each member can add their own birthday with `/birthday`!
      pt-br: Ao confirmar no botão abaixo, você poderá criar os lembretes de aniversário dos membros do servidor na tela seguinte. Se preferir, cada membro também pode cadastrar o próprio aniversário com `/aniversário`!

# open: group ids -> a panel group
groups:
  settings:
    title:
      en-us: Reminder Settings
      pt-br: Configuração do Lembrete
    emoji: ⚙️
    opens: button
    button:
      label: ${ref.configure}
  summary:
    title:
      en-us: Reminders Summary
      pt-br: Resumo dos Lembretes

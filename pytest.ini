[pytest]
testpaths = tests app
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -v --tb=short

# Markers
markers =
    unit: Testes unitarios (sem I/O)
    integration: Testes de integracao (com banco real)
    behavioral: Cenarios de fluxo completo do form engine (offline, tests/behavioral/)
    shared_contract(name): Contrato de componente compartilhado (ex.: manager_form, form_engine)
    regression: Cenario permanente protegendo um bug ja corrigido

# Filtrar warnings
filterwarnings =
    ignore::DeprecationWarning

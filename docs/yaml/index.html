/* Layout: a sticky bar picks the type, the view and the language; the Reference reads one object at a time with its children opening in place beside a real file, the Tree shows the whole file at once beside a detail panel. */

}

    color-scheme: dark;
  }
}

  --bg: #0e1218; --surface: #151a22; --surface-2: #1c232e; --fg: #e5e9f0; --fg-2: #b3bdca; --muted: #8893a3;
  --line: #283140; --line-2: #384354; --accent: #6ea8ff; --accent-soft: #1b2a43; --on-accent: #0e1218;
  --ink: #e5e9f0; --on-ink: #0e1218; --code-bg: #11161d; --val: #f0b27a; --hl: #3a3317; --warn: #f0c35a; --warn-soft: #362a0c;
  --ex-bg: #0a0e14; --ex-fg: #d7deea; --ex-muted: #6f7c91; --ex-key: #8fc1ff; --ex-val: #f2c58b; --ex-hl: #1f2b40; --ex-hl-line: #f2c94c;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 24px rgba(0, 0, 0, .3);
  --r-identity: #a7b2c4; --r-copy: #ab9bff; --r-visual: #f28fc7; --r-behavior: #ff9b68; --r-conditions: #e3c352; --r-structure: #4fd0bf; --r-data: #91d56c; --r-other: #8f99aa;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.wrap { max-width: 1480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, kbd, pre { font-family: var(--font-mono); }
.d code, .ic { font-family: var(--font-mono); font-size: .86em; background: var(--code-bg); border: 1px solid var(--line); padding: 0 .3em; border-radius: 4px; overflow-wrap: anywhere; }
a { color: var(--accent); }
h1, h2, h3, h4 { text-wrap: balance; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

.role-identity { --rc: var(--r-identity); }
.role-copy { --rc: var(--r-copy); }
.role-visual { --rc: var(--r-visual); }
.role-behavior { --rc: var(--r-behavior); }
.role-conditions { --rc: var(--r-conditions); }
.role-data { --rc: var(--r-data); }
.role-structure { --rc: var(--r-structure); }
.role-other { --rc: var(--r-other); }
.role-none { --rc: var(--muted); }

.rc { display: inline-flex; align-items: center; gap: 5px; font: 600 11.5px/1 var(--font-body); letter-spacing: .01em; color: var(--rc); background: color-mix(in srgb, var(--rc) 12%, transparent); padding: 4px 8px 4px 7px; border-radius: 999px; white-space: nowrap; }
.rc i { width: 7px; height: 7px; border-radius: 50%; background: var(--rc); flex: none; }
button.rc { border: 1px solid transparent; cursor: pointer; }
button.rc[aria-pressed="true"] { border-color: var(--rc); background: color-mix(in srgb, var(--rc) 22%, transparent); }
button.rc.off { opacity: .45; }
.tm { display: inline-flex; align-items: center; gap: 5px; font: 500 11px/1 var(--font-mono); color: var(--fg-2); border: 1px solid var(--line-2); border-radius: 5px; padding: 3px 6px; white-space: nowrap; background: var(--surface); }
.tm b { font-weight: 700; color: var(--muted); }
.rq { display: inline-block; font: 700 10.5px/1 var(--font-body); letter-spacing: .05em; text-transform: uppercase; color: var(--on-ink); background: var(--ink); padding: 3px 6px; border-radius: 4px; white-space: nowrap; }
.op { font: 600 10.5px/1 var(--font-body); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.sh { font: 600 10.5px/1 var(--font-body); letter-spacing: .04em; text-transform: uppercase; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 4px; padding: 2px 5px; white-space: nowrap; }
.untr { font: 700 9.5px/1 var(--font-body); letter-spacing: .05em; color: var(--warn); background: var(--warn-soft); border-radius: 3px; padding: 2px 4px; vertical-align: 1px; margin-left: 6px; }
.missing { color: var(--warn); font-style: italic; }
.df { font-size: 12.5px; color: var(--muted); }
.df code { color: var(--fg-2); }
.tl { font: 12.5px/1.5 var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }
.lk { color: var(--accent); text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; cursor: pointer; background: none; border: 0; padding: 0; font: inherit; font-family: var(--font-mono); }
.tl .lk { color: var(--fg-2); }
.tl .lk:hover { color: var(--accent); }
.tl .lit { color: var(--val); }
.tl .sep { opacity: .5; margin: 0 .25em; }
.tl .by, .tl .nul { opacity: .75; }
.crumb { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; font: 12.5px/1.5 var(--font-mono); color: var(--muted); min-width: 0; }
.crumb .s { color: var(--fg-2); overflow-wrap: anywhere; }
.crumb .s.k { color: var(--accent); }
.crumb .s.f { color: var(--fg); font-weight: 600; }
.crumb .x { opacity: .5; }
.crumb button.s { background: none; border: 0; padding: 0; cursor: pointer; font: inherit; }
.crumb button.s:hover { text-decoration: underline; }
.code-snip { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: 12px/1.6 var(--font-mono); overflow-x: auto; white-space: pre; color: var(--fg-2); max-width: 100%; }
.src { font: 11.5px/1.4 var(--font-mono); color: var(--muted); margin: 4px 0 0; overflow-wrap: anywhere; }
.note { font-size: 13px; color: var(--muted); }
.eyebrow { font: 600 11.5px/1 var(--font-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0; }
.btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 6px 11px; font: 600 12.5px var(--font-body); cursor: pointer; color: var(--fg-2); display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn svg { width: 14px; height: 14px; }
.pend { color: var(--warn); }

/* bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar-in { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto; min-width: 0; text-decoration: none; color: var(--fg); }
.brand b { font: 700 17px/1.2 var(--font-body); letter-spacing: -.01em; white-space: nowrap; }
.brand span { font: 12.5px var(--font-mono); color: var(--muted); white-space: nowrap; }
.ctl { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); min-width: 0; }
.ctl select { padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); font: 600 12.5px var(--font-mono); color: var(--fg); max-width: 220px; min-width: 0; }
.segc { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; background: var(--surface); }
.segc button { border: 0; background: none; padding: 5px 11px; font: 600 12.5px var(--font-body); cursor: pointer; color: var(--fg-2); }
.segc button + button { border-left: 1px solid var(--line-2); }
.segc button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; padding-block: 12px 4px; }
.legend .grp { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.legend .lab { font: 600 11px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
#stage { padding-block: 18px 72px; min-height: 60vh; }

/* overview */
.ov h1 { font: 700 clamp(26px, 3.2vw, 36px)/1.1 var(--font-body); letter-spacing: -.015em; margin: 10px 0 8px; }
.ov .lede { color: var(--fg-2); max-width: 72ch; margin: 0 0 20px; font-size: 15.5px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.card { display: flex; flex-direction: column; gap: 6px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px 16px; cursor: pointer; color: var(--fg); min-width: 0; }
.card:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.card b { font: 600 15px var(--font-mono); }
.card code { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.card .d { color: var(--fg-2); font-size: 13.5px; margin: 0; }
.card .st { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); margin-top: auto; }
.ov h2 { font: 700 13px/1 var(--font-body); letter-spacing: .06em; text-transform: uppercase; margin: 32px 0 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line-2); }
.mean { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 8px 20px; margin: 0; }
.mean div { display: flex; gap: 10px; align-items: baseline; min-width: 0; }
.mean dt { flex: none; }
.mean dd { margin: 0; color: var(--fg-2); font-size: 13.5px; min-width: 0; }
.rules { margin: 0; padding-left: 20px; color: var(--fg-2); max-width: 72ch; }
.rules li { margin: 4px 0; }

/* Reference */
.A { display: grid; grid-template-columns: 210px minmax(0, 1fr) minmax(0, 430px); gap: 32px; align-items: start; }
.A-nav { position: sticky; top: var(--top); max-height: calc(100vh - var(--top) - 16px); overflow: auto; font-size: 13.5px; padding: 0 4px 16px 0; }
.A-nav h4 { font: 600 11px/1.3 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px 8px; }
.A-nav h4:first-child { margin-top: 2px; }
.A-nav button { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; width: 100%; border: 0; background: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; text-align: left; color: var(--fg-2); font: 13px/1.35 var(--font-mono); }
.A-nav button span { flex: 0 0 auto; max-width: 100%; overflow-wrap: anywhere; }
.A-nav button small { flex: 1 1 0; min-width: 0; font: 11px var(--font-body); color: var(--muted); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.A-nav button:hover { background: var(--surface-2); }
.A-nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.A-navsel { display: none; width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); font: 13px var(--font-mono); color: var(--fg); margin-bottom: 12px; }
.A-main { min-width: 0; }
.A-main h2 { font: 700 28px/1.15 var(--font-body); letter-spacing: -.01em; margin: 8px 0 6px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; overflow-wrap: anywhere; min-width: 0; }
.A-main h2 .tagk { font: 600 13px var(--font-mono); color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 6px; }
.A-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.A-lede { color: var(--fg-2); font-size: 16px; margin: 0 0 10px; max-width: 66ch; }
.A-facts { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; font-size: 13.5px; margin: 14px 0 4px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; color: var(--fg-2); }
.facts ul { margin: 0; padding: 0; list-style: none; }
.facts li + li { margin-top: 4px; }
.callout { border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); background: var(--warn-soft); border-radius: 10px; padding: 12px 14px; margin-top: 18px; color: var(--fg); }
.A-h3 { font: 700 13px/1 var(--font-body); letter-spacing: .06em; text-transform: uppercase; margin: 26px 0 0; padding-bottom: 10px; border-bottom: 1px solid var(--line-2); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 12px; }
.A-h3 span { font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--muted); font-size: 12.5px; }
.A-grp-h { display: flex; align-items: center; gap: 8px; margin: 18px 0 0; padding: 0 0 8px; font: 700 11px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--rc); border-bottom: 1px solid var(--line); }
.A-grp-h i { width: 8px; height: 8px; border-radius: 2px; background: var(--rc); }
.A-grp-h em { font-style: normal; color: var(--muted); font-weight: 600; letter-spacing: 0; }
.A-row { padding: 14px 10px 14px 12px; border-bottom: 1px solid var(--line); position: relative; }
.A-row::before { content: ""; position: absolute; left: 0; top: 16px; width: 3px; height: 16px; border-radius: 2px; background: var(--rc); opacity: .9; }
.A-row.hot { background: color-mix(in srgb, var(--accent) 6%, transparent); }
.A-row.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 40% { background: var(--hl); } 100% { background: transparent; } }
.A-h { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.A-n { font: 600 14.5px var(--font-mono); color: var(--fg); overflow-wrap: anywhere; }
.A-row.hot > .A-h .A-n { color: var(--accent); }
.A-tree { margin-left: auto; border: 1px solid transparent; background: none; color: var(--muted); border-radius: 6px; padding: 2px 4px; cursor: pointer; display: inline-grid; place-items: center; }
.A-tree svg { width: 15px; height: 15px; }
.A-tree:hover { color: var(--accent); border-color: var(--line-2); }
.A-d { margin: 6px 0 0; color: var(--fg-2); font-size: 14.5px; max-width: 68ch; }
.A-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-size: 12.5px; color: var(--muted); }
.A-meta code { font-size: 12px; color: var(--fg-2); overflow-wrap: anywhere; }
.A-tog { margin-top: 10px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 4px 12px 4px 9px; font: 600 12.5px var(--font-body); cursor: pointer; color: var(--fg-2); display: inline-flex; gap: 6px; align-items: center; }
.A-tog:hover { border-color: var(--accent); color: var(--accent); }
.A-tog::before { content: "+"; font: 700 13px var(--font-mono); width: 12px; text-align: center; }
.A-tog[aria-expanded="true"]::before { content: "\2212"; }
.A-kids { margin: 12px 0 0 1px; padding: 10px 0 0 16px; border-left: 2px solid var(--line-2); }
.A-kcrumb { padding: 2px 0 4px; font-size: 12px; }
.A-picks { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.A-pick { border: 1px solid var(--line-2); background: var(--surface); border-radius: 6px; padding: 3px 8px; font: 12.5px var(--font-mono); cursor: pointer; color: var(--fg-2); }
.A-pick:hover { border-color: var(--accent); }
.A-pick[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.A-mdesc { font-size: 13.5px; color: var(--muted); margin: 6px 0 0; }
.A-rec { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
.A-rec button { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font: inherit; text-decoration: underline; }
.A-kids .A-grp-h { margin-top: 10px; font-size: 10.5px; }
.A-kids .A-row { padding-block: 11px; }
.A-kids .A-d { font-size: 14px; }
.A-ex { position: sticky; top: var(--top); min-width: 0; }
.A-ex-in { background: var(--ex-bg); color: var(--ex-fg); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; max-height: calc(100vh - var(--top) - 16px); box-shadow: var(--shadow); }
.A-ex-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,.08); font: 600 12px var(--font-body); color: var(--ex-fg); }
.A-ex-h code { font: 11.5px var(--font-mono); color: var(--ex-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.A-note { padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,.08); font-size: 12.5px; color: var(--ex-fg); background: rgba(255,255,255,.03); }
.A-note pre { margin: 8px 0 0; font: 11.5px/1.55 var(--font-mono); color: var(--ex-val); white-space: pre; overflow-x: auto; }
.A-note .src { color: var(--ex-muted); }
.A-code { margin: 0; overflow: auto; font: 12px/1.62 var(--font-mono); padding: 8px 0 12px; flex: 1 1 auto; min-height: 120px; }
.cl { display: block; padding-right: 14px; white-space: pre; color: var(--ex-fg); }
.cl i { display: inline-block; width: 4.2ch; text-align: right; color: var(--ex-muted); margin-right: 14px; font-style: normal; user-select: none; }
.cl .k { color: var(--ex-key); }
.cl .v { color: var(--ex-val); }
.cl .cm { color: var(--ex-muted); font-style: italic; }
.cl.hl { background: var(--ex-hl); }
.cl.hl0 { box-shadow: inset 3px 0 var(--ex-hl-line); }
.A-hint { padding: 8px 14px; font-size: 12px; color: var(--ex-muted); border-top: 1px solid rgba(255,255,255,.08); }
@media (max-width: 1200px) {
  .A { grid-template-columns: minmax(0, 1fr) minmax(0, 380px); gap: 24px; }
  .A-nav { display: none; }
  .A-navsel { display: block; }
}
@media (max-width: 820px) {
  .A { grid-template-columns: minmax(0, 1fr); }
  .A-ex { position: static; }
  .A-ex-in { max-height: 60vh; }
  .A-main h2 { font-size: 24px; }
  .bar { position: static; }
}

/* Tree */
.C { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.C-tools { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.C-search { flex: 1 1 220px; max-width: 340px; min-width: 0; }
.C-search input { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); color: var(--fg); font: 13px var(--font-mono); }
.C-roles { display: flex; flex-wrap: wrap; gap: 5px; }
.C-results { grid-column: 1 / -1; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px; max-height: 240px; overflow: auto; }
.C-results button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 4px 8px; border-radius: 6px; font: 12.5px/1.4 var(--font-mono); color: var(--fg-2); cursor: pointer; overflow-wrap: anywhere; }
.C-results button:hover { background: var(--surface-2); }
.C-results mark { background: var(--hl); color: inherit; border-radius: 2px; }
.C-tree { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 0; max-height: calc(100vh - var(--top) - 120px); min-height: 360px; overflow: auto; font: 13px/1 var(--font-mono); }
.C-row { display: flex; align-items: center; gap: 7px; min-height: 28px; padding: 0 10px 0 calc(8px + var(--d) * 18px); cursor: pointer; white-space: nowrap; background-image: repeating-linear-gradient(90deg, var(--line-2) 0 1px, transparent 1px 18px); background-size: calc(var(--d) * 18px) 100%; background-position: 16px 0; background-repeat: no-repeat; min-width: max-content; }
.C-row:hover { background-color: var(--surface-2); }
.C-row.sel { background-color: var(--accent-soft); }
.C-row.sel .C-k { color: var(--accent); }
.C-row.dim { opacity: .3; }
.C-car { flex: 0 0 16px; height: 16px; border: 0; background: none; padding: 0; color: var(--muted); cursor: pointer; display: grid; place-items: center; font: 10px var(--font-mono); transition: transform .12s; }
.C-car[aria-expanded="true"] { transform: rotate(90deg); }
.C-car.leaf { visibility: hidden; }
.C-dot { flex: 0 0 8px; height: 8px; border-radius: 2px; background: var(--rc); }
.C-k { color: var(--fg); font-weight: 600; }
.C-k.mem { color: var(--accent); }
.C-k.rec { color: var(--muted); font-weight: 500; font-style: italic; }
.C-req { color: var(--r-behavior); font-weight: 700; margin-left: -4px; }
.C-ty { color: var(--muted); font-size: 11.5px; }
.C-row .tm { padding: 2px 5px; font-size: 10.5px; }
.C-detail { position: sticky; top: var(--top); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px 24px; max-height: calc(100vh - var(--top) - 16px); overflow: auto; min-width: 0; }
.C-detail h3 { font: 600 24px/1.2 var(--font-mono); margin: 10px 0 10px; overflow-wrap: anywhere; }
.C-detail h3.mem { color: var(--accent); }
.C-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.C-detail .d { color: var(--fg-2); margin: 14px 0 0; max-width: 64ch; }
.C-sec { margin-top: 20px; }
.C-sec h4 { font: 700 11px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.C-kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; font-size: 13.5px; margin: 0; }
.C-kv dt { color: var(--muted); }
.C-kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.C-bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--surface-2); margin-bottom: 10px; }
.C-bar span { background: var(--rc); }
.C-kids { display: grid; gap: 10px; }
.C-kg { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px; align-items: start; }
.C-kg > span:first-child { font: 700 11px/1.9 var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--rc); }
.C-kg div { display: flex; flex-wrap: wrap; gap: 5px; }
.C-kb { border: 1px solid color-mix(in srgb, var(--rc) 35%, var(--line)); background: color-mix(in srgb, var(--rc) 7%, var(--surface)); color: var(--fg); border-radius: 6px; padding: 2px 7px; font: 12.5px var(--font-mono); cursor: pointer; }
.C-kb:hover { border-color: var(--rc); }
.C-kb.q::after { content: "*"; color: var(--r-behavior); font-weight: 700; margin-left: 1px; }
@media (max-width: 900px) {
  .C { grid-template-columns: minmax(0, 1fr); }
  .C-tree { max-height: 55vh; min-height: 0; }
  .C-detail { position: static; max-height: none; padding: 16px; }
  .C-kg { grid-template-columns: minmax(0, 1fr); gap: 4px; }
}

eados","    top_member:","      en-us: Member with most blocks","      pt-br: Membro com mais bloqueios","    not_deleted:","      en-us: Messages I could not delete","      pt-br: Mensagens que eu não consegui apagar","","panel:","  info:","    title:","      en-us: 🔎 Why did a link get through?","      pt-br: 🔎 Por que um link passou?","    description:","      en-us: \"Right click the message, pick **Apps** and then **Check Link Blocking**: I show you which rule allowed or blocked every link in it!\"","      pt-br: \"Clique com o botão direito na mensagem, escolha **Apps** e depois **Validar Bloqueio de Link**: eu te mostro qual regra liberou ou bloqueou cada link dela!\"","","# open: response names -> a response embed","responses:","  check:","    title:","      en-us: ✅ I would let this message through","      pt-br: ✅ Eu deixaria essa mensagem passar","    # open: states the check picks -> the title drawn in that state","    variants:","      blocked:","        title:","          en-us: 🚫 I would block this message","          pt-br: 🚫 Eu bloquearia essa mensagem","    # open: the three steps of the check -> a stacked field","    fields:","      feature:","        title:","          en-us: 1️⃣ Is the feature active?","          pt-br: 1️⃣ A função está ativa?","        # open: the feature's states -> the line the step shows","        lines:","          not_configured:","            en-us: ❌ I'm not set up here yet, so I block no links at all. Use `/moderations block links` to get started!","            pt-br: ❌ Ainda não fui configurado aqui, então não bloqueio link nenhum. Use `/moderações bloquear links` para começar!","          paused:","            en-us: ⏸️ I'm paused here, so I let every link through. Bring me back with `/moderations block links`!","            pt-br: ⏸️ Estou pausado por aqui, então deixo todos os links passarem. Me reative com `/moderações bloquear links`!","          active:","            en-us: ✅ I'm active, in **$mode** mode.","     <dt>${esc(u('schema'))}</dt><dd>${t.schema ? `<code class="ic">${esc(t.schema)}</code>` : `<span class="pend">${esc(u('pending'))}</span>`}</dd>
    <dt>${esc(u('readBy'))}</dt><dd><ul>${readers}</ul></dd></dl>`;
  if (!t.root) return head + `<div class="callout">${esc(u('noSchema'))}</div>`;
  const title = `<h3 class="A-h3">${esc(u('attributes'))} <span>${esc(u('byRole'))}</span></h3>`;
  if (p.rootModel) {
    const o = obj(p.rootModel);
    return head + title + `<p class="A-mdesc">${goLink(p.rootModel, p.rootModel)} · ${desc(o.d)}</p>${attrList(o.f, p.rootModel, [], new Set([p.rootModel]), st)}`;
  }

  return head + title + whole + (t.to ? expansion(t.to, [], '@', new Set(), st) : `<p class="note">${esc(u('leafFile'))}</p>`);
}
function attrList(fields, owner, base, anc, st) {
  const g = {};

  return GROUPS.filter(r => g[r]).map(r =>
    `<div class="role-${r}"><div class="A-grp-h"><i></i>${esc(roleName(r))} <em>${g[r].length}</em></div>${g[r].map(f => attrRow(f, owner, base, anc, st)).join('')}</div>`).join('');
}
function attrRow(f, owner, base, anc, st) {

    const lab = f.to.k === 'model' ? u(open ? 'hideChild' : 'showChild') : f.to.k === 'kinds' ? u(open ? 'hideKinds' : 'showKinds', { n }) : u(open ? 'hideShapes' : 'showShapes', { n });
    more = `<button class="A-tog" data-pk="${esc(pk)}" aria-expanded="${open}">${esc(lab)}</button>${open ? `<div class="A-kids">${expansion(f.to, path, pk, anc, st)}</div>` : ''}`;
  }
  const meta = [];
  if (f.df !== undefined) meta.push(`<span class="df">${esc(u('default'))} <code>${esc(f.df)}</code></span>`);
  rulesOf(f).forEach(r => meta.push(`<span class="df">${r}</span>`));
  if (f.mk === 'map') meta.push(`<span class="df">${esc(u('openKeys'))}: ${esc(u('youChoose'))}${(f.o || []).map(c => ` <code>${esc(c)}</code>`).join('')}</span>`);
  if (f.ex) meta.push(`<span class="df">${esc(u('values'))} ${f.ex.map(v => `<code>${esc(v)}</code>`).join(' ')}</span>`);
  const d = desc(f.d) || `<span class="missing">${esc(u('noDesc'))}</span>`;
  return `<div class="A-row role-${roleOf(f)}" data-pk="${esc(pk)}" data-om="${esc(owner + '.' + f.n)}" tabindex="-1">
    <div class="A-h"><code class="A-n">${esc(f.n)}</code><span class="tl">${label(f.t, goLink)}</span>${typeChip(f.mk)}${f.q ? reqChip() : ''}${isShared(owner, f.n) ? sharedChip() : ''}${treeBtn(pk)}</div>
    <p class="A-d d">${d}</p>${meta.length ? `<div class="A-meta">${meta.join('')}</div>` : ''}${more}</div>`;

function expansion(to, path, pk, anc, st) {
  if (anc.has(to.n)) {
    const name = to.k === 'shapes' ? to.m.join(' | ') : to.n;
    const target = to.k === 'shapes' ? `data-at="${esc(canonId(to.n) || '#')}"` : `data-goto="${esc(to.n)}"`;
    return `<p class="A-rec">${esc(u('sameAs', { n: name }))} <button ${target}>${esc(u('goTo', { n: name }))}</button></p>`;
  }
  const a2 = new Set(anc); a2.add(to.n);
  if (to.k === 'model') return crumb(path, 'A-kcrumb') + attrList(obj(to.n).f, to.n, path, a2, st);
  const key = to.k === 'kinds' ? uni(to.n).key : null;
  const members = to.k === 'kinds' ? uni(to.n).m.map(m => [m.tag, m.model]) : to.m.map(m => [m, m]);
  const mv = members.find(m => m[1] === st.pick[pk]) || members[0];
  const mpath = path.concat(key ? `${key}=${mv[0]}` : '@' + mv[1]);
  a2.add(mv[1]);
  const group = key ? `${u('pickedBy')} ${key}` : u('shapesInside', { n: members.length });
  return `${crumb(mpath, 'A-kcrumb')}
    <div class="A-picks" role="group" aria-label="${esc(group)}">${members.map(([v, m]) => `<button class="A-pick" data-pk="${esc(pk)}" data-m="${esc(m)}" aria-pressed="${m === mv[1]}">${esc(v)}</button>`).join('')}</div>
    <p class="A-mdesc">${desc(obj(mv[1]).d)} ${goLink(mv[1], mv[1])}</p>

function openAt(id) {
  const ix = IX();
  let ch = ix.byId[id];
  if (!ch) return null;
  const last = ch[ch.length - 1];
  if (last.k === 'rec') ch = ix.canon[last.name] || ch;
  const st = sub('A');
  let focus = null;
  ch.forEach((n, i) => {
    if (n.k !== 'f') return;
    focus = n.path.join('/');
    if (n.f.to && i + 1 < ch.length) {
      st.open.add(focus);

}
function focusRow(pk) {
  const row = [...document.querySelectorAll('.A-row')].find(r => r.dataset.pk === pk);
  if (!row) return;
  row.scrollIntoView({ block: 'center' });
  row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash');
  row.dispatchEvent(new MouseEvent('mouseover', { bubbles: true }));
}
function toRef(id) {
  const focus = openAt(id);
  focusAt = focus;
  go({ view: 'ref', page: '@' }, focus);
}
function showInTree(id) {
  reveal(sub('C'), id);
  go({ view: 'tree', node: id });
}

/* Tree: the whole file at once, details on click */
function reveal(st, id) {
  const ch = IX().byId[id]; if (!ch) return;
  st.open.add('#'); ch.slice(0, -1).forEach(n => st.open.add(nodeId(n)));
  st.sel = id;
}
function C(el) {
  const t = CT();
  if (!t.root) { el.innerHTML = `<div class="callout">${esc(u('noTree'))}</div>`; return; }
  const st = sub('C');
  if (S.node !== st.sel && IX().byId[S.node]) reveal(st, S.node);
  const used = new Set();
  (t.models || []).forEach(m => m.f.forEach(f => used.add(roleOf(f))));
  const chips = GROUPS.filter(r => r !== 'other' || used.has(r));
  el.innerHTML = `<div class="C">
    <div class="C-tools">
      <div class="C-search"><input id="C-q" type="search" placeholder="${esc(u('search'))}" value="${esc(st.q)}" aria-label="${esc(u('search'))}" autocomplete="off"></div>
      <button class="btn" id="C-exp">${esc(u('expandAll'))}</button><button class="btn" id="C-col">${esc(u('collapse'))}</button>
      <div class="C-roles" role="group" aria-label="${esc(u('filterRoles'))}"><button class="rc role-none" data-role="" aria-pressed="${st.roles.size === 0}"><i></i>${esc(u('allRoles'))}</button>${chips.map(r => `<button class="rc role-${r}${st.roles.size && !st.roles.has(r) ? ' off' : ''}" data-role="${r}" aria-pressed="${st.roles.has(r)}"><i></i>${esc(roleName(r))}</button>`).join('')}</div>
    </div>
    <div class="C-results" id="C-res" hidden></div>
    <div class="C-tree" id="C-tree" role="tree" aria-label="${esc(t.name)}"></div>
    <aside class="C-detail" id="C-detail"></aside></div>`;
  const tree = el.querySelector('#C-tree');
  const draw = () => { tree.innerHTML = treeRows(IX().root, 0, st); };
  const detail = () => { el.querySelector('#C-detail').innerHTML = detailC(st); S.node = st.sel; writeHash(false); };
  const toSel = mode => { const r = tree.querySelector('.C-row.sel'); if (!r) return; const top = r.offsetTop - tree.offsetTop; if (mode === 'center' || top < tree.scrollTop || top > tree.scrollTop + tree.clientHeight - 30) tree.scrollTop = Math.max(0, top - tree.clientHeight / 2); };
  draw(); detail(); search(el, st); toSel('center');
  tree.addEventListener('click', e => {
    const row = e.target.closest('.C-row'); if (!row) return;
    const id = row.dataset.id;
    if (e.target.closest('.C-car')) { if (st.open.has(id)) st.open.delete(id); else st.open.add(id); draw(); return; }
    if (row.dataset.rec) { reveal(st, row.dataset.rec); draw(); detail(); toSel('center'); return; }
    st.sel = id; if (row.dataset.kids === '1' && !st.open.has(id)) st.open.add(id);
    draw(); detail();
  });
  tree.addEventListener('keydown', e => {
    const rows = [...tree.querySelectorAll('.C-row')];
    const i = rows.findIndex(r => r.dataset.id === st.sel);
    const refocus = () => { const s = tree.querySelector('.C-row.sel'); if (s) { s.focus({ preventScroll: true }); toSel('nearest'); } };
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const r = rows[Math.min(rows.length - 1, Math.max(0, i + (e.key === 'ArrowDown' ? 1 : -1)))]; if (r) { st.sel = r.dataset.id; draw(); detail(); refocus(); } }
    if (e.key === 'ArrowRight' && i >= 0) { e.preventDefault(); st.open.add(st.sel); draw(); refocus(); }
    if (e.key === 'ArrowLeft' && i >= 0) { e.preventDefault(); st.open.delete(st.sel); draw(); refocus(); }
    if (e.key === 'Enter' && i >= 0) { e.preventDefault(); toRef(st.sel); }
  });
  el.querySelector('#C-detail').addEventListener('click', e => {
    const r = e.target.closest('[data-ref]'); if (r) { toRef(r.dataset.ref); return; }
    const b = e.target.closest('[data-sel]'); if (!b) return;
    reveal(st, b.dataset.sel); draw(); detail(); toSel('nearest');
  });
  el.querySelector('#C-exp').addEventListener('click', () => { IX().all.forEach(ch => { const n = ch[ch.length - 1]; if (ch.length < 8 && hasKids(n)) st.open.add(nodeId(n)); }); st.open.add('#'); draw(); });
  el.querySelector('#C-col').addEventListener('click', () => { st.open = new Set(['#']); st.sel = '#'; draw(); detail(); });
  el.querySelector('.C-roles').addEventListener('click', e => {
    const b = e.target.closest('[data-role]'); if (!b) return;
    const r = b.dataset.role;
    if (!r) st.roles.clear(); else if (st.roles.has(r)) st.roles.delete(r); else st.roles.add(r);
    C(el);
  });
  el.querySelector('#C-q').addEventListener('input', e => { st.q = e.target.value; search(el, st); });
  el.querySelector('#C-res').addEventListener('click', e => { const b = e.target.closest('[data-sel]'); if (!b) return; reveal(st, b.dataset.sel); draw(); detail(); toSel('center'); });
}
function search(el, st) {
  const box = el.querySelector('#C-res');
  const terms = st.q.trim().toLowerCase().split(/\s+/).filter(x => x.length > 1);
  if (!terms.length) { box.hidden = true; return; }
  const hits = IX().all.filter(ch => { const n = ch[ch.length - 1]; if (n.k === 'rec') return false; const p = pathText(n.path).toLowerCase(); return terms.every(x => p.includes(x)); });
  box.hidden = false;
  const rx = new RegExp(terms.map(x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'gi');
  box.innerHTML = `<p class="note" style="margin:2px 8px 6px">${esc(u('results', { n: hits.length }))}</p>` + hits.slice(0, 80).map(ch => {
    const n = ch[ch.length - 1];
    return `<button data-sel="${esc(nodeId(n))}">${esc(pathText(n.path)).replace(rx, m => `<mark>${m}</mark>`)}</button>`;
  }).join('');
}
function treeRows(n, d, st) {
  const id = nodeId(n);
  const has = hasKids(n);
  const open = st.open.has(id);
  const dim = st.roles.size && n.k === 'f' && !st.roles.has(roleOf(n.f));
  let lab;
  if (n.k === 'root') lab = `<code class="C-k">${esc(CT().name)}</code>${typeChip(rootMark(CT().root))}<span class="C-ty">${label(CT().root, null, true)}</span>`;
  else if (n.k === 'm') lab = `<code class="C-k mem">${esc(nodeName(n))}</code><span class="C-ty">${n.key ? esc(n.model) : ''}</span>`;
  else if (n.k === 'rec') lab = `<code class="C-k rec">↻ ${esc(u('recNode', { n: n.name }))}</code>`;
  else lab = `<code class="C-k">${esc(n.f.s)}</code>${n.f.q ? `<span class="C-req" title="${esc(u('required'))}">*</span>` : ''}${typeChip(n.f.mk)}<span class="C-ty">${label(n.f.t, null, true)}</span>`;
  const role = n.k === 'f' ? roleOf(n.f) : 'none';
  let html = `<div class="C-row role-${role}${st.sel === id ? ' sel' : ''}${dim ? ' dim' : ''}" style="--d:${d}" data-id="${esc(id)}" data-kids="${has ? 1 : 0}"${n.k === 'rec' ? ` data-rec="${esc(canonId(n.name) || '#')}"` : ''} role="treeitem"${has ? ` aria-expanded="${open}"` : ''} aria-selected="${st.sel === id}" tabindex="${st.sel === id ? 0 : -1}">
    <button class="C-car${has ? '' : ' leaf'}" aria-expanded="${open}" tabindex="-1" aria-label="${esc(nodeName(n))}">▶</button>${n.k === 'f' ? '<span class="C-dot"></span>' : ''}${lab}</div>`;
  if (has && open) html += kids(n).map(c => treeRows(c, d + 1, st)).join('');
  return html;
}
function kidsBlock(fields, base) {
  const counts = {};
  fields.forEach(f => { counts[roleOf(f)] = (counts[roleOf(f)] || 0) + 1; });
  const order = GROUPS.filter(r => counts[r]);
  const bar = order.map(r => `<span class="role-${r}" style="flex:${counts[r]}" title="${esc(roleName(r))}: ${counts[r]}"></span>`).join('');
  const groups = order.map(r => `<div class="C-kg role-${r}"><span>${esc(roleName(r))} · ${counts[r]}</span><div>${fields.filter(f => roleOf(f) === r).map(f => `<button class="C-kb${f.q ? ' q' : ''}" data-sel="${esc(base.concat(f.s).join('/'))}" title="${esc(said(f.d))}">${esc(f.n)}</button>`).join('')}</div></div>`).join('');
  return `<div class="C-sec"><h4>${esc(u('kids', { n: fields.length }))}</h4><div class="C-bar">${bar}</div><div class="C-kids">${groups}</div></div>`;
}
function exampleBlock(x) {
  if (!x) return `<p class="note">${esc(u('notUsed'))}</p>`;
  return `<pre class="code-snip">${esc(x.c)}</pre><p class="src">${esc(x.f)}:${x.l}</p>`;
}
function kindChips(to, path) {
  const items = to.k === 'kinds' ? uni(to.n).m.map(m => [m.tag, path.concat(`${uni(to.n).key}=${m.tag}`)]) : to.m.map(m => [m, path.concat('@' + m)]);
  const title = to.k === 'kinds' ? u('kindsInside', { n: items.length }) : u('shapesInside', { n: items.length });
  return `<div class="C-sec"><h4>${esc(title)}</h4><div class="C-chips">${items.map(([v, p]) => `<button class="C-kb role-none" data-sel="${esc(p.join('/'))}">${esc(v)}</button>`).join('')}</div></div>`;
}
function detailC(st) {
  const t = CT(), ix = IX();
  const chain = ix.byId[st.sel] || [ix.root];
  const n = chain[chain.length - 1];
  const crumbs = `<div class="crumb">` + chain.map((c, i) =>
    (i ? '<span class="x">›</span>' : '') + `<button class="s${c.k === 'm' ? ' k' : ''}${i === chain.length - 1 ? ' f' : ''}" data-sel="${esc(nodeId(c))}">${esc(nodeName(c))}</button>`).join('') + `</div>`;
  const ref = n.k === 'rec' ? '' : `<div class="C-sec" style="margin-top:14px"><button class="btn" data-ref="${esc(nodeId(n))}">${REF_ICON}${esc(u('openInRef'))}</button></div>`;
  let head = '', body = '', inside = null;
  if (n.k === 'root') {
    head = `<h3>${esc(t.name)}</h3><div class="C-chips">${typeChip(rootMark(t.root))}<span class="tl">${label(t.root)}</span></div><p class="d">${desc(t.purpose)}</p>`;
    body = `<div class="C-sec"><p class="src" style="margin:0">${esc(t.glob)} · ${esc(files(t.files.length))}</p></div>`;
    if (t.to && t.to.k === 'model') inside = { fields: obj(t.to.n).f, base: [] };
    else if (t.to) body += kindChips(t.to, []);
  } else if (n.k === 'm') {
    const o = obj(n.model);
    head = `<h3 class="mem">${esc(nodeName(n))}</h3><div class="C-chips">${typeChip('object')}<span class="tl">${esc(n.model)}</span></div><p class="d">${desc(o.d)}</p>`;
    const note = n.union ? u('unionOf', { n: uni(n.union).m.length, u: n.union, k: n.key }) : u('shapeUnion', { n: n.shapes.m.length });
    body = `<div class="C-sec"><p class="note" style="margin:0">${esc(note)}</p></div>`;
    if (n.mem) body += `<div class="C-sec"><h4>${esc(u('example'))}</h4>${exampleBlock(n.mem.x)}</div>`;
    inside = { fields: o.f, base: n.path };
  } else if (n.k === 'rec') {
    head = `<h3>↻ ${esc(n.name)}</h3><p class="d">${esc(u('sameAs', { n: n.name }))}</p>`;
    const target = canonId(n.name);
    if (target) body = `<div class="C-sec"><button class="btn" data-sel="${esc(target)}">${esc(u('goTo', { n: n.name }))}</button></div>`;
  } else {
    const f = n.f, to = f.to;
    head = `<h3>${esc(f.n)}</h3><div class="C-chips">${roleChip(roleOf(f))}${typeChip(f.mk)}${f.q ? reqChip() : optChip()}${isShared(n.owner, f.n) ? sharedChip() : ''}</div><p class="d">${desc(f.d) || `<span class="missing">${esc(u('noDesc'))}</span>`}</p>`;
    const kv = [[u('type'), `<span class="tl">${label(f.t)}</span>`], [u('path'), `<code class="ic">${esc(pathText(n.path))}</code>`]];
    if (f.df !== undefined) kv.push([u('default'), `<code class="ic">${esc(f.df)}</code>`]);
    const rules = rulesOf(f);
    if (rules.length) kv.push([u('rules'), rules.join(', ')]);
    if (f.mk === 'map') {
      const child = f.t.k === 'open' ? (f.t.c || [{ k: 'any' }])[0] : f.t;
      kv.push([u('openKeys'), esc(u('youChoose')) + (f.o || []).map(c => `<br><code class="ic">${esc(c)}</code>`).join('')], [u('eachValue'), `<span class="tl">${label(child)}</span>`]);
    }
    if (f.ex) kv.push([u('values'), f.ex.map(v => `<code class="ic">${esc(v)}</code>`).join(' ')]);
    if (f.u) kv.push([u('usedBy'), esc(u(f.u[1] === 1 ? 'usedOne' : 'usedCount', { u: f.u[0], f: f.u[1] }))]);
    kv.push([u('role'), esc(L(ROLE_TXT[roleOf(f)][1]))]);
    body = `<div class="C-sec"><dl class="C-kv">${kv.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${b}</dd>`).join('')}</dl></div>`;
    const fresh = to && !n.anc.has(to.n);
    if (fresh && to.k === 'model') {
      const wrap = f.t.k === 'list' ? u('each') + ': ' : f.t.k === 'open' ? u('mapOf') + ': ' : '';
      body += `<div class="C-sec"><h4>${esc(wrap + to.n)}</h4><p class="d" style="margin:0">${desc(obj(to.n).d)}</p></div>`;
      inside = { fields: obj(to.n).f, base: n.path };
    }
    body += `<div class="C-sec"><h4>${esc(u('example'))}</h4>${exampleBlock(f.x)}</div>`;
    if (fresh && to.k !== 'model') body += kindChips(to, n.path);
  }
  if (inside) body += kidsBlock(inside.fields, inside.base);
  return crumbs + head + ref + body;
}

const first = parseHash();
apply(first);
if (first.at && S.type) focusAt = openAt(first.at);
render();
})();

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "A version already released, to run again (e.g. v0.9.0)"
        required: true

concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}/keiko-bot
  VERSION: ${{ github.event.release.tag_name || inputs.version }}

jobs:
  check:
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-test.txt

      - name: Run the test suite
        run: make test

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker buildx build \
            --build-arg APPLICATION_ENVIRONMENT=prod \
            -t ${{ env.REGISTRY }}:${{ env.VERSION }} \
            -t ${{ env.REGISTRY }}:latest .

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}:${{ env.VERSION }}
          docker push ${{ env.REGISTRY }}:latest

  deploy:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: self-hosted
    env:
      MEMORY_LIMIT: 1536m
      STOP_GRACE_SECONDS: 30
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull the version
        run: docker pull ${{ env.REGISTRY }}:${{ env.VERSION }}

      - name: Replace the running container
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          docker stop -t "$STOP_GRACE_SECONDS" keiko-bot || true
          docker rm keiko-bot || true
          docker run -d --name keiko-bot --restart unless-stopped \
            -p 127.0.0.1:5000:5000 -p 127.0.0.1:8000:8000 \
            --memory "$MEMORY_LIMIT" --memory-swap "$MEMORY_LIMIT" \
            --stop-timeout "$STOP_GRACE_SECONDS" \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_REGION \
            -e APP_VERSION="$VERSION" \
            ${{ env.REGISTRY }}:${{ env.VERSION }}

      - name: Check the bot stayed up
        env:
          READY: Keiko is connected to Discord and ready
          REFUSED_START: Discord refused to start the bot
          READY_DEADLINE_SECONDS: 120
          SETTLE_SECONDS: 30
          POLL_SECONDS: 5
        run: |
          for ((poll = 0; ; poll++)); do
            if ! logs=$(docker logs keiko-bot 2>&1); then
              echo "docker logs keiko-bot failed: $logs"
              exit 1
            fi
            refused=$(printf '%s\n' "$logs" | grep -F -m 1 "$REFUSED_START" || true)
            if [ -n "$refused" ]; then
              echo "$refused"
              echo "It retries every few minutes until stopped: docker stop keiko-bot, or run the previous version again."
              exit 1
            fi
            restarts=$(docker inspect -f '{{.RestartCount}}' keiko-bot)
            if [ "$restarts" -gt 0 ]; then
              echo "keiko-bot restarted $restarts time(s); its last lines:"
              printf '%s\n' "$logs" | tail -n 30
              exit 1
            fi
            if [[ "$logs" == *"$READY"* ]] && (( poll * POLL_SECONDS >= SETTLE_SECONDS )); then
              break
            fi
            if (( poll * POLL_SECONDS >= READY_DEADLINE_SECONDS )); then
              echo "keiko-bot was not ready after $READY_DEADLINE_SECONDS s; its last lines:"
              printf '%s\n' "$logs" | tail -n 30
              exit 1
            fi
            sleep "$POLL_SECONDS"
          done
          state=$(docker inspect -f '{{.State.Status}} {{.RestartCount}}' keiko-bot)
          echo "keiko-bot ready, and up for $((poll * POLL_SECONDS)) s: $state"
          test "$state" = "running 0"

      - name: Remove images no container uses
        run: docker image prune -af

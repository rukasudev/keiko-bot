name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-test.txt

      - name: Lint the form platform
        run: make lint

      - name: Run the test suite
        run: make test
